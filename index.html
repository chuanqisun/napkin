<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Napkin Sketch</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d3557' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 19l7-7 3 3-7 7-3-3z'/%3E%3Cpath d='M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z'/%3E%3Cpath d='M2 2l7.586 7.586'/%3E%3C/svg%3E" />
  <script type="module">
    // Conditional polyfills per Chrome Modern Web Guidance (only loaded when native support is missing)
    if (!Object.hasOwn(HTMLElement.prototype, 'popover')) {
      import('https://unpkg.com/@oddbird/popover-polyfill@latest/dist/popover.min.js');
    }
    if (!('commandForElement' in HTMLButtonElement.prototype)) {
      import('https://esm.run/invokers-polyfill');
    }
  </script>
  <style>
    :root {
      --bg: #d9cbb5;
      --paper: #e7dbc6;
      --bar-bg: rgba(248, 243, 234, 0.94);
      --bar-border: rgba(92, 74, 52, 0.18);
      --ink-ui: #23201c;
      --ink-muted: #6e6457;
      --active-bg: #23201c;
      --active-fg: #f8f3ea;
      --hover-bg: rgba(35, 32, 28, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100dvh; width: 100vw; overflow: hidden;
      background: var(--bg); color: var(--ink-ui);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 13px; -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex; flex-direction: column; height: 100dvh; width: 100vw;
    }

    header.toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 4px; padding: 7px 10px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-border);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      z-index: 20;
    }

    .group { display: flex; align-items: center; gap: 2px; }
    .divider { width: 1px; height: 20px; background: var(--bar-border); margin: 0 2px; flex-shrink: 0; }

    .brand {
      font-weight: 600; font-size: 13px; letter-spacing: -0.01em;
      padding: 0 4px 0 2px; color: var(--ink-ui); white-space: nowrap;
      display: flex; align-items: center; gap: 5px;
    }

    button.tool-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      height: 32px; padding: 0 6px;
      border: 1px solid transparent; border-radius: var(--radius);
      background: transparent; color: var(--ink-ui);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
      white-space: nowrap;
    }
    button.tool-btn:hover { background: var(--hover-bg); }
    button.tool-btn.active { background: var(--active-bg); color: var(--active-fg); }
    button.tool-btn svg {
      width: 16px; height: 16px; flex-shrink: 0;
      stroke: currentColor; fill: none; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .swatches { display: flex; align-items: center; gap: 6px; padding: 0 4px; }
    button.swatch {
      width: 20px; height: 20px; border-radius: 50%; padding: 0;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    button.swatch:hover { transform: scale(1.12); }
    button.swatch.active {
      box-shadow: 0 0 0 2px var(--bar-bg), 0 0 0 3.5px var(--ink-ui);
    }

    /* Combined Pen + Style button & Café Menu button (Declarative Popover triggers) */
    button#pen-btn {
      anchor-name: --pen-anchor;
      padding: 0 8px 0 6px;
      border: 1px solid var(--bar-border);
      background: rgba(255, 255, 255, 0.50);
      gap: 6px;
    }
    button#pen-btn:hover { background: rgba(255, 255, 255, 0.85); }
    button#pen-btn .pen-mini {
      width: 38px; height: 14px; object-fit: contain; display: block;
      filter: drop-shadow(0 1px 1px rgba(35, 32, 28, 0.16));
    }

    button#drink-menu-btn {
      anchor-name: --drink-anchor;
      position: relative;
      padding: 0 9px;
      border: 1px solid var(--bar-border);
      background: rgba(255, 255, 255, 0.50);
      gap: 5px;
    }
    button#drink-menu-btn:hover { background: rgba(255, 255, 255, 0.85); }
    button#drink-menu-btn .menu-dot {
      display: none;
      width: 7px; height: 7px; border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.65);
      animation: menuDotPulse 1.9s ease-out infinite;
    }
    button#drink-menu-btn.menu-prominent {
      background: #23201c;
      color: #f8f3ea;
      border-color: #23201c;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(35, 32, 28, 0.24), 0 0 0 2px rgba(245, 158, 11, 0.35);
    }
    button#drink-menu-btn.menu-prominent:hover { background: #36312a; }
    button#drink-menu-btn.menu-prominent .menu-dot { display: inline-block; }

    @keyframes menuDotPulse {
      0%   { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.72); }
      70%  { box-shadow: 0 0 0 7px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    /* Declarative Top-Layer Popovers (native :popover-open + polyfill .\:popover-open) */
    .napkin-popover {
      margin: 0;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(92, 74, 52, 0.24);
      background: rgba(248, 243, 234, 0.98);
      color: var(--ink-ui);
      box-shadow: 0 14px 36px rgba(45, 32, 18, 0.22), 0 2px 6px rgba(45, 32, 18, 0.08);
      backdrop-filter: blur(12px);
      display: none;
      inset: auto;
      top: 52px;
      right: 16px;
      max-width: calc(100vw - 24px);
    }
    .napkin-popover:is(:popover-open, .\:popover-open) {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #pen-menu {
      width: 318px;
      position-anchor: --pen-anchor;
      top: calc(anchor(bottom) + 6px);
      right: anchor(right);
    }
    #drink-menu {
      width: 286px;
      position-anchor: --drink-anchor;
      top: calc(anchor(bottom) + 6px);
      right: anchor(right);
    }
    .pop-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-bottom: 7px; border-bottom: 1px solid var(--bar-border);
    }
    .pop-title { font-size: 12.5px; font-weight: 700; color: var(--ink-ui); }
    .pop-sub { font-size: 11px; color: var(--ink-muted); }
    .pop-close {
      width: 24px; height: 24px; padding: 0; border-radius: 6px;
      border: 1px solid var(--bar-border); background: rgba(255, 255, 255, 0.55);
      color: var(--ink-ui); font-size: 15px; line-height: 1; cursor: pointer;
    }
    .pop-close:hover { background: var(--hover-bg); }
    .pop-sec-lbl {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--ink-muted);
    }

    /* Pen chooser list */
    .pen-list { display: flex; flex-direction: column; gap: 5px; }
    button.pen-opt {
      display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px;
      padding: 6px 9px; text-align: left;
      border-radius: 8px; border: 1px solid rgba(92, 74, 52, 0.16);
      background: rgba(255, 255, 255, 0.55); color: var(--ink-ui);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    button.pen-opt:hover { background: rgba(255, 255, 255, 0.92); border-color: rgba(92, 74, 52, 0.34); }
    button.pen-opt.active { background: var(--active-bg); color: var(--active-fg); border-color: var(--active-bg); }
    button.pen-opt img {
      width: 112px; height: 26px; object-fit: contain; display: block;
      filter: drop-shadow(0 1px 2px rgba(35, 32, 28, 0.18));
    }
    button.pen-opt .po-name { font-size: 12px; font-weight: 600; display: block; line-height: 1.2; }
    button.pen-opt .po-hint { font-size: 10.5px; color: var(--ink-muted); display: block; line-height: 1.2; }
    button.pen-opt.active .po-hint { color: rgba(248, 243, 234, 0.72); }

    /* Handwriting style preview cards inside combined Pen & Style popover */
    .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button.style-opt {
      display: flex; flex-direction: column; align-items: stretch; gap: 4px;
      padding: 5px; border-radius: 8px; text-align: left;
      border: 1px solid rgba(92, 74, 52, 0.20);
      background: rgba(255, 255, 255, 0.58); color: var(--ink-ui);
      font-size: 11px; font-weight: 600; cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    button.style-opt:hover { background: rgba(255, 255, 255, 0.94); border-color: rgba(92, 74, 52, 0.36); }
    button.style-opt.active { background: var(--active-bg); color: var(--active-fg); border-color: var(--active-bg); }
    button.style-opt canvas.style-prev {
      display: block; width: 100%; height: 34px; border-radius: 5px;
      background: #ece1ce;
      box-shadow: inset 0 0 0 1px rgba(104, 82, 54, 0.18);
    }
    button.style-opt .so-lbl {
      display: block; padding: 0 2px; line-height: 1.15;
    }

    /* Café drink menu grid */
    .drink-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    button.drink-opt {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 6px 9px; text-align: center;
      border-radius: 9px; border: 1px solid rgba(92, 74, 52, 0.18);
      background: rgba(255, 255, 255, 0.58); color: var(--ink-ui);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
    }
    button.drink-opt:hover { background: rgba(255, 255, 255, 0.95); border-color: rgba(92, 74, 52, 0.38); transform: translateY(-1px); }
    button.drink-opt.active { border-color: var(--active-bg); box-shadow: inset 0 0 0 1px var(--active-bg); background: rgba(255, 255, 255, 0.88); }
    button.drink-opt img {
      width: 68px; height: 68px; object-fit: contain; display: block;
      filter: drop-shadow(0 3px 5px rgba(45, 32, 18, 0.18));
    }
    button.drink-opt .do-name { font-size: 12px; font-weight: 600; line-height: 1.2; }
    button.drink-opt .do-sub { font-size: 10.5px; color: var(--ink-muted); line-height: 1.15; }

    main.stage {
      position: relative; flex: 1; min-height: 0; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 38px;
      background: radial-gradient(circle at 50% 45%, #d8c9b2 0%, #c8b69b 100%);
      overflow: hidden;
    }

    .napkin-frame {
      position: relative; width: 100%; height: 100%; max-width: 1440px;
      border-radius: 6px; overflow: hidden;
      background: var(--paper);
      box-shadow:
        0 1px 2px rgba(55, 40, 22, 0.14),
        0 10px 28px rgba(55, 40, 22, 0.16),
        inset 0 0 0 1px rgba(104, 82, 54, 0.22);
    }

    canvas#c { display: block; width: 100%; height: 100%; touch-action: none; }

    /* Full-stage unclipped cup layer (allows mug & handle to overhang napkin edges naturally!) */
    canvas#cup-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    /* Invisible focus/IME proxy — the napkin canvas itself is the only visible text box */
    #inline-text {
      position: absolute; display: none;
      left: 0; top: 0;
      width: 2px; height: 28px;
      padding: 0; margin: 0;
      border: 0; outline: none;
      background: transparent; color: transparent; caret-color: transparent;
      opacity: 0; pointer-events: none;
      font-size: 16px;
    }

    /* Single Sound On/Off toolbar toggle */
    button#sound-toggle { position: relative; }
    button#sound-toggle .snd-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #15803d; display: inline-block;
      transition: background 0.15s ease;
    }
    button#sound-toggle .snd-icon-off { display: none; }
    button#sound-toggle.muted { color: var(--ink-muted); }
    button#sound-toggle.muted .snd-dot { background: #a89f91; }
    button#sound-toggle.muted .snd-icon-on { display: none; }
    button#sound-toggle.muted .snd-icon-off { display: inline; }

    /* Compact Save format popover */
    .save-wrap { position: relative; display: inline-flex; align-items: center; }
    .save-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      min-width: 196px;
      padding: 5px;
      border-radius: 10px;
      background: rgba(248, 243, 234, 0.98);
      border: 1px solid rgba(92, 74, 52, 0.24);
      box-shadow: 0 10px 26px rgba(45, 32, 18, 0.18), 0 2px 6px rgba(45, 32, 18, 0.08);
      backdrop-filter: blur(10px);
      display: none; flex-direction: column; gap: 2px;
      z-index: 45;
    }
    .save-menu.open { display: flex; }
    .save-menu button {
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      width: 100%; padding: 7px 9px;
      border: none; border-radius: 7px;
      background: transparent; color: var(--ink-ui);
      text-align: left; cursor: pointer;
      transition: background 0.12s ease;
    }
    .save-menu button:hover { background: var(--hover-bg); }
    .save-menu .sm-title { font-size: 12px; font-weight: 600; }
    .save-menu .sm-sub { font-size: 10.5px; color: var(--ink-muted); }

    /* Full-viewport overlay for the crumpled napkin ball throw animation */
    canvas#crumple-overlay {
      position: fixed; inset: 0; width: 100vw; height: 100dvh;
      pointer-events: none; z-index: 60; display: none;
    }

    @media (max-width: 1180px) {
      button.tool-btn .lbl { display: none; }
      button.tool-btn { padding: 0 8px; }
    }
    @media (max-width: 680px) {
      header.toolbar { padding: 6px 8px; gap: 5px; }
      main.stage { padding: 6px; }
      .divider { margin: 0 2px; }
      button.tool-btn { height: 30px; padding: 0 7px; }
      .style-select-wrap { height: 30px; padding: 0 6px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="group">
      <div class="brand">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
        Napkin
      </div>
      <div class="divider"></div>

      <button id="t-sketch" class="tool-btn active" onclick="setTool('sketch')" title="Smart Sketch (600ms multi-stroke auto-beautify) [S]">
        <svg viewBox="0 0 24 24"><path d="M4 19c2.5-3 4-9 8-9s3.5 6 8 3"/><path d="M16 5l3 3-9 9H7v-3l9-9z"/></svg>
        <span class="lbl">Sketch</span>
      </button>
      <button id="t-handwrite" class="tool-btn" onclick="setTool('handwrite')" title="Direct Handwrite (600ms burst, styled ink) [H]">
        <svg viewBox="0 0 24 24"><path d="M3 17c2-4 4-8 6-8s1.5 6 3.5 6 3-5 4.5-5 1.5 4 4 3"/><path d="M3 20h18"/></svg>
        <span class="lbl">Handwrite</span>
      </button>
      <button id="t-text" class="tool-btn" onclick="setTool('text')" title="Single-click anywhere or inside a shape to type live [T]">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>
        <span class="lbl">Text</span>
      </button>

      <div class="divider"></div>

      <button id="t-box" class="tool-btn" onclick="setTool('box')" title="Drag Box [B]">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>
        <span class="lbl">Box</span>
      </button>
      <button id="t-oval" class="tool-btn" onclick="setTool('oval')" title="Drag Oval [O]">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg>
        <span class="lbl">Oval</span>
      </button>
      <button id="t-diamond" class="tool-btn" onclick="setTool('diamond')" title="Drag Diamond [D]">
        <svg viewBox="0 0 24 24"><polygon points="12 3 21 12 12 21 3 12"/></svg>
        <span class="lbl">Diamond</span>
      </button>
      <button id="t-arrow" class="tool-btn" onclick="setTool('arrow')" title="Drag Arrow [A]">
        <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M10 5h9v9"/></svg>
        <span class="lbl">Arrow</span>
      </button>

      <div class="divider"></div>

      <button id="t-move" class="tool-btn" onclick="setTool('move')" title="Select, Move, Resize & Delete [V]">
        <svg viewBox="0 0 24 24"><path d="M4 4l7.5 16 2.8-6.2L20.5 11 4 4z"/></svg>
        <span class="lbl">Select</span>
      </button>
    </div>

    <div class="group">
      <button id="pen-btn" class="tool-btn" commandfor="pen-menu" command="toggle-popover" title="Choose Pen & Handwriting Style">
        <img id="pen-btn-img" class="pen-mini" src="./docs/vfx/pens/ballpoint.webp" alt="Selected pen" />
        <span class="lbl" id="pen-btn-lbl">Ballpoint</span>
      </button>

      <div class="divider"></div>

      <div class="swatches" role="group" aria-label="Ink color">
        <button class="swatch active" data-color="#1b3d8f" style="background:#1b3d8f;" onclick="setColor('#1b3d8f', this)" title="Ballpoint Blue"></button>
        <button class="swatch" data-color="#1c1e22" style="background:#1c1e22;" onclick="setColor('#1c1e22', this)" title="Black Ink"></button>
        <button class="swatch" data-color="#b91c1c" style="background:#b91c1c;" onclick="setColor('#b91c1c', this)" title="Red Ink"></button>
      </div>

      <div class="divider"></div>

      <button id="drink-menu-btn" class="tool-btn menu-prominent" commandfor="drink-menu" command="toggle-popover" title="Open Café Menu to order a drink">
        <svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
        <span class="lbl">Menu</span>
        <span class="menu-dot" aria-hidden="true"></span>
      </button>

      <div class="divider"></div>

      <button id="sound-toggle" class="tool-btn" onclick="NapkinAudio.toggleMute()" aria-pressed="true" aria-label="Sound On" title="Sound On (click to mute)">
        <svg class="snd-icon-on" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <svg class="snd-icon-off" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <span class="snd-dot"></span>
      </button>

      <div class="divider"></div>

      <button class="tool-btn" onclick="undo()" title="Undo [Ctrl+Z]">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
      </button>
      <button id="clear-btn" class="tool-btn" onclick="clearAllWithCrumple()" title="Crumple & Toss Napkin">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>
      <div class="save-wrap">
        <button id="save-btn" class="tool-btn" onclick="toggleSaveMenu(event)" title="Save Napkin (PNG or SVG with Napkin Background)">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span class="lbl">Save</span>
        </button>
        <div id="save-menu" class="save-menu" role="menu">
          <button role="menuitem" onclick="exportPNG()">
            <span class="sm-title">Save PNG Image</span>
            <span class="sm-sub">2&times; HiDPI &middot; full napkin texture &amp; ink</span>
          </button>
          <button role="menuitem" onclick="exportSVG()">
            <span class="sm-title">Save SVG Vector</span>
            <span class="sm-sub">Editable vector ink + napkin background</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="napkin-frame" id="wrap">
      <canvas id="c"></canvas>
      <input id="inline-text" type="text" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Napkin text input" />
    </div>
    <canvas id="cup-layer"></canvas>
  </main>

  <!-- Declarative Popover: Combined Pen & Handwriting Style Menu -->
  <div id="pen-menu" class="napkin-popover" popover aria-label="Pen and Handwriting Style">
    <div class="pop-head">
      <div>
        <div class="pop-title">Pen &amp; Writing Style</div>
        <div class="pop-sub">Applies to future ink &amp; pen sound</div>
      </div>
      <button class="pop-close" commandfor="pen-menu" command="hide-popover" aria-label="Close pen menu" onclick="restoreFocus('#pen-btn')">&times;</button>
    </div>
    <div class="pop-sec-lbl">Pen</div>
    <div class="pen-list" id="pen-list"></div>
    <div class="pop-sec-lbl">Handwriting Style</div>
    <div class="style-grid" id="style-grid"></div>
  </div>

  <!-- Declarative Popover: Café Drink Order Menu -->
  <div id="drink-menu" class="napkin-popover" popover aria-label="Café Drink Menu">
    <div class="pop-head">
      <div>
        <div class="pop-title">Caf&eacute; Menu</div>

<script>
// ============================================================================

const STYLE_PREVIEW_SEEDS = { cursive: 1042, print: 2077, upright: 3091, journal: 4129 };
const stylePreviewBufs = {}; // styleKey -> Float32Array strokes for "Napkin"

function paintStylePreviews() {
  for (const key of Object.keys(WRITING_STYLES)) {

    if (!cv) continue;

      const { strokes } = layoutWordsToStrokes([buf], w * 0.5, h * 0.48, 20, w - 18, currentColor, 1.45, 'center', currentPenId);

      ctx.fillStyle = 'rgba(110, 100, 87, 0.45)';

}

async function generateStylePreviews() {

// ============================================================================
// 1. PROCEDURAL LIGHT-BROWN PAPER NAPKIN TEXTURE (UNIQUE PER NAPKIN SHEET!)
// ============================================================================
const NAPKIN_PALETTES = [
  { name: 'Warm Kraft',  r: 231, g: 219, b: 198, fiberMul: 1.05, fleckMul: 1.15 },
  { name: 'Cafe Ecru',   r: 236, g: 227, b: 210, fiberMul: 0.90, fleckMul: 0.80 },
  { name: 'Toasted Oat', r: 226, g: 211, b: 185, fiberMul: 1.25, fleckMul: 1.35 },
  { name: 'Soft Linen',  r: 234, g: 224, b: 205, fiberMul: 0.95, fleckMul: 0.95 },
  { name: 'Diner Ivory', r: 240, g: 232, b: 217, fiberMul: 0.78, fleckMul: 0.65 },
  { name: 'Raw Sand',    r: 229, g: 215, b: 191, fiberMul: 1.18, fleckMul: 1.25 }
];
const EMBOSS_STYLES = ['dimple', 'linen', 'diamond', 'pinpoint'];
const BORDER_STYLES = ['none', 'double', 'dotted', 'stitch'];

let napkinSeq = 0;
let lastPaletteIdx = -1;
let lastEmbossIdx = -1;
let napkinSpec = null;
let napkinBgCache = null; // { id, w, h, dpr, canvas }

function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function clampByte(v) { return Math.max(0, Math.min(255, Math.round(v))); }
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => clampByte(v).toString(16).padStart(2, '0')).join('');
}

function createNapkinSpec() {
  const seed = (Math.floor(Math.random() * 0xffffffff) ^ (Date.now() & 0xffffffff) ^ ((++napkinSeq) * 2654435761)) >>> 0;
  const rnd = makeRng(seed);

  // Pick a fresh palette & embossing pattern distinct from the previous napkin
  let pIdx = Math.floor(rnd() * NAPKIN_PALETTES.length);
  if (pIdx === lastPaletteIdx) pIdx = (pIdx + 1 + Math.floor(rnd() * (NAPKIN_PALETTES.length - 1))) % NAPKIN_PALETTES.length;
  lastPaletteIdx = pIdx;
  const pal = NAPKIN_PALETTES[pIdx];

  let eIdx = Math.floor(rnd() * EMBOSS_STYLES.length);
  if (eIdx === lastEmbossIdx) eIdx = (eIdx + 1 + Math.floor(rnd() * (EMBOSS_STYLES.length - 1))) % EMBOSS_STYLES.length;
  lastEmbossIdx = eIdx;

  // Subtle per-sheet warm tone drift so no two sheets share the exact same color
  const lumDrift = (rnd() - 0.5) * 7;
  const warmDrift = (rnd() - 0.5) * 4;
  const r = clampByte(pal.r + lumDrift + warmDrift);
  const g = clampByte(pal.g + lumDrift);
  const b = clampByte(pal.b + lumDrift - warmDrift);

  // Subtle corner/margin coffee-cup ghost ring on ~35% of napkins
  const hasCupRing = rnd() < 0.35;
  const ringCorner = Math.floor(rnd() * 4);
  const ringX = (ringCorner % 2 === 0) ? (0.06 + rnd() * 0.14) : (0.80 + rnd() * 0.14);
  const ringY = (ringCorner < 2) ? (0.08 + rnd() * 0.16) : (0.76 + rnd() * 0.16);

  // 1-2 whisper-faint diagonal handling / corner creases
  const diagCount = 1 + (rnd() < 0.55 ? 1 : 0);
  const diagCreases = [];
  for (let i = 0; i < diagCount; i++) {
    const corner = Math.floor(rnd() * 4);
    diagCreases.push({
      corner,
      span: 0.16 + rnd() * 0.22,
      skew: (rnd() - 0.5) * 0.12,
      alpha: 0.022 + rnd() * 0.026,
      flip: rnd() > 0.5 ? 1 : -1
    });
  }

  return {
    id: napkinSeq,
    seed,
    paletteName: pal.name,
    baseHex: rgbToHex(r, g, b),
    embossStyle: EMBOSS_STYLES[eIdx],
    embossStep: eIdx === 3 ? 6 : (rnd() < 0.5 ? 8 : 10),
    embossAlpha: 0.72 + rnd() * 0.52,
    borderStyle: BORDER_STYLES[Math.floor(rnd() * BORDER_STYLES.length)],
    borderInset: 15 + Math.floor(rnd() * 13),
    fiberMul: pal.fiberMul * (0.85 + rnd() * 0.35),
    fleckMul: pal.fleckMul * (0.8 + rnd() * 0.45),
    tileOffX: Math.floor(rnd() * 320),
    tileOffY: Math.floor(rnd() * 320),
    // Organic quarter-fold offsets, slight angles & fold polarity (valley vs ridge)
    foldVPos: 0.465 + rnd() * 0.07,
    foldVAngle: (rnd() - 0.5) * 0.024,
    foldVWidth: 26 + rnd() * 18,
    foldVStrength: 0.032 + rnd() * 0.028,
    foldVFlip: rnd() > 0.5,
    foldHPos: 0.465 + rnd() * 0.07,
    foldHAngle: (rnd() - 0.5) * 0.022,
    foldHWidth: 24 + rnd() * 16,
    foldHStrength: 0.028 + rnd() * 0.026,
    foldHFlip: rnd() > 0.5,
    // Subtle off-center ambient light & vignette warmth
    lightX: 0.42 + rnd() * 0.16,
    lightY: 0.40 + rnd() * 0.18,
    vigAlpha: 0.075 + rnd() * 0.045,
    diagCreases,
    cupRing: hasCupRing ? {
      nx: ringX, ny: ringY,
      radius: 40 + rnd() * 26,
      alpha: 0.022 + rnd() * 0.022,
      rot: rnd() * Math.PI * 2
    } : null
  };
}

function nextNapkin() {
  napkinSpec = createNapkinSpec();
  napkinBgCache = null;
  const wrapEl = document.getElementById('wrap');
  if (wrapEl) wrapEl.style.background = napkinSpec.baseHex;
  return napkinSpec;
}

function createNapkinPattern(ctx, spec = null) {
  const sp = spec || napkinSpec || nextNapkin();
  const S = 320;
  const tile = document.createElement('canvas');
  tile.width = S; tile.height = S;
  const tctx = tile.getContext('2d');

  tctx.fillStyle = sp.baseHex;
  tctx.fillRect(0, 0, S, S);

  // 1. Varied embossed napkin surface pattern
  const ea = sp.embossAlpha;
  if (sp.embossStyle === 'dimple') {
    const step = sp.embossStep;
    for (let y = 0; y < S; y += step) {
      const rowShift = ((y / step) % 2) * (step / 2);
      for (let x = 0; x < S; x += step) {
        const px = (x + rowShift) % S;
        tctx.fillStyle = `rgba(112, 86, 56, ${(0.042 * ea).toFixed(4)})`;
        tctx.fillRect(px, y, 2, 2);
        tctx.fillStyle = `rgba(255, 250, 240, ${(0.062 * ea).toFixed(4)})`;
        tctx.fillRect(px + 1, y + 1, 2, 2);
      }
    }
  } else if (sp.embossStyle === 'linen') {
    const step = 6;
    tctx.lineWidth = 0.8;
    for (let i = 0; i < S; i += step) {
      tctx.strokeStyle = `rgba(110, 84, 54, ${(0.028 * ea).toFixed(4)})`;
      tctx.beginPath(); tctx.moveTo(0, i); tctx.lineTo(S, i); tctx.stroke();
      tctx.beginPath(); tctx.moveTo(i, 0); tctx.lineTo(i, S); tctx.stroke();
      tctx.strokeStyle = `rgba(255, 251, 242, ${(0.040 * ea).toFixed(4)})`;
      tctx.beginPath(); tctx.moveTo(0, i + 1); tctx.lineTo(S, i + 1); tctx.stroke();
    }
  } else if (sp.embossStyle === 'diamond') {
    const step = 16;
    tctx.lineWidth = 0.75;
    for (let k = -S; k <= S * 2; k += step) {
      tctx.strokeStyle = `rgba(112, 86, 56, ${(0.030 * ea).toFixed(4)})`;
      tctx.beginPath(); tctx.moveTo(k, 0); tctx.lineTo(k + S, S); tctx.stroke();
      tctx.beginPath(); tctx.moveTo(k + S, 0); tctx.lineTo(k, S); tctx.stroke();
      tctx.strokeStyle = `rgba(255, 250, 240, ${(0.042 * ea).toFixed(4)})`;
      tctx.beginPath(); tctx.moveTo(k + 1, 0); tctx.lineTo(k + S + 1, S); tctx.stroke();
    }
  } else {
    // 'pinpoint': fine dense embossed stipple
    const step = 6;
    for (let y = 0; y < S; y += step) {
      for (let x = 0; x < S; x += step) {
        tctx.fillStyle = `rgba(108, 82, 52, ${(0.038 * ea).toFixed(4)})`;
        tctx.fillRect(x, y, 1.3, 1.3);
        tctx.fillStyle = `rgba(255, 251, 244, ${(0.055 * ea).toFixed(4)})`;
        tctx.fillRect(x + 1, y + 1, 1.3, 1.3);
      }
    }
  }

  const rnd = makeRng(sp.seed ^ 0x9e3779b9);

  // Helper to wrap marks across tile boundaries seamlessly (no grid seams!)
  const drawWrapped = (x, y, margin, fn) => {
    const oxs = [0]; if (x < margin) oxs.push(S); if (x > S - margin) oxs.push(-S);
    const oys = [0]; if (y < margin) oys.push(S); if (y > S - margin) oys.push(-S);
    for (const ox of oxs) for (const oy of oys) fn(x + ox, y + oy);
  };

  // 2. Soft seamless pulp clouds
  for (let i = 0; i < 150; i++) {
    const x = rnd() * S, y = rnd() * S, r = 7 + rnd() * 22;
    const fill = rnd() > 0.5 ? 'rgba(130, 102, 68, 0.015)' : 'rgba(255, 248, 236, 0.022)';
    tctx.fillStyle = fill;
    drawWrapped(x, y, r + 1, (px, py) => {
      tctx.beginPath(); tctx.arc(px, py, r, 0, Math.PI * 2); tctx.fill();
    });
  }

  // 3. Random organic paper fibers
  const fiberCount = Math.round(480 * sp.fiberMul);
  tctx.lineWidth = 0.7;
  for (let i = 0; i < fiberCount; i++) {
    const x = rnd() * S, y = rnd() * S;
    const len = 2 + rnd() * 8, ang = rnd() * Math.PI * 2;
    const dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
    tctx.strokeStyle = rnd() > 0.38 ? 'rgba(118, 90, 58, 0.072)' : 'rgba(255, 252, 244, 0.088)';
    drawWrapped(x, y, len + 1, (px, py) => {
      tctx.beginPath(); tctx.moveTo(px, py); tctx.lineTo(px + dx, py + dy); tctx.stroke();
    });
  }

  // 4. Recycled kraft speckles
  const fleckCount = Math.round(280 * sp.fleckMul);
  for (let i = 0; i < fleckCount; i++) {
    const sz = 0.9 + rnd() * 0.7;
    tctx.fillStyle = rnd() > 0.28 ? 'rgba(102, 74, 44, 0.082)' : 'rgba(72, 52, 32, 0.105)';
    tctx.fillRect(rnd() * S, rnd() * S, sz, sz);
  }

  return ctx.createPattern(tile, 'repeat');
}

function drawCreaseBand(ctx, x1, y1, x2, y2, halfW, strength, flip) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const mx = (x1 + x2) * 0.5, my = (y1 + y2) * 0.5;
  const g = ctx.createLinearGradient(mx - nx * halfW, my - ny * halfW, mx + nx * halfW, my + ny * halfW);
  const dark = `rgba(88, 65, 38, ${strength.toFixed(4)})`;
  const light = `rgba(255, 250, 240, ${(strength * 1.18).toFixed(4)})`;
  g.addColorStop(0, 'rgba(88, 65, 38, 0)');
  g.addColorStop(0.45, flip ? light : dark);
  g.addColorStop(0.54, flip ? dark : light);
  g.addColorStop(1, 'rgba(88, 65, 38, 0)');

  ctx.save();
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x1 - nx * halfW, y1 - ny * halfW);
  ctx.lineTo(x2 - nx * halfW, y2 - ny * halfW);
  ctx.lineTo(x2 + nx * halfW, y2 + ny * halfW);
  ctx.lineTo(x1 + nx * halfW, y1 + ny * halfW);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function buildNapkinSheetCanvas(sp, w, h, dpr) {
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(w * dpr));
  off.height = Math.max(1, Math.round(h * dpr));
  const ctx = off.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 1. Seamless fiber/emboss tile shifted to a unique phase offset per napkin
  const pat = createNapkinPattern(ctx, sp);
  ctx.save();
  ctx.translate(-sp.tileOffX, -sp.tileOffY);
  ctx.fillStyle = pat;
  ctx.fillRect(sp.tileOffX, sp.tileOffY, w, h);
  ctx.restore();

  const rnd = makeRng(sp.seed ^ 0x517cc1b7);

  // 2. Non-repeating full-sheet organic tonal clouds (subtle uneven paper density)
  const cloudCount = 5 + Math.floor(rnd() * 4);
  for (let i = 0; i < cloudCount; i++) {
    const cx = rnd() * w, cy = rnd() * h;
    const rad = Math.min(w, h) * (0.18 + rnd() * 0.28);
    const warm = rnd() > 0.45;
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    gr.addColorStop(0, warm ? 'rgba(128, 96, 58, 0.036)' : 'rgba(255, 250, 240, 0.048)');
    gr.addColorStop(1, 'rgba(128, 96, 58, 0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, w, h);
  }

  // 3. Unique non-repeating kraft flecks & long natural fibers scattered across sheet
  const uniqueFlecks = Math.round((45 + rnd() * 40) * sp.fleckMul);
  for (let i = 0; i < uniqueFlecks; i++) {
    const x = rnd() * w, y = rnd() * h;
    if (rnd() < 0.45) {
      // Tiny curved fiber thread
      const len = 4 + rnd() * 11, ang = rnd() * Math.PI * 2;
      ctx.strokeStyle = rnd() > 0.3 ? 'rgba(104, 76, 44, 0.11)' : 'rgba(255, 251, 242, 0.13)';
      ctx.lineWidth = 0.65 + rnd() * 0.45;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(
        x + Math.cos(ang + 0.4) * len * 0.5,
        y + Math.sin(ang + 0.4) * len * 0.5,
        x + Math.cos(ang) * len,
        y + Math.sin(ang) * len
      );
      ctx.stroke();
    } else {
      // Natural tiny recycled wood-pulp fleck
      ctx.fillStyle = `rgba(82, 58, 34, ${(0.09 + rnd() * 0.09).toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(x, y, 0.7 + rnd() * 1.1, 0.5 + rnd() * 0.8, rnd() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 4. Optional embossed café napkin rim border
  if (sp.borderStyle !== 'none' && w > 120 && h > 120) {
    const pad = sp.borderInset;
    const bw = w - pad * 2, bh = h - pad * 2;
    ctx.save();
    if (sp.borderStyle === 'double') {
      const drawRim = (inset, dx, dy, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 1.0;
        ctx.strokeRect(inset + dx, inset + dy, w - inset * 2, h - inset * 2);
      };
      drawRim(pad, 0, 0, 'rgba(102, 76, 46, 0.085)');
      drawRim(pad, 1, 1, 'rgba(255, 250, 240, 0.12)');
      drawRim(pad + 5, 0, 0, 'rgba(102, 76, 46, 0.065)');
      drawRim(pad + 5, 1, 1, 'rgba(255, 250, 240, 0.095)');
    } else if (sp.borderStyle === 'dotted') {
      const step = 9;
      for (let x = pad; x <= w - pad; x += step) {
        for (const y of [pad, h - pad]) {
          ctx.fillStyle = 'rgba(102, 76, 46, 0.11)'; ctx.fillRect(x, y, 2, 2);
          ctx.fillStyle = 'rgba(255, 250, 240, 0.15)'; ctx.fillRect(x + 1, y + 1, 2, 2);
        }
      }
      for (let y = pad + step; y < h - pad; y += step) {
        for (const x of [pad, w - pad]) {
          ctx.fillStyle = 'rgba(102, 76, 46, 0.11)'; ctx.fillRect(x, y, 2, 2);
          ctx.fillStyle = 'rgba(255, 250, 240, 0.15)'; ctx.fillRect(x + 1, y + 1, 2, 2);
        }
      }
    } else if (sp.borderStyle === 'stitch') {
      ctx.setLineDash([4, 5]); ctx.lineWidth = 1.1;
      ctx.strokeStyle = 'rgba(102, 76, 46, 0.095)';
      ctx.strokeRect(pad, pad, bw, bh);
      ctx.strokeStyle = 'rgba(255, 250, 240, 0.13)';
      ctx.strokeRect(pad + 1, pad + 1, bw, bh);
    }
    ctx.restore();
  }

  // 5. Organic quarter-fold creases (slightly off-center & subtly tilted!)
  const vx = w * sp.foldVPos, vTilt = Math.tan(sp.foldVAngle) * h * 0.5;
  drawCreaseBand(ctx, vx - vTilt, -10, vx + vTilt, h + 10, sp.foldVWidth * 0.5, sp.foldVStrength, sp.foldVFlip);

  const hy = h * sp.foldHPos, hTilt = Math.tan(sp.foldHAngle) * w * 0.5;
  drawCreaseBand(ctx, -10, hy - hTilt, w + 10, hy + hTilt, sp.foldHWidth * 0.5, sp.foldHStrength, sp.foldHFlip);

  // 6. Subtle diagonal corner/handling creases
  for (const dc of sp.diagCreases) {
    const s = Math.min(w, h) * dc.span;
    const sk = s * dc.skew;
    let x1, y1, x2, y2;
    if (dc.corner === 0) { x1 = -10; y1 = s + sk; x2 = s - sk; y2 = -10; }
    else if (dc.corner === 1) { x1 = w - s + sk; y1 = -10; x2 = w + 10; y2 = s + sk; }
    else if (dc.corner === 2) { x1 = -10; y1 = h - s - sk; x2 = s + sk; y2 = h + 10; }
    else { x1 = w - s - sk; y1 = h + 10; x2 = w + 10; y2 = h - s + sk; }
    drawCreaseBand(ctx, x1, y1, x2, y2, 11, dc.alpha, dc.flip > 0);
  }

  // 7. Occasional whisper-faint coffee-cup ghost ring near an outer margin/corner
  if (sp.cupRing) {
    const cr = sp.cupRing;
    const rx = cr.nx * w, ry = cr.ny * h, rad = cr.radius;
    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(cr.rot);
    for (let pass = 0; pass < 3; pass++) {
      ctx.beginPath();
      const segs = 48;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const wob = Math.sin(a * 3 + pass) * 1.4 + Math.cos(a * 5 - pass * 1.7) * 0.9;
        const rNow = rad + (pass - 1) * 1.8 + wob;
        const px = Math.cos(a) * rNow, py = Math.sin(a) * rNow * 0.96;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(116, 74, 34, ${(cr.alpha * (pass === 1 ? 1.0 : 0.45)).toFixed(4)})`;
      ctx.lineWidth = pass === 1 ? 2.4 : 4.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 8. Soft off-center ambient paper vignette
  const vig = ctx.createRadialGradient(
    w * sp.lightX, h * sp.lightY, Math.min(w, h) * 0.30,
    w * 0.5, h * 0.5, Math.max(w, h) * 0.80
  );
  vig.addColorStop(0, 'rgba(255, 249, 238, 0.045)');
  vig.addColorStop(1, `rgba(108, 80, 48, ${sp.vigAlpha.toFixed(4)})`);
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);

  return off;
}

function drawNapkinBackground(ctx, w, h) {
  if (!napkinSpec) nextNapkin();
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  if (
    !napkinBgCache ||
    napkinBgCache.id !== napkinSpec.id ||
    napkinBgCache.cw !== cw ||
    napkinBgCache.ch !== ch
  ) {
    napkinBgCache = {
      id: napkinSpec.id, cw, ch,
      canvas: buildNapkinSheetCanvas(napkinSpec, w, h, dpr)
    };
  }
  ctx.drawImage(napkinBgCache.canvas, 0, 0, w, h);
}

// ============================================================================
// 2. OPENSKETCH (dx, dy, pressure) RESIDUAL VAE (<0.2ms / stroke)
// ============================================================================
let VAE = null;

function randn(rng = Math.random) {
  let u = 0, v = 0;
  while (u <= 1e-7) u = rng();
  while (v <= 1e-7) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function silu(x) { return x / (1 + Math.exp(-x)); }
function sigmoid(x) { return 1 / (1 + Math.exp(-Math.max(-20, Math.min(20, x)))); }

function decodeResidual(isCurved, isPres, chordLen, tau = DEFAULTS.tau, rng = Math.random) {
  if (!VAE) {
    return Array.from({ length: 16 }, (_, i) => [0, 0, 0.25 + 0.55 * Math.sin((i / 15) * Math.PI)]);
  }
  const nll = Math.max(-1.5, Math.min(1.5, (Math.log(Math.max(chordLen, 25)) - Math.log(140)) / 1.2));
  let h = [];
  for (let i = 0; i < VAE.latent_dim; i++) h.push(randn(rng) * tau);
  h.push(isCurved, isPres, nll);
  for (let li = 0; li < VAE.layers.length; li++) {
    const { w, b } = VAE.layers[li];
    const out = new Array(b.length);
    for (let i = 0; i < b.length; i++) {
      let sum = b[i];
      const row = w[i];
      for (let j = 0; j < row.length; j++) sum += row[j] * h[j];
      out[i] = li < VAE.layers.length - 1 ? silu(sum) : sum;
    }
    h = out;
  }
  const K = VAE.k, sc = VAE.res_scale, out = [];
  for (let i = 0; i < K; i++) out.push([h[i * 3] * sc, h[i * 3 + 1] * sc, sigmoid(h[i * 3 + 2])]);
  return out;
}

function designerLine(x1, y1, x2, y2, isPres = DEFAULTS.isPres, tau = DEFAULTS.tau, ov = 3, rng = Math.random) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  const sx = x1 - ux * ov * rng(), sy = y1 - uy * ov * rng();
  const ex = x2 + ux * ov * rng(), ey = y2 + uy * ov * rng();
  const res = decodeResidual(0, isPres, len, tau, rng);
  const K = res.length;
  return res.map(([ru, rv, p], i) => {
    const t = i / (K - 1);
    return [sx + (ex - sx) * (t + ru) + nx * rv * len, sy + (ey - sy) * (t + ru) + ny * rv * len, p];
  });
}

function designerBezier(x0, y0, cx, cy, x2, y2, isPres = DEFAULTS.isPres, tau = DEFAULTS.tau, rng = Math.random) {
  const chord = Math.hypot(x2 - x0, y2 - y0) || 1;
  const ux = (x2 - x0) / chord, uy = (y2 - y0) / chord, nx = -uy, ny = ux;
  const res = decodeResidual(1, isPres, chord, tau, rng);
  const K = res.length;
  return res.map(([ru, rv, p], i) => {
    const t = i / (K - 1), mt = 1 - t, env = Math.sin(t * Math.PI);
    const bx = mt * mt * x0 + 2 * mt * t * cx + t * t * x2;
    const by = mt * mt * y0 + 2 * mt * t * cy + t * t * y2;
    return [bx + (ux * ru + nx * rv) * chord * env, by + (uy * ru + ny * rv) * chord * env, p];
  });
}

function chaikin(pts, iters = 1) {
  let cur = pts;
  for (let k = 0; k < iters; k++) {
    if (cur.length < 3) break;
    const next = [cur[0]];
    for (let i = 0; i < cur.length - 1; i++) {
      const a = cur[i], b = cur[i + 1];
      next.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]]);
      next.push([0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]);
    }
    next.push(cur[cur.length - 1]);
    cur = next;
  }
  return cur;
}

// ============================================================================
// 3. PARALLEL WEB WORKER POOL FOR 60 FPS STREAMING WAT SIMD128 CURSIVE
// ============================================================================
const POOL_SIZE = Math.min(3, Math.max(2, navigator.hardwareConcurrency || 2));
const readyWorkers = [];
let workerRR = 0;
let reqCounter = 0;
const activeJobs = new Map();
const preReadyQueue = [];

async function cachedFetchBytes(url) {
  const cacheName = 'napkin-ml-v7-2';
  let cache = null;
  try { if ('caches' in window) cache = await caches.open(cacheName); } catch (_) {}
  if (cache) {
    const hit = await cache.match(url);
    if (hit) return await hit.arrayBuffer();
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
  const buf = await res.arrayBuffer();
  if (cache) {
    try { await cache.put(url, new Response(buf.slice(0), { headers: { 'Content-Type': res.headers.get('Content-Type') || 'application/octet-stream' } })); } catch (_) {}
  }
  return buf;
}

async function cachedFetchJSON(url) {
  const buf = await cachedFetchBytes(url);
  return JSON.parse(new TextDecoder().decode(buf));
}

function spawnOneWorker(wasmModule, binBuf, meta, isPrimary, onPrimaryReady) {
  const w = new Worker('./web/hw_worker_v5.js');
  w.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'ready') {
      readyWorkers.push(w);
      if (isPrimary) {
        while (preReadyQueue.length) preReadyQueue.shift()();
        if (onPrimaryReady) onPrimaryReady();
      }
    } else if (msg.type === 'chunk') {
      onWorkerChunk(msg);
    }
  };
  const copy = binBuf.slice(0);
  w.postMessage({ type: 'init', wasmModule, binBuf: copy, meta }, [copy]);
}

async function initWasmPool() {
  const [meta, wasmBytes, binBuf] = await Promise.all([
    cachedFetchJSON('./exports/handwriting/graves_v5_meta.json'),
    cachedFetchBytes('./exports/handwriting/graves_v5.wasm'),
    cachedFetchBytes('./exports/handwriting/graves_v5.bin')
  ]);
  const wasmModule = await WebAssembly.compile(wasmBytes);
  return new Promise((resolve) => {
    spawnOneWorker(wasmModule, binBuf, meta, true, () => {
      resolve();
      for (let i = 1; i < POOL_SIZE; i++) {
        setTimeout(() => spawnOneWorker(wasmModule, binBuf, meta, false, null), i * 160);
      }
    });
  });
}

function layoutWordsToStrokes(wordBuffers, anchorX, anchorY, targetH, maxW, color, baseW = 1.65, align = 'center', penId = currentPenId) {
  const wordBoxes = [];
  let totalRawW = 0;
  let globalMinY = 1e9, globalMaxY = -1e9;
  const wordGap = 14.0;

  for (const buf of wordBuffers) {
    const segs = [];
    let x = 0, y = 0, cur = [];
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    const n = buf.length / 3;
    for (let i = 0; i < n; i++) {
      const dx = buf[i * 3], dy = buf[i * 3 + 1], eos = buf[i * 3 + 2];
      x += dx; y -= dy;
      cur.push([x, y]);
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (eos > 0.5) {
        if (cur.length >= 2) segs.push(cur);
        else if (cur.length === 1) segs.push([[cur[0][0] - 0.16, cur[0][1] - 0.16], [cur[0][0] + 0.16, cur[0][1] + 0.16]]);
        cur = [];
      }
    }
    if (cur.length >= 2) segs.push(cur);
    else if (cur.length === 1) segs.push([[cur[0][0] - 0.16, cur[0][1] - 0.16], [cur[0][0] + 0.16, cur[0][1] + 0.16]]);
    if (!segs.length) {
      wordBoxes.push({ segs: [], minX: 0, w: 10 });
      totalRawW += 10 + wordGap;
      continue;
    }
    if (minY < globalMinY) globalMinY = minY;
    if (maxY > globalMaxY) globalMaxY = maxY;
    const w = Math.max(4, maxX - minX);
    wordBoxes.push({ segs, minX, w });
    totalRawW += w + wordGap;
  }
  if (globalMinY > globalMaxY) return { strokes: [], bbox: null };
  totalRawW = Math.max(1, totalRawW - wordGap);

  const bh = Math.max(10, globalMaxY - globalMinY);
  let sc = targetH / bh;
  if (maxW && totalRawW * sc > maxW) sc = maxW / totalRawW;
  const cy = (globalMinY + globalMaxY) * 0.5;
  let curX = align === 'left' ? anchorX : (anchorX - (totalRawW * sc) * 0.5);

  const strokes = [];
  let outMinX = 1e9, outMaxX = -1e9, outMinY = 1e9, outMaxY = -1e9;

  for (const wb of wordBoxes) {
    for (const seg of wb.segs) {
      const pts = seg.map(([px, py], idx) => {
        const prev = seg[Math.max(0, idx - 1)];
        const sp = Math.hypot(px - prev[0], py - prev[1]);
        const t = idx / Math.max(1, seg.length - 1);
        // Preserve crisp firm pressure on short strokes (i/j dots, punctuation, quick t/f crossbars)
        const taper = seg.length <= 3 ? 0.88 : Math.min(1, t * 6, (1 - t) * 6);
        const p = Math.max(0.24, Math.min(0.94, (0.88 - sp * 0.045) * (0.45 + 0.55 * taper)));
        const sx = curX + (px - wb.minX) * sc;
        const sy = anchorY + (py - cy) * sc;
        if (sx < outMinX) outMinX = sx; if (sx > outMaxX) outMaxX = sx;
        if (sy < outMinY) outMinY = sy; if (sy > outMaxY) outMaxY = sy;
        return [sx, sy, p];
      });
      strokes.push({ pts, alpha: 0.96, baseW, color, penId });
    }
    curX += (wb.w + wordGap) * sc;
  }
  return {
    strokes,
    bbox: outMinX < outMaxX ? { x: outMinX, y: outMinY, w: Math.max(16, outMaxX - outMinX), h: Math.max(20, outMaxY - outMinY) } : null
  };
}

function applyJobStrokes(job) {
  const { strokes, bbox } = layoutWordsToStrokes(
    job.wordBufs, job.cx, job.cy, job.targetH, job.maxW, job.color, job.baseW, job.align, job.penId
  );
  if (job.targetShape) {
    job.targetShape.textStrokes = strokes;
    job.targetShape.wordCache = job.words.map((w, i) => ({ word: w, buf: job.wordBufs[i], seed: job.wordSeeds[i] }));
    job.targetShape.wordCacheStyle = job.styleKey;
  } else if (job.textItem) {
    job.textItem.strokes = strokes;
    job.textItem.wordCache = job.words.map((w, i) => ({ word: w, buf: job.wordBufs[i], seed: job.wordSeeds[i] }));
    job.textItem.wordCacheStyle = job.styleKey;
    if (bbox) {
      job.textItem.x = bbox.x; job.textItem.y = bbox.y;
      job.textItem.w = bbox.w; job.textItem.h = bbox.h;
    }
  }
  scheduleRender();
}

function onWorkerChunk(msg) {
  const job = activeJobs.get(msg.reqId);
  if (!job) return;
  const owner = job.targetShape || job.textItem;
  if (owner && owner.latestReqId !== job.reqId) {
    activeJobs.delete(msg.reqId);
    return;
  }
  if (!job.wordStarted[msg.wordIdx]) {
    job.wordStarted[msg.wordIdx] = true;
    job.wordBufs[msg.wordIdx] = [];
  }
  const arr = job.wordBufs[msg.wordIdx];
  for (let i = 0; i < msg.chunk.length; i++) arr.push(msg.chunk[i]);
  if (msg.done) job.doneCount++;

  applyJobStrokes(job);

  if (job.doneCount >= job.pendingCount) {
    activeJobs.delete(msg.reqId);
    if (job.resolve) job.resolve();
  }
}

function synthesizeCursiveStreaming(text, cx, cy, targetH, maxW, color, targetShape = null, textItem = null, styleKey = currentStyleKey, align = 'center') {
  const words = text.trim().split(/\s+/).filter(Boolean);
  const owner = targetShape || textItem;
  if (!words.length) {
    if (targetShape) { targetShape.textStrokes = []; targetShape.wordCache = []; }
    else if (textItem) { textItem.strokes = []; textItem.wordCache = []; }
    scheduleRender();
    return Promise.resolve();
  }
  if (!readyWorkers.length) {
    return new Promise((resolve) => {
      preReadyQueue.push(() => {
        const liveText = targetShape ? (targetShape.label || '') : (textItem ? (textItem.text || '') : text);
        synthesizeCursiveStreaming(liveText, cx, cy, targetH, maxW, color, targetShape, textItem, styleKey, align).then(resolve);
      });
    });
  }
  const st = WRITING_STYLES[styleKey] || getStyle();
  const reqId = ++reqCounter;
  if (owner) owner.latestReqId = reqId;

  const prevCache = (owner && owner.wordCacheStyle === styleKey && Array.isArray(owner.wordCache)) ? owner.wordCache : [];
  const wordBufs = [], wordSeeds = [], wordStarted = [], toSynth = [];

  for (let i = 0; i < words.length; i++) {
    const prev = prevCache[i];
    if (prev && prev.word === words[i] && prev.buf && prev.buf.length > 0) {
      wordBufs.push(prev.buf);
      wordSeeds.push(prev.seed);
      wordStarted.push(true);
    } else {
      wordBufs.push(prev && prev.buf ? prev.buf : []);
      const seed = (prev && prev.seed) ? prev.seed : (Math.floor(Math.random() * 1e9) + 1);
      wordSeeds.push(seed);
      wordStarted.push(false);
      toSynth.push({ wordIdx: i, word: words[i], seed });
    }
  }

  const job = {
    reqId, text, words, cx, cy, targetH, maxW, color, align, styleKey,
    penId: (owner && owner.penId) || currentPenId,
    baseW: targetShape ? 1.55 : 1.72,
    targetShape, textItem,
    wordBufs, wordSeeds, wordStarted,
    pendingCount: toSynth.length,
    doneCount: 0,
    resolve: null
  };

  if (toSynth.length === 0) {
    applyJobStrokes(job);
    return Promise.resolve();
  }
  applyJobStrokes(job);

  return new Promise((resolve) => {
    job.resolve = resolve;
    activeJobs.set(reqId, job);
    toSynth.forEach(({ wordIdx, word, seed }) => {
      const w = readyWorkers[(workerRR++) % readyWorkers.length];
      w.postMessage({
        type: 'synth_word', reqId, wordIdx, word,
        styleId: st.wasmStyleId, dkMult: st.dkMult, bias: st.bias, seed,
        chunkSteps: DEFAULTS.streamChunkSteps
      });
    });
  });
}

// ============================================================================
// 4. OBJECT BUILDERS + FIXED CIRCLE/BOX/DIAMOND CLASSIFIER (97% OVAL ACC!)
// ============================================================================
function buildShapeStrokes(shapeType, x, y, w, h, col, penId = currentPenId, seed = null) {
  const strokes = [];
  const rng = seed != null ? makeRng(seed) : Math.random;
  const ovScale = Math.min(1, Math.min(w, h) / 28);
  const addPass = (isP, tau, ov, alpha, baseW) => {
    const scaledOv = ov * ovScale;
    if (shapeType === 'box') {
      strokes.push({ pts: designerLine(x, y, x + w, y, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerLine(x + w, y, x + w, y + h, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerLine(x + w, y + h, x, y + h, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerLine(x, y + h, x, y, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
    } else if (shapeType === 'diamond') {
      const cx = x + w / 2, cy = y + h / 2;
      strokes.push({ pts: designerLine(cx, y, x + w, cy, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerLine(x + w, cy, cx, y + h, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerLine(cx, y + h, x, cy, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerLine(x, cy, cx, y, isP, tau, scaledOv, rng), alpha, baseW, color: col, penId });
    } else {
      const cx = x + w / 2, cy = y + h / 2, rx = w / 2, ry = h / 2;
      strokes.push({ pts: designerBezier(cx - rx, cy, cx - rx, cy - ry, cx, cy - ry, isP, tau, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerBezier(cx, cy - ry, cx + rx, cy - ry, cx + rx, cy, isP, tau, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerBezier(cx + rx, cy, cx + rx, cy + ry, cx, cy + ry, isP, tau, rng), alpha, baseW, color: col, penId });
      strokes.push({ pts: designerBezier(cx, cy + ry, cx - rx, cy + ry, cx - rx, cy, isP, tau, rng), alpha, baseW, color: col, penId });
    }
  };
  if (DEFAULTS.underSketch) addPass(0.0, DEFAULTS.tau * 1.15, 6.0, 0.20, 1.25);
  addPass(DEFAULTS.isPres, DEFAULTS.tau, 2.5, 0.98, 2.1);
  return strokes;
}

function buildShapeItem(shapeType, x, y, w, h, label = '', color = null, penId = currentPenId, seed = null) {
  const col = color || currentColor;
  return {
    kind: 'shape', shapeType, x, y, w, h, label, styleKey: currentStyleKey, penId,
    color: col, strokes: buildShapeStrokes(shapeType, x, y, w, h, col, penId, seed), textStrokes: []
  };
}

function buildArrowItem(x1, y1, x2, y2, color = null, penId = currentPenId, seed = null) {
  const col = color || currentColor;
  const rng = seed != null ? makeRng(seed) : Math.random;
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const hl = Math.min(12, Math.max(4, dist * 0.38));
  const ovScale = Math.min(1, dist / 36);
  const strokes = [
    { pts: designerLine(x1, y1, x2, y2, DEFAULTS.isPres, DEFAULTS.tau, 1.5 * ovScale, rng), alpha: 0.96, baseW: 1.95, color: col, penId },
    { pts: designerLine(x2 - hl * Math.cos(ang - 0.45), y2 - hl * Math.sin(ang - 0.45), x2, y2, DEFAULTS.isPres, DEFAULTS.tau, 1.0 * ovScale, rng), alpha: 0.96, baseW: 1.8, color: col, penId },
    { pts: designerLine(x2 - hl * Math.cos(ang + 0.45), y2 - hl * Math.sin(ang + 0.45), x2, y2, DEFAULTS.isPres, DEFAULTS.tau, 1.0 * ovScale, rng), alpha: 0.96, baseW: 1.8, color: col, penId }
  ];
  return {
    kind: 'arrow', x1, y1, x2, y2, penId,
    x: Math.min(x1, x2) - 6, y: Math.min(y1, y2) - 6,
    w: Math.max(18, Math.abs(x2 - x1) + 12), h: Math.max(18, Math.abs(y2 - y1) + 12),
    color: col, strokes
  };
}

function styleHandwritingStrokes(rawList, styleKey, color) {
  const st = WRITING_STYLES[styleKey] || getStyle();
  let sumY = 0, cnt = 0, minX = 1e9, maxX = -1e9;
  for (const raw of rawList) {
    for (const p of raw) {
      sumY += p.y; cnt++;
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    }
  }
  const midY = cnt ? sumY / cnt : 0;
  let slope = 0;
  if (st.hwBaselinePull > 0 && maxX - minX > 30 && cnt > 8) {
    let sxx = 0, sxy = 0;
    const cx = (minX + maxX) * 0.5;
    for (const raw of rawList) {
      for (const p of raw) {
        const dx = p.x - cx, dy = p.y - midY;
        sxx += dx * dx; sxy += dx * dy;
      }
    }
    if (sxx > 1) slope = Math.max(-0.22, Math.min(0.22, sxy / sxx)) * st.hwBaselinePull;
  }
  const midX = (minX + maxX) * 0.5;

  const strokes = rawList.map(raw => {
    const simp = [raw[0]];
    for (let i = 1; i < raw.length; i++) {
      const prev = simp[simp.length - 1];
      if (Math.hypot(raw[i].x - prev.x, raw[i].y - prev.y) >= st.hwMinDist) simp.push(raw[i]);
    }
    if (simp.length < 2) simp.push({ x: raw[0].x + 1.0, y: raw[0].y + 0.8 });
    const basePts = simp.map(p => {
      const yCorr = p.y - (p.x - midX) * slope;
      return [p.x + (midY - yCorr) * st.hwSlant, yCorr];
    });
    const smoothed = st.hwChaikin > 0 ? chaikin(basePts, st.hwChaikin) : basePts;
    const pts = smoothed.map(([x, y], i) => {
      const prev = smoothed[Math.max(0, i - 1)];
      const sp = Math.hypot(x - prev[0], y - prev[1]);
      const t = i / Math.max(1, smoothed.length - 1);
      const endTaper = Math.min(1, t * 7, (1 - t) * 7);
      const p = Math.max(st.hwMinP, Math.min(0.95, (0.90 - sp * st.hwVelDrop) * (0.42 + 0.58 * endTaper)));
      return [x, y, p];
    });
    return { pts, alpha: 0.96, baseW: st.hwBaseW, color, penId: currentPenId };
  });

  let bMinX = 1e9, bMaxX = -1e9, bMinY = 1e9, bMaxY = -1e9;
  for (const s of strokes) for (const [x, y] of s.pts) {
    if (x < bMinX) bMinX = x; if (x > bMaxX) bMaxX = x;
    if (y < bMinY) bMinY = y; if (y > bMaxY) bMaxY = y;
  }
  return { strokes, bbox: { x: bMinX, y: bMinY, w: Math.max(16, bMaxX - bMinX), h: Math.max(16, bMaxY - bMinY) } };
}

function buildHandwriteObject(rawList, color = null, styleKey = currentStyleKey) {
  const col = color || currentColor;
  const rawCopy = rawList.map(r => r.map(p => ({ x: p.x, y: p.y })));
  const { strokes, bbox } = styleHandwritingStrokes(rawCopy, styleKey, col);
  return { kind: 'handwrite', styleKey, penId: currentPenId, color: col, rawList: rawCopy, strokes, x: bbox.x, y: bbox.y, w: bbox.w, h: bbox.h };
}

function buildFreehandObject(rawList, color = null) {
  const col = color || currentColor;
  const penId = currentPenId;
  const strokes = rawList.map(raw => {
    const simp = [raw[0]];
    for (let i = 1; i < raw.length; i++) {
      const prev = simp[simp.length - 1];
      if (Math.hypot(raw[i].x - prev.x, raw[i].y - prev.y) >= 3.5) simp.push(raw[i]);
    }
    if (simp.length < 2) simp.push({ x: raw[0].x + 1, y: raw[0].y + 1 });
    const smoothed = chaikin(simp.map(p => [p.x, p.y]), 1);
    const pts = smoothed.map(([x, y], i) => {
      const prev = smoothed[Math.max(0, i - 1)];
      const sp = Math.hypot(x - prev[0], y - prev[1]);
      const t = i / Math.max(1, smoothed.length - 1);
      const endTaper = Math.min(1, t * 7, (1 - t) * 7);
      const p = Math.max(0.20, Math.min(0.94, (0.86 - sp * 0.03) * (0.40 + 0.60 * endTaper)));
      return [x, y, p];
    });
    return { pts, alpha: 0.96, baseW: 2.05, color: col, penId };
  });
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const s of strokes) for (const [x, y] of s.pts) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return { kind: 'free', penId, color: col, strokes, x: minX, y: minY, w: Math.max(16, maxX - minX), h: Math.max(16, maxY - minY) };
}

// Uniform arc-length resampling across 1..N strokes so slow pointer corners don't bias classification
function resampleStrokesUniform(rawList, totalK = 64) {
  const lengths = rawList.map(raw => {
    let L = 0;
    for (let i = 1; i < raw.length; i++) L += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
    return Math.max(L, 1e-3);
  });
  const sumL = lengths.reduce((a, b) => a + b, 0);
  const out = [];
  rawList.forEach((raw, idx) => {
    const k = Math.max(3, Math.round(totalK * lengths[idx] / sumL));
    const cum = [0];
    for (let i = 1; i < raw.length; i++) cum.push(cum[i - 1] + Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y));
    const L = cum[cum.length - 1] || 1;
    let j = 0;
    for (let m = 0; m < k; m++) {
      const target = (m / Math.max(1, k - 1)) * L;
      while (j < cum.length - 2 && cum[j + 1] < target) j++;
      const span = Math.max(1e-6, cum[j + 1] - cum[j]);
      const t = Math.max(0, Math.min(1, (target - cum[j]) / span));
      out.push({ x: raw[j].x + (raw[j + 1].x - raw[j].x) * t, y: raw[j].y + (raw[j + 1].y - raw[j].y) * t });
    }
  });
  return out;
}

function recognizeMultiStroke(rawList) {
  const stats = rawList.map(raw => {
    let arc = 0;
    for (let i = 1; i < raw.length; i++) arc += Math.hypot(raw[i].x - raw[i - 1].x, raw[i].y - raw[i - 1].y);
    const s = raw[0], e = raw[raw.length - 1];
    const chord = Math.hypot(e.x - s.x, e.y - s.y);
    return { raw, s, e, arc, chord, straightness: chord / Math.max(arc, 1) };
  });

  const uniPts = resampleStrokesUniform(rawList, 64);
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of uniPts) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const w = maxX - minX, h = maxY - minY, diag = Math.hypot(w, h);
  if (diag < 26) return buildFreehandObject(rawList);

  // 1. Single or multi-stroke Arrow
  if (rawList.length <= 3) {
    let mainIdx = 0;
    for (let i = 1; i < stats.length; i++) if (stats[i].arc > stats[mainIdx].arc) mainIdx = i;
    const main = stats[mainIdx];
    if (rawList.length === 1 && main.straightness > 0.72 && main.chord > 34) {
      return buildArrowItem(main.s.x, main.s.y, main.e.x, main.e.y);
    }
    if (rawList.length >= 2 && main.straightness > 0.68 && main.chord > 36) {
      const others = stats.filter((_, i) => i !== mainIdx);
      const nearEnd = others.every(o =>
        o.arc < main.arc * 0.65 &&
        Math.min(Math.hypot(o.s.x - main.e.x, o.s.y - main.e.y), Math.hypot(o.e.x - main.e.x, o.e.y - main.e.y)) < Math.max(36, main.chord * 0.4)
      );
      const nearStart = others.every(o =>
        o.arc < main.arc * 0.65 &&
        Math.min(Math.hypot(o.s.x - main.s.x, o.s.y - main.s.y), Math.hypot(o.e.x - main.s.x, o.e.y - main.s.y)) < Math.max(36, main.chord * 0.4)
      );
      if (nearEnd) return buildArrowItem(main.s.x, main.s.y, main.e.x, main.e.y);
      if (nearStart) return buildArrowItem(main.e.x, main.e.y, main.s.x, main.s.y);
    }
  }

  // 2. Closed 1-stroke or Multi-Stroke Shape (True Euclidean Radial Metric + Cornerness!)
  const isSingleClosed = rawList.length === 1 && stats[0].chord < diag * 0.45;
  const totalArc = stats.reduce((a, s) => a + s.arc, 0);
  const isMultiClosed = rawList.length >= 2 && rawList.length <= 6 && totalArc > 2 * (w + h) * 0.60;

  if ((isSingleClosed || isMultiClosed) && w > 28 && h > 22) {
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, rx = w / 2, ry = h / 2;
    let eErr = 0, bErr = 0, dErr = 0;
    const radii = [];
    for (const p of uniPts) {
      const nx = Math.abs(p.x - cx) / rx, ny = Math.abs(p.y - cy) / ry;
      const r = Math.hypot(nx, ny);
      radii.push(r);
      const invR = 1 / Math.max(r, 1e-6);
      const ca = nx * invR, sa = ny * invR;
      const rBox = 1 / Math.max(Math.max(ca, sa), 1e-6);
      const rDia = 1 / Math.max(ca + sa, 1e-6);
      eErr += Math.abs(r - 1.0);
      bErr += Math.abs(r - rBox);
      dErr += Math.abs(r - rDia);
    }
    const n = uniPts.length;
    eErr /= n; bErr /= n; dErr /= n;

    radii.sort((a, b) => a - b);
    const p90 = radii[Math.min(n - 1, Math.floor(n * 0.90))];
    const p15 = radii[Math.floor(n * 0.15)];

    // Boxes reach deep into 4 corners (r -> 1.414); ovals hover near r=1.0; diamonds pinch near r=0.707
    const bScore = bErr - (p90 > 1.16 ? 0.040 : -0.025);
    const dScore = dErr - (p15 < 0.77 ? 0.025 : 0.0);
    const eScore = eErr;

    if (Math.min(eErr, bErr, dErr) < 0.28) {
      let shapeType = 'oval';
      if (dScore < eScore && dScore < bScore) shapeType = 'diamond';
      else if (bScore < eScore) shapeType = 'box';
      return buildShapeItem(shapeType, minX, minY, w, h);
    }
  }

  return buildFreehandObject(rawList);
}

// ============================================================================
// 5. WEB AUDIO SFX ENGINE (5 PEN PRESETS + CRUMPLE.MP3 + COMPANION CLIPS)
// ============================================================================
const DRAW_PRESETS = {

    tipType: 'bandpass', tipFMin: 4200, tipFMax: 7700, tipQ: 4.1, tipGain: 0.34,
