    tapFreq: 3150, tapDur: 0.010, tapGain: 0.19, curveBoost: 0.52, velScale: 0.85, squeak: 0
  }
};

const NapkinAudio = (() => {
  const DRAW_VOL = 0.75;
  const SPEED_SENS = 0.75;
  const CRUMPLE_VOL = 0.85;
  let activePresetId = 'ballpoint';
  let muted = false;

  function currentPreset() { return DRAW_PRESETS[activePresetId] || DRAW_PRESETS.ballpoint; }

  let actx = null;
  let masterGain = null;
  let compressor = null;
  let buffers = null;
  let voice = null;

  // ./crumble.mp3 preloading + decoded Web Audio buffer + HTMLAudio fallback
  let crumbleRawBytes = null;
  let crumbleFetchPromise = null;
  let crumbleBuffer = null;
  let crumbleDecodePromise = null;
  let activeCrumpleSource = null;
  let fallbackCrumpleEl = null;

  // Live drawing velocity tracking
  let isDrawing = false;
  let lastX = 0, lastY = 0, lastT = 0, lastAng = null;
  let smoothedSpeed = 0;
  let smoothedCurve = 0;
  let decayRaf = null;

  // Typing cadence tracking
  let lastTypeTime = 0;
  let typingPulseTimer = null;

  function preloadCrumple() {
    if (crumbleFetchPromise) return crumbleFetchPromise;
    try {
      fallbackCrumpleEl = new Audio('./web/crumble.mp3');
      fallbackCrumpleEl.preload = 'auto';
    } catch (_) {}
    crumbleFetchPromise = fetch('./web/crumble.mp3')
      .then(res => res.ok ? res.arrayBuffer() : null)
      .then(buf => {
        crumbleRawBytes = buf;
        if (actx && buf && !crumbleBuffer) decodeCrumple();
        return buf;
      })
      .catch(() => null);
    return crumbleFetchPromise;
  }

  function decodeCrumple() {
    if (crumbleBuffer) return Promise.resolve(crumbleBuffer);
    if (crumbleDecodePromise) return crumbleDecodePromise;
    if (!actx || !crumbleRawBytes) return Promise.resolve(null);
    crumbleDecodePromise = actx.decodeAudioData(crumbleRawBytes.slice(0))
      .then(decoded => { crumbleBuffer = decoded; return decoded; })
      .catch(() => { crumbleDecodePromise = null; return null; });
    return crumbleDecodePromise;
  }

  function buildTextureBuffers(ctx) {
    const sr = ctx.sampleRate;
    const len = Math.floor(sr * 3.0);

    // 1. Pink (1/f) paper-body noise (Voss-McCartney 7-stage)
    const pink = ctx.createBuffer(1, len, sr);
    const pd = pink.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      pd[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }

    // 2. Fibrous embossed napkin grain buffer
    const grain = ctx.createBuffer(1, len, sr);
    const gd = grain.getChannelData(0);
    let env = 0.5, imp = 0;
    for (let i = 0; i < len; i++) {
      const emboss = 0.65 + 0.35 * Math.sin(i * 0.0038 + Math.sin(i * 0.00043) * 2.5);
      env += (Math.random() - 0.5) * 0.03;
      env = Math.max(0.25, Math.min(1.0, env));
      if (Math.random() < 0.018) imp += (Math.random() * 2 - 1) * 1.35;
      imp *= 0.84;
      const micro = (Math.random() * 2 - 1) * 0.35;
      gd[i] = Math.max(-1, Math.min(1, (imp + micro) * env * emboss));
    }

    // 3. Fine crisp tip-scratch noise
    const crisp = ctx.createBuffer(1, len, sr);
    const cd = crisp.getChannelData(0);
    let prev = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      const hp = (w - prev) * 0.52;
      prev = w;
      const sparkle = Math.random() < 0.006 ? (Math.random() * 2 - 1) * 0.9 : 0;
      cd[i] = Math.max(-1, Math.min(1, hp + sparkle));
    }

    const fadeN = Math.floor(sr * 0.01);
    for (const arr of [pd, gd, cd]) {
      for (let i = 0; i < fadeN; i++) {
        const k = i / fadeN;
        arr[len - fadeN + i] = arr[len - fadeN + i] * (1 - k) + arr[i] * k;
      }
    }
    return { pink, grain, crisp };
  }

  function ensureContext() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      compressor = actx.createDynamicsCompressor();
      compressor.threshold.value = -10;
      compressor.knee.value = 18;
      compressor.ratio.value = 4;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.12;

      masterGain = actx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(compressor);
      compressor.connect(actx.destination);

      buffers = buildTextureBuffers(actx);
      if (crumbleRawBytes && !crumbleBuffer) decodeCrumple();
    }
    if (actx.state === 'suspended') {
      actx.resume().catch(() => {});
    }
    return actx;
  }

  function configureVoice() {
    if (!voice || !actx) return;
    const p = currentPreset(), now = actx.currentTime;
    voice.bodyFlt.Q.setTargetAtTime(p.bodyQ, now, 0.02);
    voice.grainFlt.Q.setTargetAtTime(p.grainQ, now, 0.02);
    voice.tipFlt.type = p.tipType || 'bandpass';
    voice.tipFlt.Q.setTargetAtTime(p.tipQ, now, 0.02);
    voice.bodyGain.gain.setTargetAtTime(p.bodyGain, now, 0.02);
    voice.grainGain.gain.setTargetAtTime(p.grainGain, now, 0.02);
    voice.tipGain.gain.setTargetAtTime(p.tipGain, now, 0.02);
  }

  function ensureVoice() {
    const ctx = ensureContext();
    if (!ctx || !buffers) return null;
    if (voice) return voice;

    const p = currentPreset();
    const outGain = ctx.createGain();
    outGain.gain.value = 0;
    outGain.connect(masterGain);

    const makeLoop = (buf) => {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      src.start(0, Math.random() * 2.5);
      return src;
    };

    const bodySrc = makeLoop(buffers.pink);
    const bodyFlt = ctx.createBiquadFilter();
    bodyFlt.type = 'bandpass'; bodyFlt.Q.value = p.bodyQ;
    const bodyGain = ctx.createGain();
    bodyGain.gain.value = p.bodyGain;
    bodySrc.connect(bodyFlt); bodyFlt.connect(bodyGain); bodyGain.connect(outGain);

    const grainSrc = makeLoop(buffers.grain);
    const grainFlt = ctx.createBiquadFilter();
    grainFlt.type = 'bandpass'; grainFlt.Q.value = p.grainQ;
    const grainGain = ctx.createGain();
    grainGain.gain.value = p.grainGain;
    grainSrc.connect(grainFlt); grainFlt.connect(grainGain); grainGain.connect(outGain);

    const tipSrc = makeLoop(buffers.crisp);
    const tipFlt = ctx.createBiquadFilter();
    tipFlt.type = p.tipType; tipFlt.Q.value = p.tipQ;
    const tipGain = ctx.createGain();
    tipGain.gain.value = p.tipGain;
    tipSrc.connect(tipFlt); tipFlt.connect(tipGain); tipGain.connect(outGain);

    const sqOsc = ctx.createOscillator(); sqOsc.type = 'triangle'; sqOsc.frequency.value = 2350;
    const sqFlt = ctx.createBiquadFilter(); sqFlt.type = 'bandpass'; sqFlt.Q.value = 10; sqFlt.frequency.value = 2350;
    const sqGain = ctx.createGain(); sqGain.gain.value = 0;
    sqOsc.connect(sqFlt); sqFlt.connect(sqGain); sqGain.connect(outGain);
    sqOsc.start();

    voice = { outGain, bodySrc, bodyFlt, bodyGain, grainSrc, grainFlt, grainGain, tipSrc, tipFlt, tipGain, sqOsc, sqFlt, sqGain };
    return voice;
  }

  function playPenTap(strength = 1.0) {
    if (muted) return;
    const ctx = ensureContext();
    if (!ctx || !buffers) return;
    const p = currentPreset();
    const now = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = buffers.crisp;
    const flt = ctx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = p.tapFreq * (0.9 + Math.random() * 0.2);
    flt.Q.value = 2.4;
    const g = ctx.createGain();
    const peak = p.tapGain * DRAW_VOL * strength * 0.65;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(peak, now + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, now + p.tapDur);
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start(now, Math.random() * 2.0, p.tapDur + 0.01);
  }

  function applySpeedToVoice(speedPxPerSec, curveAccent = 0) {
    if (muted) {
      if (voice && actx) voice.outGain.gain.setTargetAtTime(0, actx.currentTime, 0.02);
      return;
    }
    const v = ensureVoice();
    if (!v || !actx) return;
    const p = currentPreset();
    const now = actx.currentTime;

    if (speedPxPerSec < 10) {
      v.outGain.gain.setTargetAtTime(0, now, 0.026);
      v.sqGain.gain.setTargetAtTime(0, now, 0.02);
      return;
    }

    const rawU = Math.max(0, Math.min(1, (speedPxPerSec - 10) / 1300));
    const pitchU = Math.pow(rawU, 0.72) * (0.28 + 0.72 * SPEED_SENS);
    const gainU = Math.pow(rawU, 0.45 + 0.48 * SPEED_SENS);
    const logLerp = (a, b, t) => a * Math.pow(b / a, Math.max(0, Math.min(1.15, t)));

    v.bodyFlt.frequency.setTargetAtTime(logLerp(p.bodyFMin, p.bodyFMax, pitchU), now, 0.018);
    v.grainFlt.frequency.setTargetAtTime(logLerp(p.grainFMin, p.grainFMax, pitchU), now, 0.016);
    v.tipFlt.frequency.setTargetAtTime(logLerp(p.tipFMin, p.tipFMax, pitchU), now, 0.016);

    const gRate = p.rateMin + (p.rateMax - p.rateMin) * Math.pow(rawU, 0.78);
    v.grainSrc.playbackRate.setTargetAtTime(Math.max(0.25, Math.min(3.2, gRate)), now, 0.02);
    v.tipSrc.playbackRate.setTargetAtTime(0.75 + rawU * 0.85, now, 0.025);

    v.grainGain.gain.setTargetAtTime(p.grainGain * (1 + curveAccent * p.curveBoost), now, 0.015);
    if (p.squeak > 0 && rawU > 0.35) {
      const sqFreq = 2050 + rawU * 880 + curveAccent * 160;
      v.sqOsc.frequency.setTargetAtTime(sqFreq, now, 0.02);
      v.sqFlt.frequency.setTargetAtTime(sqFreq, now, 0.02);
      v.sqGain.gain.setTargetAtTime(p.squeak * Math.pow((rawU - 0.35) / 0.65, 1.4) * 0.14, now, 0.02);
    } else {
      v.sqGain.gain.setTargetAtTime(0, now, 0.02);
    }

    const targetGain = (0.07 + 0.68 * gainU) * DRAW_VOL * p.velScale;
    v.outGain.gain.setTargetAtTime(Math.min(1.15, targetGain), now, 0.014);
  }

  function tickDecay() {
    if (!isDrawing) { decayRaf = null; return; }
    const idleMs = performance.now() - lastT;
    if (idleMs > 28 && smoothedSpeed > 0) {
      smoothedSpeed *= Math.pow(0.74, Math.min(8, idleMs / 16));
      smoothedCurve *= 0.7;
      if (smoothedSpeed < 8) smoothedSpeed = 0;
      applySpeedToVoice(smoothedSpeed, smoothedCurve);
    }
    decayRaf = requestAnimationFrame(tickDecay);
  }

  function startDraw(x, y) {
    ensureContext();
    isDrawing = true;
    lastX = x; lastY = y; lastT = performance.now(); lastAng = null;
    smoothedSpeed = 0; smoothedCurve = 0;
    playPenTap(1.0);
    if (!decayRaf) decayRaf = requestAnimationFrame(tickDecay);
  }

  function updateDraw(x, y) {
    if (!isDrawing) return;
    const now = performance.now();
    const dt = Math.max(4, now - lastT);
    const dx = x - lastX, dy = y - lastY;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.45) return;

    const instSpeed = Math.min(2600, (dist / dt) * 1000);
    const ang = Math.atan2(dy, dx);
    let curve = 0;
    if (lastAng !== null && dist > 1.5) {
      const dAng = Math.abs(Math.atan2(Math.sin(ang - lastAng), Math.cos(ang - lastAng)));
      curve = Math.min(1, dAng * 1.25);
    }
    const alpha = instSpeed > smoothedSpeed ? 0.46 : 0.28;
    smoothedSpeed = smoothedSpeed * (1 - alpha) + instSpeed * alpha;
    smoothedCurve = smoothedCurve * 0.65 + curve * 0.35;

    lastX = x; lastY = y; lastT = now; lastAng = ang;
    applySpeedToVoice(smoothedSpeed, smoothedCurve);
  }

  function stopDraw() {
    if (!isDrawing) return;
    isDrawing = false;
    smoothedSpeed = 0;
    smoothedCurve = 0;
    if (decayRaf) { cancelAnimationFrame(decayRaf); decayRaf = null; }
    applySpeedToVoice(0, 0);
  }

  function triggerTypingPulse() {
    if (muted || isDrawing) return;
    const now = performance.now();
    const dt = Math.max(45, Math.min(600, now - lastTypeTime));
    lastTypeTime = now;
    const speed = Math.max(240, Math.min(960, 145000 / dt));
    const durMs = Math.max(58, Math.min(115, dt * 0.45));
    ensureVoice();
    playPenTap(0.55);
    applySpeedToVoice(speed, 0.35);
    if (typingPulseTimer) clearTimeout(typingPulseTimer);
    typingPulseTimer = setTimeout(() => {
      typingPulseTimer = null;
      if (!isDrawing) applySpeedToVoice(0, 0);
    }, durMs);
  }

  async function prepareCrumple() {
    if (muted) return;
    ensureContext();
    if (!crumbleRawBytes) await preloadCrumple();
    if (actx && crumbleRawBytes && !crumbleBuffer) await decodeCrumple();
    if (actx && actx.state === 'suspended') {
      try {
        await Promise.race([
          actx.resume(),
          new Promise(r => setTimeout(r, 120))
        ]);
      } catch (_) {}
    }
  }

  function stopCrumple() {
    if (activeCrumpleSource) {
      try { activeCrumpleSource.stop(); } catch (_) {}
      activeCrumpleSource = null;
    }
    if (fallbackCrumpleEl) {
      try { fallbackCrumpleEl.pause(); fallbackCrumpleEl.currentTime = 0; } catch (_) {}
    }
  }

  function playCrumple() {
    stopCrumple();
    if (muted) return;
    const ctx = ensureContext();
    if (ctx && crumbleBuffer) {
      const src = ctx.createBufferSource();
      src.buffer = crumbleBuffer;
      const g = ctx.createGain();
      g.gain.value = CRUMPLE_VOL * 3.4;
      src.connect(g);
      g.connect(masterGain);
      src.onended = () => { if (activeCrumpleSource === src) activeCrumpleSource = null; };
      activeCrumpleSource = src;
      src.start(ctx.currentTime);
      return;
    }
    if (fallbackCrumpleEl) {
      fallbackCrumpleEl.currentTime = 0;
      fallbackCrumpleEl.volume = CRUMPLE_VOL;
      fallbackCrumpleEl.play().catch(() => {});
    }
  }

  // Curated ElevenLabs companion clips (lazy prefetched, calibrated loudness)
  const COMPANION_CLIPS = {
    hmm_pause:      { file: './web/sfx/hmm_pause.mp3',      gain: 0.72, dur: 1.76 },
    mm_ponder:      { file: './web/sfx/mm_ponder.mp3',      gain: 1.40, dur: 2.00 },
    sigh_block:     { file: './web/sfx/sigh_block.mp3',     gain: 0.88, dur: 2.00 },
    ooo_intrigued:  { file: './web/sfx/ooo_intrigued.mp3',  gain: 0.40, dur: 1.48 },
    aha_spark:      { file: './web/sfx/aha_spark.mp3',      gain: 0.54, dur: 1.36 },
    eureka_win:     { file: './web/sfx/eureka_win.mp3',     gain: 0.46, dur: 2.08 },
    sip_coffee:     { file: './web/sfx/sip_coffee.mp3',     gain: 2.35, dur: 2.00 },
    swallow_liquid: { file: './web/sfx/swallow_liquid.mp3', gain: 2.45, dur: 1.76 },
    sip_ahhh:       { file: './web/sfx/sip_ahhh.mp3',       gain: 1.75, dur: 2.48 },
    cup_setdown:    { file: './web/sfx/cup_setdown.mp3',    gain: 0.80, dur: 1.20 },
    refill_pour:    { file: './web/sfx/refill_pour.mp3',    gain: 2.45, dur: 2.40 },
    coffee_drip:    { file: './web/sfx/coffee_drip.mp3',    gain: 3.50, dur: 1.08 },
    oops_drip:      { file: './web/sfx/oops_drip.mp3',      gain: 0.54, dur: 0.88 },
    argh_stain:     { file: './web/sfx/argh_stain.mp3',     gain: 0.48, dur: 1.36 }
  };
  const clipRaw = new Map();
  const clipBuf = new Map();
  let activeVocalSrc = null;
  let activeFoleySrcs = new Set();
  let loadedCompanionCount = 0;

  function prefetchCompanionClips() {
    for (const [id, spec] of Object.entries(COMPANION_CLIPS)) {
      fetch(spec.file)
        .then(res => res.ok ? res.arrayBuffer() : null)
        .then(ab => {
          if (!ab) return;
          clipRaw.set(id, ab);
          loadedCompanionCount++;
        })
        .catch(() => {});
    }
  }

  async function getCompanionBuffer(id) {
    if (clipBuf.has(id)) return clipBuf.get(id);
    const spec = COMPANION_CLIPS[id];
    if (!spec) return null;
    const ctx = ensureContext();
    if (!ctx) return null;
    if (!clipRaw.has(id)) {
      try {
        const res = await fetch(spec.file);
        if (!res.ok) return null;
        clipRaw.set(id, await res.arrayBuffer());
        loadedCompanionCount++;
      } catch (_) { return null; }
    }
    try {
      const dec = await ctx.decodeAudioData(clipRaw.get(id).slice(0));
      clipBuf.set(id, dec);
      return dec;
    } catch (_) { return null; }
  }

  function stopCompanion() {
    if (activeVocalSrc) {
      try { activeVocalSrc.stop(); } catch (_) {}
      activeVocalSrc = null;
    }
    for (const s of activeFoleySrcs) {
      try { s.stop(); } catch (_) {}
    }
    activeFoleySrcs.clear();
  }

  async function playClip(id, opts = {}) {
    const spec = COMPANION_CLIPS[id];
    if (!spec) return { played: false, duration: 1.5 };
    const channel = opts.channel || 'vocal';
    const volMul = opts.volumeMul ?? 1.0;
    if (muted) return { played: false, duration: spec.dur };
    if (channel === 'vocal' && activeVocalSrc && !opts.interrupt) {
      return { played: false, duration: spec.dur };
    }
    const ctx = ensureContext();
    if (!ctx) return { played: false, duration: spec.dur };
    const buf = await getCompanionBuffer(id);
    if (!buf || muted) return { played: false, duration: spec.dur };

    if (channel === 'vocal' && activeVocalSrc) {
      try { activeVocalSrc.stop(); } catch (_) {}
      activeVocalSrc = null;
    }

    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = spec.gain * volMul;
    src.connect(g);
    g.connect(masterGain);

    if (channel === 'vocal') {
      activeVocalSrc = src;
      src.onended = () => { if (activeVocalSrc === src) activeVocalSrc = null; };
    } else {
      activeFoleySrcs.add(src);
      src.onended = () => { activeFoleySrcs.delete(src); };
    }
    src.start(ctx.currentTime);
    return { played: true, duration: buf.duration };
  }

  function syncUI() {
    const tog = document.getElementById('sound-toggle');
    if (!tog) return;
    tog.classList.toggle('muted', muted);
    tog.setAttribute('aria-pressed', muted ? 'false' : 'true');
    tog.title = muted ? 'Sound Off (click to unmute)' : 'Sound On (click to mute)';
    tog.setAttribute('aria-label', muted ? 'Sound Off' : 'Sound On');
  }

  function toggleMute() {
    muted = !muted;
    if (masterGain && actx) {
      masterGain.gain.setTargetAtTime(muted ? 0 : 1, actx.currentTime, 0.015);
    }
    if (muted) { stopCrumple(); stopCompanion(); }
    syncUI();
  }

  function initUI() {
    const unlockOnce = () => {
      ensureContext();
      if (crumbleRawBytes && !crumbleBuffer) decodeCrumple();
    };
    window.addEventListener('pointerdown', unlockOnce, { once: true, passive: true });
    window.addEventListener('keydown', unlockOnce, { once: true, passive: true });

    preloadCrumple();
    setTimeout(prefetchCompanionClips, 250);
    syncUI();
  }

  function setPreset(id) {
    if (!DRAW_PRESETS[id]) return;
    activePresetId = id;
    configureVoice();
  }

  return {
    initUI,
    setPreset,
    startDraw,
    updateDraw,
    stopDraw,
    triggerTypingPulse,
    prepareCrumple,
    playCrumple,
    stopCrumple,
    playClip,
    stopCompanion,
    isVocalBusy: () => !!activeVocalSrc,
    toggleMute,
    getState: () => ({
      muted,
      presetId: activePresetId,
      hasCrumpleBuffer: !!crumbleBuffer,
      companionLoaded: loadedCompanionCount,
      companionTotal: Object.keys(COMPANION_CLIPS).length
    })
  };
})();

// 5B. TOP-DOWN CUP PHYSICS, SMOOTH CAPILLARY STAINS & PROBABILISTIC COMPANION
// ============================================================================
const NapkinCup = (() => {
  const VOLUME_STOPS = [

    coffee_latte: { name: 'Coffee Latte',      sub: 'Silky microfoam',    wash: [158, 114, 68], ring: [112, 72, 36], speck: [96, 60, 28], speckDensity: 0.10 },
    black_coffee: { name: 'Black Coffee',      sub: 'Dark roast & crema', wash: [110, 60, 22],  ring: [62, 30, 10],  speck: [48, 22, 8],  speckDensity: 0.16 },
    matcha_pure:  { name: 'Ceremonial Matcha', sub: 'Whisked Uji froth',  wash: [96, 134, 44],  ring: [54, 92, 24],  speck: [38, 68, 16], speckDensity: 0.68 },
    matcha_latte: { name: 'Matcha Latte',      sub: 'Creamy jade swirl',  wash: [130, 158, 88], ring: [84, 114, 48], speck: [66, 94, 34], speckDensity: 0.38 }
  };
  const DRINK_ORDER = ['coffee_latte', 'black_coffee', 'matcha_pure', 'matcha_latte'];

  let loadedCups = 0;

    isDrinkDone: false,       // True once cup reaches 5% dregs -> Menu becomes prominent!

  function scheduleTimer(fn, ms) {

  function getStageSize() {

  // 3x realistic café mug scale (~450-490px on desktop, naturally overhanging corner margin!)
  function getCupSizePx(w, h) {
    return Math.max(360, Math.min(500, Math.min(w, h) * 0.66));
  }

  function getCupCenter(w, h) {
    const sz = getCupSizePx(w, h);
    // Allow generous natural overhang past napkin borders onto the café table
    const minX = -sz * 0.04, maxX = w + sz * 0.04;

  function getBowlCenter(cx, cy, sz, rotDeg) {
    const rad = (rotDeg * Math.PI) / 180;
    const off = -sz * 0.088;
    return { x: cx + Math.cos(rad) * off, y: cy + Math.sin(rad) * off };

  // Exact geometric bowl + handle hit test so empty corners around the 3x mug never block drawing!
  function hitsCup(px, py) {
    if (!state.hasDrink || state.phase !== 'idle') return false;
    const { w, h } = getStageSize();
    const { x, y, sz } = getCupCenter(w, h);

    const bowlR = sz * 0.335;
    if (Math.hypot(px - bowl.x, py - bowl.y) <= bowlR * 1.03) return true;
    // Transform pointer into cup's rotated local coordinates to check handle ear
    const rad = -(state.rotDeg * Math.PI) / 180;
    const dx = px - x, dy = py - y;
    const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
    const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
    return lx >= sz * 0.20 && lx <= sz * 0.45 && Math.abs(ly) <= sz * 0.09;

  function syncMenuBtn() {

  // ---- Smooth Programmatic Capillary Stains (Zero-Node Continuous Cup Ring) ----
  function buildBlobContour(cx, cy, baseR, seed, irr = 0.28, segs = 34) {
    const rnd = makeRng(seed);
    const p1 = rnd() * 6.28, p2 = rnd() * 6.28, p3 = rnd() * 6.28, p4 = rnd() * 6.28;
    const a1 = (0.4 + rnd() * 0.6) * irr * 0.45, a2 = (0.4 + rnd() * 0.6) * irr * 0.35;
    const a3 = (0.3 + rnd() * 0.7) * irr * 0.22, a4 = (0.3 + rnd() * 0.7) * irr * 0.14;
    const ax = 0.88 + rnd() * 0.26, ay = 0.88 + rnd() * 0.26;
    const rot = rnd() * 6.28, c = Math.cos(rot), s = Math.sin(rot);
    const pts = [];
    for (let i = 0; i < segs; i++) {
      const th = (i / segs) * 6.2831853;
      const w = 1 + a1 * Math.sin(th * 2 + p1) + a2 * Math.cos(th * 3 + p2) + a3 * Math.sin(th * 5 + p3) + a4 * Math.cos(th * 9 + p4);
      const lx = Math.cos(th) * baseR * w * ax, ly = Math.sin(th) * baseR * w * ay;
      pts.push({ x: cx + lx * c - ly * s, y: cy + lx * s + ly * c });
    }
    return pts;
  }

  function traceClosed(ctx, pts) {
    const n = pts.length;
    ctx.beginPath();
    ctx.moveTo((pts[n - 1].x + pts[0].x) * 0.5, (pts[n - 1].y + pts[0].y) * 0.5);
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) * 0.5, (p.y + q.y) * 0.5);
    }
    ctx.closePath();
  }

  function createStain(kind, x, y, drinkId, scale, bowlRadius) {
    const seed = (Math.floor(Math.random() * 0xffffffff) ^ (Date.now() & 0xffffffff)) >>> 0;
    const rnd = makeRng(seed);
    const now = performance.now();
    const st = {
      kind, x, y, drinkId, seed,
      tStart: now,
      dryDur: kind === 'ring' ? 760 : 660,
      blobs: [], satellites: [], ringSpec: null
    };
    if (kind === 'drip') {
      const r = (7 + rnd() * 7) * scale;
      st.blobs.push({ x, y, r, irr: 0.28, seed: seed ^ 0x111 });
      const n = 2 + Math.floor(rnd() * 3);
      for (let i = 0; i < n; i++) {
        const a = rnd() * 6.28, d = r * (1.25 + rnd() * 1.45);
        st.satellites.push({ x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, r: (1.2 + rnd() * 2.2) * scale, seed: seed ^ (i * 919 + 55) });
      }
    } else if (kind === 'ring') {
      st.ringSpec = {
        radius: bowlRadius * 0.88,
        rot: rnd() * 6.28,
        heavyAngle: rnd() * 6.28,
        gapAngle: rnd() * 6.28,
        intensity: (0.48 + rnd() * 0.28) * Math.min(1.2, scale)
      };
      const ha = st.ringSpec.heavyAngle;
      if (rnd() < 0.55) {
        st.satellites.push({
          x: x + Math.cos(ha) * (st.ringSpec.radius + 4),
          y: y + Math.sin(ha) * (st.ringSpec.radius + 4),
          r: (1.8 + rnd() * 2.2) * scale,
          seed: seed ^ 0x9191
        });
      }
    }
    return st;
  }

  function randomNapkinDripPos(w, h) {
    // Pick a natural random position anywhere across the napkin interior
    const padX = Math.max(48, Math.min(96, w * 0.10));
    const padY = Math.max(48, Math.min(84, h * 0.10));
    return {
      x: padX + Math.random() * Math.max(20, w - padX * 2),
      y: padY + Math.random() * Math.max(20, h - padY * 2)
    };
  }

  function addStain(kind, x, y, scale = 1.0) {
    const { w, h } = getStageSize();
    const bowlR = getCupSizePx(w, h) * 0.335;
    if (kind === 'trail') {
      const ang = Math.random() * 6.2831853;
      const count = 3 + (Math.random() < 0.48 ? 1 : 0);
      for (let i = 0; i < count; i++) {
        const d = i * (20 + Math.random() * 14);
        const p = Math.sin(i * 1.15) * 9.0;
        const sx = Math.max(28, Math.min(w - 28, x + Math.cos(ang) * d - Math.sin(ang) * p));
        const sy = Math.max(28, Math.min(h - 28, y + Math.sin(ang) * d + Math.cos(ang) * p));
        const st = createStain('drip', sx, sy, state.drinkId, scale * (0.98 - i * 0.16), bowlR);
        st.tStart = performance.now() + i * 90;
        state.stains.push(st);
      }
    } else {
      state.stains.push(createStain(kind, x, y, state.drinkId, scale, bowlR));
    }
    if (state.stains.length > 28) state.stains = state.stains.slice(-28);
    kickAnim();
  }

  function renderOneStain(ctx, st, now) {
    if (now < st.tStart) return;
    const d = DRINKS[st.drinkId] || DRINKS.coffee_latte;
    const rawT = Math.max(0, Math.min(1, (now - st.tStart) / st.dryDur));
    const spread = 0.42 + 0.58 * (1 - Math.pow(1 - rawT, 3));
    const ringDry = Math.pow(rawT, 0.7);
    const [wr, wg, wb] = d.wash, [rr, rg, rb] = d.ring, [sr, sg, sb] = d.speck;

    ctx.save();
    ctx.globalCompositeOperation = 'multiply';

    if (st.kind === 'ring' && st.ringSpec) {
      const rs = st.ringSpec, rad = rs.radius * (0.97 + 0.03 * spread), segs = 104;
      const rnd = makeRng(st.seed ^ 0x777);
      const outerBleed = [], innerBleed = [], outerBody = [], innerBody = [];
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * 6.2831853;
        const heavy = 0.5 + 0.5 * Math.cos(a - rs.heavyAngle);
        const drySide = Math.max(0, Math.cos(a - rs.gapAngle));
        const dryMask = Math.max(0.04, 1 - Math.pow(drySide, 2.4) * 0.94);
        const wob = Math.sin(a * 3 + rs.rot) * 1.1 + Math.cos(a * 5 - rs.rot * 1.7) * 0.6 + Math.sin(a * 8 + rs.rot * 0.6) * 0.25;
        const rMid = rad + wob;
        const halfW = (1.0 + 3.1 * Math.pow(heavy, 1.5)) * dryMask * (0.65 + 0.35 * spread);
        const bleedW = halfW * 1.9 + 1.3;
        const ca = Math.cos(a), sa = Math.sin(a);
        outerBody.push({ x: st.x + ca * (rMid + halfW), y: st.y + sa * (rMid + halfW) });
        innerBody.push({ x: st.x + ca * Math.max(2, rMid - halfW), y: st.y + sa * Math.max(2, rMid - halfW) });
        outerBleed.push({ x: st.x + ca * (rMid + bleedW), y: st.y + sa * (rMid + bleedW) });
        innerBleed.push({ x: st.x + ca * Math.max(2, rMid - bleedW), y: st.y + sa * Math.max(2, rMid - bleedW) });
      }
      const fillRibbon = (op, ip, fillStyle) => {
        const n = op.length;
        ctx.beginPath();
        ctx.moveTo((op[n - 1].x + op[0].x) * 0.5, (op[n - 1].y + op[0].y) * 0.5);
        for (let i = 0; i < n; i++) {
          const p = op[i], q = op[(i + 1) % n];
          ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) * 0.5, (p.y + q.y) * 0.5);
        }
        ctx.closePath();
        ctx.moveTo((ip[0].x + ip[n - 1].x) * 0.5, (ip[0].y + ip[n - 1].y) * 0.5);
        for (let i = n - 1; i >= 0; i--) {
          const p = ip[i], q = ip[(i - 1 + n) % n];
          ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) * 0.5, (p.y + q.y) * 0.5);
        }
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill('evenodd');
      };
      const hx = st.x + Math.cos(rs.heavyAngle) * rad, hy = st.y + Math.sin(rs.heavyAngle) * rad;
      const ox = st.x - Math.cos(rs.heavyAngle) * rad, oy = st.y - Math.sin(rs.heavyAngle) * rad;

      const bleedGrad = ctx.createLinearGradient(hx, hy, ox, oy);
      bleedGrad.addColorStop(0, `rgba(${wr},${wg},${wb},${(0.14 * rs.intensity).toFixed(3)})`);
      bleedGrad.addColorStop(0.55, `rgba(${wr},${wg},${wb},${(0.07 * rs.intensity).toFixed(3)})`);
      bleedGrad.addColorStop(1, `rgba(${wr},${wg},${wb},${(0.025 * rs.intensity).toFixed(3)})`);
      fillRibbon(outerBleed, innerBleed, bleedGrad);

      const bodyGrad = ctx.createLinearGradient(hx, hy, ox, oy);
      bodyGrad.addColorStop(0, `rgba(${wr},${wg},${wb},${(0.32 * rs.intensity).toFixed(3)})`);
      bodyGrad.addColorStop(0.55, `rgba(${wr},${wg},${wb},${(0.18 * rs.intensity).toFixed(3)})`);
      bodyGrad.addColorStop(1, `rgba(${wr},${wg},${wb},${(0.06 * rs.intensity).toFixed(3)})`);
      fillRibbon(outerBody, innerBody, bodyGrad);

      const rimGrad = ctx.createLinearGradient(hx, hy, ox, oy);
      rimGrad.addColorStop(0, `rgba(${rr},${rg},${rb},${((0.18 + 0.28 * ringDry) * rs.intensity).toFixed(3)})`);
      rimGrad.addColorStop(0.55, `rgba(${rr},${rg},${rb},${((0.09 + 0.14 * ringDry) * rs.intensity).toFixed(3)})`);
      rimGrad.addColorStop(1, `rgba(${rr},${rg},${rb},${((0.03 + 0.04 * ringDry) * rs.intensity).toFixed(3)})`);
      ctx.strokeStyle = rimGrad;
      ctx.lineWidth = 1.1; traceClosed(ctx, outerBody); ctx.stroke();
      ctx.lineWidth = 0.85; traceClosed(ctx, innerBody); ctx.stroke();

      const pool = ctx.createRadialGradient(hx, hy, 1, hx, hy, 12 * spread);
      pool.addColorStop(0, `rgba(${rr},${rg},${rb},${(0.20 * rs.intensity).toFixed(3)})`);
      pool.addColorStop(1, `rgba(${wr},${wg},${wb},0)`);
      ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(hx, hy, 12 * spread, 0, 6.2831853); ctx.fill();

      const speckN = Math.round(36 * d.speckDensity);
      ctx.fillStyle = `rgba(${sr},${sg},${sb},${(0.30 * ringDry).toFixed(3)})`;
      for (let i = 0; i < speckN; i++) {
        const a = rnd() * 6.2831853, rj = rad + (rnd() - 0.5) * 4.5;
        ctx.fillRect(st.x + Math.cos(a) * rj, st.y + Math.sin(a) * rj, 1.1, 1.1);
      }
    }

    for (const b of st.blobs) {
      const curR = Math.max(2, b.r * spread);
      const pts = buildBlobContour(b.x, b.y, curR, b.seed, b.irr, 32);
      traceClosed(ctx, buildBlobContour(b.x, b.y, curR * 1.12, b.seed ^ 0x55, b.irr * 1.1, 32));
      ctx.fillStyle = `rgba(${wr},${wg},${wb},${(0.075 * spread).toFixed(3)})`; ctx.fill();

      traceClosed(ctx, pts);
      const grad = ctx.createRadialGradient(b.x, b.y, curR * 0.12, b.x, b.y, curR * 1.15);
      grad.addColorStop(0, `rgba(${wr},${wg},${wb},${(0.25 - 0.05 * ringDry).toFixed(3)})`);
      grad.addColorStop(0.72, `rgba(${wr},${wg},${wb},${(0.29 + 0.04 * ringDry).toFixed(3)})`);
      grad.addColorStop(1, `rgba(${rr},${rg},${rb},${(0.22 + 0.15 * ringDry).toFixed(3)})`);
      ctx.fillStyle = grad; ctx.fill();

      traceClosed(ctx, pts);
      ctx.strokeStyle = `rgba(${rr},${rg},${rb},${(0.12 + 0.32 * ringDry).toFixed(3)})`;
      ctx.lineWidth = Math.max(1.0, Math.min(2.4, curR * 0.085)); ctx.stroke();

      const speckN = Math.round(b.r * 1.2 * d.speckDensity);
      if (speckN > 0) {
        const sRnd = makeRng(b.seed ^ 0x4242);
        ctx.fillStyle = `rgba(${sr},${sg},${sb},${(0.32 * ringDry).toFixed(3)})`;
        for (let i = 0; i < speckN; i++) {
          const a = sRnd() * 6.2831853, rr2 = curR * (0.55 + Math.pow(sRnd(), 0.45) * 0.43);
          ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * rr2, b.y + Math.sin(a) * rr2, 0.55 + sRnd() * 0.75, 0, 6.2831853); ctx.fill();
        }
      }
    }

    for (const s of st.satellites) {
      const curR = Math.max(1, s.r * spread);
      traceClosed(ctx, buildBlobContour(s.x, s.y, curR, s.seed, 0.22, 16));
      ctx.fillStyle = `rgba(${wr},${wg},${wb},0.34)`; ctx.fill();
      ctx.strokeStyle = `rgba(${rr},${rg},${rb},${(0.18 + 0.24 * ringDry).toFixed(3)})`;
      ctx.lineWidth = 0.8; ctx.stroke();
    }
    ctx.restore();

    if (rawT < 0.6 && st.blobs.length) {
      const b0 = st.blobs[0], curR = b0.r * spread;
      ctx.save();
      ctx.fillStyle = `rgba(255, 252, 244, ${((1 - rawT / 0.6) * 0.26).toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(b0.x - curR * 0.24, b0.y - curR * 0.26, curR * 0.28, curR * 0.14, -0.5, 0, 6.2831853);
      ctx.fill();
      ctx.restore();
    }
  }

  function renderStainsTo(ctx, now = performance.now()) {
    for (const st of state.stains) renderOneStain(ctx, st, now);
  }

  // ---- Top-Down Cup Sprite Renderer ----
  function drawCupSprite(ctx, cx, cy, sz, drinkId, volume, rotDeg, lift, opacity, directRefillT = null) {
    if (opacity <= 0.005) return;
    const rad = (rotDeg * Math.PI) / 180;
    const scale = 1 + lift * 0.16;
    const bowlOffX = -sz * 0.088;
    const bowlR = sz * 0.335;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalCompositeOperation = 'source-over';
    const shFade = Math.max(0, 1 - lift * 0.42);
    ctx.globalAlpha = opacity * shFade;
    const shDist = sz * (0.048 + lift * 0.14);
    const shDx = shDist * 0.9, shDy = shDist * 0.95;
    const bx = Math.cos(rad) * bowlOffX, by = Math.sin(rad) * bowlOffX;

    const penR = bowlR * (1.22 + lift * 0.30);
    const penA0 = Math.max(0.06, 0.28 - lift * 0.08);
    const penA1 = Math.max(0.03, 0.12 - lift * 0.03);
    const pen = ctx.createRadialGradient(bx + shDx, by + shDy, bowlR * 0.55, bx + shDx, by + shDy, penR);
    pen.addColorStop(0, `rgba(52, 36, 20, ${penA0.toFixed(3)})`);
    pen.addColorStop(0.7, `rgba(66, 46, 26, ${penA1.toFixed(3)})`);
    pen.addColorStop(1, 'rgba(66, 46, 26, 0)');
    ctx.fillStyle = pen;
    ctx.beginPath(); ctx.arc(bx + shDx, by + shDy, penR, 0, 6.2831853); ctx.fill();

    if (lift < 0.85) {
      const occA = Math.max(0, (1 - lift) * 0.28);
      const occ = ctx.createRadialGradient(bx + shDx * 0.25, by + shDy * 0.25, bowlR * 0.72, bx + shDx * 0.25, by + shDy * 0.25, bowlR * 1.04);
      occ.addColorStop(0, `rgba(38, 24, 12, ${occA.toFixed(3)})`);
      occ.addColorStop(0.85, `rgba(48, 32, 18, ${(occA * 0.55).toFixed(3)})`);
      occ.addColorStop(1, 'rgba(48, 32, 18, 0)');
      ctx.fillStyle = occ;
      ctx.beginPath(); ctx.arc(bx + shDx * 0.25, by + shDy * 0.25, bowlR * 1.04, 0, 6.2831853); ctx.fill();
    }

    ctx.save();
    ctx.translate(shDx * 0.85, shDy * 0.9);
    ctx.rotate(rad);
    ctx.fillStyle = `rgba(52, 36, 20, ${Math.max(0.04, 0.18 - lift * 0.05).toFixed(3)})`;
    ctx.beginPath();
    ctx.roundRect(sz * 0.21, -sz * 0.055, sz * 0.22, sz * 0.11, sz * 0.045);
    ctx.fill();
    ctx.restore();
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rad);
    ctx.scale(scale, scale);
    const half = sz * 0.5;

    if (directRefillT !== null) {
      // Single direct refill animation: smooth 0% (empty/dregs) -> 100% (fresh full) skipping drank-down 30%/65% stops
      const imgEmpty = cupImages.get(`${drinkId}_05`);
      const imgFull = cupImages.get(`${drinkId}_100`);
      const fillT = Math.max(0, Math.min(1, directRefillT));
      if (imgEmpty && imgEmpty.complete && imgEmpty.naturalWidth) {
        ctx.globalAlpha = opacity;
        ctx.drawImage(imgEmpty, -half, -half, sz, sz);
      }
      if (fillT > 0.004 && imgFull && imgFull.complete && imgFull.naturalWidth) {
        ctx.globalAlpha = opacity * fillT;
        ctx.drawImage(imgFull, -half, -half, sz, sz);
      }
    } else {
      const v = Math.max(0.05, Math.min(1.0, volume));
      let hi = VOLUME_STOPS[0], lo = VOLUME_STOPS[VOLUME_STOPS.length - 1];
      for (let i = 0; i < VOLUME_STOPS.length - 1; i++) {
        if (v <= VOLUME_STOPS[i].val && v >= VOLUME_STOPS[i + 1].val) {
          hi = VOLUME_STOPS[i]; lo = VOLUME_STOPS[i + 1]; break;
        }
      }
      const t = Math.max(0, Math.min(1, (hi.val - v) / Math.max(0.001, hi.val - lo.val)));
      const imgHi = cupImages.get(`${drinkId}_${hi.key}`);
      const imgLo = cupImages.get(`${drinkId}_${lo.key}`);
      if (imgHi && imgHi.complete && imgHi.naturalWidth) {
        ctx.globalAlpha = opacity;
        ctx.drawImage(imgHi, -half, -half, sz, sz);
      }
      if (t > 0.005 && imgLo && imgLo.complete && imgLo.naturalWidth) {
        ctx.globalAlpha = opacity * t;
        ctx.drawImage(imgLo, -half, -half, sz, sz);
      }
    }
    ctx.restore();
  }

  function exitOffset(cx, cy, w, h, sz) {
    // Glide cleanly off whichever edge is closest horizontally, angled naturally down-toward-drinker
    const dirX = cx >= w * 0.5 ? 1 : -1;
    const dx = dirX > 0 ? (w - cx + sz * 0.72) : -(cx + sz * 0.72);
    const dy = Math.min(220, (h - cy) * 0.48 + sz * 0.42);
    return { dx, dy };
  }

  function renderCupTo(ctx, w, h, now = performance.now()) {
    if (!state.hasDrink) return;
    const { x, y, sz } = getCupCenter(w, h);
    let drawX = x, drawY = y, drawOpacity = 1, drawLift = state.lift;

    if (state.phase === 'entering') {
      const t = Math.min(1, (now - state.phaseStart) / ENTER_MS);
      const inv = 1 - (1 - Math.pow(1 - t, 3));
      const { dx, dy } = exitOffset(x, y, w, h, sz);
      drawX = x + inv * dx * 0.65;
      drawY = y + inv * dy * 0.55;
      drawLift = inv * 1.65;
      drawOpacity = Math.min(1, Math.pow(t, 0.65));
    } else if (state.phase === 'replacing_out') {
      const t = Math.min(1, (now - state.phaseStart) / REPLACE_OUT_MS);
      const ease = t * t * (3 - 2 * t);
      const { dx, dy } = exitOffset(x, y, w, h, sz);
      drawX = x + ease * dx * 0.65;
      drawY = y + ease * dy * 0.55;
      drawLift = ease * 1.65;
      drawOpacity = Math.max(0, 1 - Math.pow(t, 1.4));
    } else if (state.phase === 'exiting') {
      const t = Math.min(1, (now - state.phaseStart) / EXIT_MS);
      const ease = t * t * (3 - 2 * t);
      const { dx, dy } = exitOffset(x, y, w, h, sz);
      drawX = x + ease * dx * 0.68;
      drawY = y + ease * dy * 0.65;
      // Enlarge noticeably as mug lifts high toward the overhead viewer to drink!
      drawLift = ease * 2.05;
      drawOpacity = Math.max(0, 1 - Math.pow(t, 1.65));
    } else if (state.phase === 'drinking') {
      drawOpacity = 0;
    } else if (state.phase === 'returning') {
      const t = Math.min(1, (now - state.phaseStart) / RETURN_MS);
      const ease = 1 - Math.pow(1 - t, 3);
      const inv = 1 - ease;
      const { dx, dy } = exitOffset(x, y, w, h, sz);
      drawX = x + inv * dx * 0.68;
      drawY = y + inv * dy * 0.65;
      drawLift = inv * 2.05;
      drawOpacity = Math.min(1, Math.pow(t, 0.65));
    } else if (state.phase === 'crumple_lift') {
      const t = Math.min(1, (now - state.phaseStart) / CRUMPLE_LIFT_MS);
      const ease = t * t * (3 - 2 * t);
      const { dx, dy } = exitOffset(x, y, w, h, sz);
      drawX = x + ease * dx * 0.72;
      drawY = y + ease * dy * 0.65;
      drawLift = Math.max(state.lift, ease * 1.95);
      drawOpacity = Math.max(0, 1 - Math.pow(t, 1.35));
    } else if (state.phase === 'crumple_wait') {
      drawOpacity = 0;
    } else if (state.phase === 'crumple_return') {
      const t = Math.min(1, (now - state.phaseStart) / CRUMPLE_RETURN_MS);
      const ease = 1 - Math.pow(1 - t, 3);
      const inv = 1 - ease;
      const { dx, dy } = exitOffset(x, y, w, h, sz);
      drawX = x + inv * dx * 0.72;
      drawY = y + inv * dy * 0.65;
      drawLift = inv * 1.90;
      drawOpacity = Math.min(1, Math.pow(t, 0.65));
    }
    const directRefillT = state.phase === 'refilling' ? state.refillProgress : null;
    drawCupSprite(ctx, drawX, drawY, sz, state.drinkId, state.volume, state.rotDeg, drawLift, drawOpacity, directRefillT);
  }

  // Render cup on the unclipped full-stage overlay canvas so napkin edges NEVER clip the mug!
  function renderCupLayer(now = performance.now()) {
    const cupCanvas = document.getElementById('cup-layer');
    const stageEl = document.getElementById('stage');
    if (!cupCanvas || !stageEl) return;
    const sr = stageEl.getBoundingClientRect();
    const nr = canvas.getBoundingClientRect();
    if (!sr.width || !sr.height) return;
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.round(sr.width * dpr), ch = Math.round(sr.height * dpr);
    if (cupCanvas.width !== cw || cupCanvas.height !== ch) { cupCanvas.width = cw; cupCanvas.height = ch; }
    const cctx = cupCanvas.getContext('2d');
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cctx.clearRect(0, 0, sr.width, sr.height);
    if (!state.hasDrink) return;

    cctx.save();
    cctx.translate(nr.left - sr.left, nr.top - sr.top);
    renderCupTo(cctx, nr.width, nr.height, now);
    cctx.restore();
  }

  // ---- Smooth On-Demand Animation Loop (0 idle CPU when settled) ----
  function needsAnimation(now) {
    if (state.phase !== 'idle' && state.phase !== 'crumple_wait') return true;
    if (state.phase === 'idle') {
      if (Math.abs(state.targetLift - state.lift) > 0.004) return true;
      if (Math.abs(state.targetVolume - state.volume) > 0.002) return true;
      if (Math.abs(state.angVel) > 0.03) return true;
    }
    for (const st of state.stains) {
      if (now < st.tStart + st.dryDur + 40) return true;
    }
    return false;
  }

  function stepAnim(now) {
    animRaf = null;

    if (state.phase === 'idle') {
      state.lift += (state.targetLift - state.lift) * 0.22;
      state.volume += (state.targetVolume - state.volume) * 0.16;
      if (Math.abs(state.targetVolume - state.volume) < 0.001) state.volume = state.targetVolume;
      if (!pointerState?.dragging) {
        state.rotDeg += state.angVel;
        state.angVel *= 0.84;
        if (Math.abs(state.angVel) < 0.025) state.angVel = 0;
      }
    } else if (state.phase === 'entering') {
      const t = Math.min(1, (now - state.phaseStart) / ENTER_MS);
      if (!state.setdownPlayed && t >= 0.84) {
        state.setdownPlayed = true;
        NapkinAudio.playClip('cup_setdown', { channel: 'foley', volumeMul: 0.92 });
      }
      if (t >= 1) {
        state.phase = 'idle';
        state.lift = 0; state.targetLift = 0;
      }
    } else if (state.phase === 'replacing_out') {
      if ((now - state.phaseStart) >= REPLACE_OUT_MS) {
        state.drinkId = state.pendingOrderDrinkId || state.drinkId;
        state.pendingOrderDrinkId = null;
        state.volume = 1.0; state.targetVolume = 1.0;
        state.isDrinkDone = false;
        state.phase = 'entering';
        state.phaseStart = now;
        state.setdownPlayed = false;
        syncMenuBtn();
      }
    } else if (state.phase === 'exiting') {
      if ((now - state.phaseStart) >= EXIT_MS) {
        state.phase = 'drinking';
        state.phaseStart = now;
        state.volume = state.nextVolAfterSip;
        state.targetVolume = state.nextVolAfterSip;
        if (state.targetVolume <= 0.07) {
          state.isDrinkDone = true;
          syncMenuBtn();
        }

        // Pick ONE natural drinking clip probabilistically
        const r = Math.random();
        const sipClip = r < 0.45 ? 'sip_coffee' : (r < 0.75 ? 'sip_ahhh' : 'swallow_liquid');
        const baseDur = sipClip === 'sip_ahhh' ? 2550 : (sipClip === 'sip_coffee' ? 2100 : 1850);
        state.drinkDurMs = baseDur + Math.round(Math.random() * 260);
        NapkinAudio.playClip(sipClip, { channel: 'vocal', interrupt: true });
      }
    } else if (state.phase === 'drinking') {
      const t = Math.min(1, (now - state.phaseStart) / state.drinkDurMs);
      if (state.pendingDrip && !state.dripFired && t >= 0.56) {
        state.dripFired = true;
        const { w, h } = getStageSize();
        const pos = randomNapkinDripPos(w, h);
        addStain(Math.random() < 0.46 ? 'drip' : 'trail', pos.x, pos.y, 1.18);

        // Drip stain always uses the crisp "Oops!" sound
        scheduleTimer(() => {
          NapkinAudio.playClip('oops_drip', { channel: 'vocal', interrupt: true });
          lastVocalAt = performance.now();
        }, 220);
      }
      if (t >= 1) {
        state.phase = 'returning';
        state.phaseStart = now;
        state.setdownPlayed = false;
      }
    } else if (state.phase === 'returning') {
      const t = Math.min(1, (now - state.phaseStart) / RETURN_MS);
      if (!state.setdownPlayed && t >= 0.84) {
        state.setdownPlayed = true;
        NapkinAudio.playClip('cup_setdown', { channel: 'foley', volumeMul: 0.92 });
      }
      if (t >= 1) {
        state.phase = 'idle';
        state.lift = 0; state.targetLift = 0;
      }
    } else if (state.phase === 'refilling') {
      const t = Math.min(1, (now - state.phaseStart) / REFILL_MS);
      // Smooth S-curve 0 -> 100% single pour animation (no intermediate drank-down states)
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      state.refillProgress = ease;
      state.volume = 0.05 + 0.95 * ease;
      if (t >= 1) {
        state.refillProgress = null;
        state.volume = 1.0; state.targetVolume = 1.0;
        state.isDrinkDone = false;
        state.phase = 'idle';
        syncMenuBtn();
      }
    } else if (state.phase === 'crumple_lift') {
      if ((now - state.phaseStart) >= CRUMPLE_LIFT_MS) {
        state.phase = 'crumple_wait';
        const resolvers = crumpleLiftResolvers.splice(0);
        resolvers.forEach(fn => fn());
      }
    } else if (state.phase === 'crumple_return') {
      const t = Math.min(1, (now - state.phaseStart) / CRUMPLE_RETURN_MS);
      if (!state.setdownPlayed && t >= 0.84) {
        state.setdownPlayed = true;
        if (state.hasDrink) NapkinAudio.playClip('cup_setdown', { channel: 'foley', volumeMul: 0.92 });
      }
      if (t >= 1) {
        state.phase = 'idle';
        state.lift = 0; state.targetLift = 0;
      }
    }

    render();
    if (needsAnimation(now)) {
      animRaf = requestAnimationFrame(stepAnim);
    }
  }

  function kickAnim() {
    if (!animRaf) animRaf = requestAnimationFrame(stepAnim);
  }

  // ---- Ordering, Drinking & Refill Actions ----
  function orderDrink(id) {
    if (!DRINKS[id]) return;
    clearPendingTimers();
    if (pointerState) finishPointer(true);
    state.refillProgress = null;
    if (crumpleLiftResolvers.length) {
      crumpleLiftResolvers.splice(0).forEach(fn => fn('cancelled'));
    }

    if (!state.hasDrink) {
      state.drinkId = id;
      state.hasDrink = true;
      state.isDrinkDone = false;
      state.volume = 1.0; state.targetVolume = 1.0;
      state.cupNX = 0.88; state.cupNY = 0.22; state.rotDeg = 22;
      state.phase = 'entering';
      state.phaseStart = performance.now();
      state.setdownPlayed = false;
      mugMoveCount = 0;
      syncMenuBtn();
      kickAnim();
    } else {
      // Smoothly swap existing cup out and bring the newly ordered drink in!
      state.pendingOrderDrinkId = id;
      state.phase = 'replacing_out';
      state.phaseStart = performance.now();
      mugMoveCount = 0;
      syncMenuBtn();
      kickAnim();
    }
    restoreFocus('#drink-menu-btn');
  }

  function triggerRefill() {
    if (!state.hasDrink || state.phase !== 'idle') return false;
    state.phase = 'refilling';
    state.phaseStart = performance.now();
    state.refillFrom = 0.05;
    state.refillProgress = 0;
    state.targetVolume = 1.0;
    state.isDrinkDone = false;
    lastDrinkAt = performance.now();
    recSinceDrink = 0;
    syncMenuBtn();
    NapkinAudio.playClip('refill_pour', { channel: 'foley' });
    kickAnim();
    return true;
  }

  function triggerDrink(opts = {}) {
    if (!state.hasDrink || state.phase !== 'idle') return false;
    if (state.targetVolume <= 0.07) {
      return triggerRefill();
    }
    const idx = VOLUME_STOPS.findIndex(s => s.val <= state.targetVolume + 0.02);
    const nextIdx = idx === -1 ? 1 : Math.min(VOLUME_STOPS.length - 1, idx + 1);
    state.nextVolAfterSip = VOLUME_STOPS[nextIdx].val;

    // Stain rule: accidental drinking drips & trails happen once user has interacted with the drawing!
    const dripProb = !hasInteractedWithDrawing
      ? 0
      : (opts.forceDrip ? 1.0 : (state.targetVolume >= 0.9 ? 0.50 : 0.40));
    state.pendingDrip = Math.random() < dripProb;
    state.dripFired = false;
    state.phase = 'exiting';
    state.phaseStart = performance.now();
    lastDrinkAt = performance.now();
    recSinceDrink = 0;
    kickAnim();
    return true;
  }

  // ---- Pointer Handling (Press-and-Hold to Move + Rotate; Click to Drink) ----
  function onPointerDown(e, p, captureEl = canvas) {
    if (!hitsCup(p.x, p.y)) return false;
    e.preventDefault();
    try { captureEl.setPointerCapture(e.pointerId); } catch (_) {}
    const { w, h } = getStageSize();
    const { x, y, sz } = getCupCenter(w, h);
    const bowl = getBowlCenter(x, y, sz, state.rotDeg);

    pointerState = {
      pointerId: e.pointerId,
      downX: p.x, downY: p.y,
      lastX: p.x, lastY: p.y,
      grabOffX: p.x - x, grabOffY: p.y - y,
      originBowlX: bowl.x, originBowlY: bowl.y,
      dragging: false,
      movedDist: 0,
      holdTimer: setTimeout(() => {
        if (!pointerState || pointerState.dragging) return;
        pointerState.dragging = true;
        state.targetLift = 1;
        setCupCursor('grabbing');
        kickAnim();
      }, HOLD_MS)
    };
    resetIdleTimer();
    return true;
  }

  function setCupCursor(cur) {
    const stageEl = document.getElementById('stage');
    if (stageEl) stageEl.style.cursor = cur || '';
    canvas.style.cursor = cur || (tool === 'move' ? 'default' : (tool === 'text' ? 'text' : 'crosshair'));
  }

  function onPointerMove(e, p) {
    if (pointerState) {
      const dx = p.x - pointerState.lastX;
      const dy = p.y - pointerState.lastY;
      pointerState.lastX = p.x;
      pointerState.lastY = p.y;
      pointerState.movedDist += Math.hypot(dx, dy);

      if (!pointerState.dragging && pointerState.movedDist > DRAG_PX) {
        clearTimeout(pointerState.holdTimer);
        pointerState.dragging = true;
        state.targetLift = 1;
        setCupCursor('grabbing');
      }

      if (pointerState.dragging) {
        const { w, h } = getStageSize();
        const { x, y, sz } = getCupCenter(w, h);
        const newX = p.x - pointerState.grabOffX;
        const newY = p.y - pointerState.grabOffY;
        const minX = -sz * 0.04, maxX = w + sz * 0.04;
        const minY = -sz * 0.04, maxY = h + sz * 0.04;
        state.cupNX = Math.max(minX, Math.min(maxX, newX)) / Math.max(1, w);
        state.cupNY = Math.max(minY, Math.min(maxY, newY)) / Math.max(1, h);

        // Movement-driven natural rotation: rigid-body grab-point torque + gentle travel swivel
        const rx = (p.x - x) / Math.max(1, sz * 0.35);
        const ry = (p.y - y) / Math.max(1, sz * 0.35);
        const torque = (rx * dy - ry * dx) * 0.18;
        const swivel = dx * 0.08 - dy * 0.03;
        const impulse = Math.max(-5.0, Math.min(5.0, torque + swivel));
        state.angVel = state.angVel * 0.72 + impulse * 0.48;
        state.rotDeg += state.angVel;
        kickAnim();
      }
      return true;
    }

    // Hover feedback over the cup (even on parts overhanging the napkin edge!)
    if (!activeRaw && !dragShape && !dragItem && !resizeState) {
      const over = hitsCup(p.x, p.y);
      if (over !== hoveringCup) {
        hoveringCup = over;
        setCupCursor(over ? 'pointer' : '');
      }
      if (over) return true;
    }
    return false;
  }

  function finishPointer(cancelled = false) {
    if (!pointerState) return false;
    const ps = pointerState;
    pointerState = null;
    clearTimeout(ps.holdTimer);

    if (ps.dragging) {
      state.targetLift = 0;
      setCupCursor(hoveringCup ? 'pointer' : '');
      const { w, h } = getStageSize();
      const { x, y, sz } = getCupCenter(w, h);
      const bowl = getBowlCenter(x, y, sz, state.rotDeg);
      const moved = Math.hypot(bowl.x - ps.originBowlX, bowl.y - ps.originBowlY);
      if (!cancelled) {
        // Always play ceramic mug settle sound whenever mug is set back down onto the napkin
        NapkinAudio.playClip('cup_setdown', { channel: 'foley', volumeMul: 0.92 });
        if (moved > 18) {
          mugMoveCount++;
          // Stain rule: if user keeps moving the mug (>= 2 moves), guarantee a damp ring stain!
          // On 1st move, leave a ring stain generously once user has interacted with the drawing.
          const shouldRing = (mugMoveCount >= 2) || (hasInteractedWithDrawing && Math.random() < 0.80);
          if (shouldRing) {
            addStain('ring', ps.originBowlX, ps.originBowlY, 0.98);
            const splashProb = mugMoveCount >= 3 ? 0.64 : (mugMoveCount >= 2 ? 0.46 : (hasInteractedWithDrawing ? 0.22 : 0));
            if (Math.random() < splashProb) {
              const pos = randomNapkinDripPos(w, h);
              const kind = Math.random() < 0.52 ? 'trail' : 'drip';
              addStain(kind, pos.x, pos.y, 1.08);
              scheduleTimer(() => {
                NapkinAudio.playClip('oops_drip', { channel: 'vocal', interrupt: true });
                lastVocalAt = performance.now();
              }, 220);
            }
          }
        }
      }
      kickAnim();
    } else if (!cancelled && ps.movedDist <= DRAG_PX) {
      triggerDrink({ manual: true });
    }
    return true;
  }

  // ---- Probabilistic Companion Sound & Auto-Drink Director ----
  function resetIdleTimer() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    idleFiredThisStretch = false;
    // Schedule a natural pause check (7.5s .. 12.5s after user stops sketching)
    const waitMs = 7500 + Math.random() * 5000;
    idleTimer = setTimeout(onIdleTimeout, waitMs);
  }

  function onIdleTimeout() {
    idleTimer = null;
    if (idleFiredThisStretch || items.length < 1 || typingTarget || activeRaw || dragShape || state.phase !== 'idle') return;
    const now = performance.now();
    if (now - lastVocalAt < MIN_VOCAL_COOLDOWN_MS || NapkinAudio.isVocalBusy()) return;
    idleFiredThisStretch = true;

    const r = Math.random();
    if (r < 0.42) {
      const pick = Math.random();
      const clip = pick < 0.48 ? 'hmm_pause' : (pick < 0.80 ? 'mm_ponder' : 'sigh_block');
      NapkinAudio.playClip(clip, { channel: 'vocal' });
      lastVocalAt = now;
    } else if (r < 0.68 && state.hasDrink && !state.isDrinkDone && (now - lastDrinkAt >= MIN_DRINK_COOLDOWN_MS)) {
      triggerDrink({ manual: false });
    }
  }

  function markDrawingInteraction() {
    hasInteractedWithDrawing = true;
  }

  function onActivity(kind = 'sketch') {
    hasInteractedWithDrawing = true;
    totalActivity++;
    recSinceVocal++;
    recSinceDrink++;
    resetIdleTimer();

    if (totalActivity < 2) return;
    const now = performance.now();

    // 1. Probabilistic auto-drinking (only when user has an active unfinished drink)
    if (
      state.hasDrink && !state.isDrinkDone &&
      state.phase === 'idle' &&
      recSinceDrink >= 3 &&
      (now - lastDrinkAt >= MIN_DRINK_COOLDOWN_MS)
    ) {
      const pDrink = Math.min(0.58, 0.22 + (recSinceDrink - 3) * 0.10);
      if (Math.random() < pDrink) {
        recSinceDrink = 0;
        const delay = 650 + Math.random() * 600;
        scheduleTimer(() => {
          if (!activeRaw && !dragShape && !typingTarget && state.hasDrink && !state.isDrinkDone && state.phase === 'idle') {
            triggerDrink({ manual: false });
          }
        }, delay);
        return;
      }
    }

    // 2. Probabilistic thinking / discovery vocalization after N recognitions
    if (
      recSinceVocal >= 2 &&
      (now - lastVocalAt >= MIN_VOCAL_COOLDOWN_MS) &&
      !NapkinAudio.isVocalBusy()
    ) {
      const pVocal = Math.min(0.72, 0.34 + (recSinceVocal - 2) * 0.12);
      if (Math.random() < pVocal) {
        recSinceVocal = 0;
        lastVocalAt = now;
        let clip;
        if (!hasEurekaOnSheet && items.length >= 4 && (kind === 'arrow' || kind === 'shape') && Math.random() < 0.28) {
          clip = 'eureka_win';
          hasEurekaOnSheet = true;
        } else {
          const r = Math.random();
          clip = r < 0.32 ? 'ooo_intrigued' : (r < 0.64 ? 'aha_spark' : (r < 0.86 ? 'mm_ponder' : 'hmm_pause'));
        }
        const delay = 280 + Math.random() * 340;
        scheduleTimer(() => {
          if (!NapkinAudio.isVocalBusy()) NapkinAudio.playClip(clip, { channel: 'vocal' });
        }, delay);
      }
    }
  }

  function onUndo() {
    const now = performance.now();
    undoTimes = undoTimes.filter(t => now - t < 6000);
    undoTimes.push(now);
    resetIdleTimer();

    if (undoTimes.length >= 2 && (now - lastVocalAt >= 7500) && !NapkinAudio.isVocalBusy()) {
      if (Math.random() < 0.58) {
        lastVocalAt = now;
        const clip = Math.random() < 0.65 ? 'sigh_block' : 'hmm_pause';
        scheduleTimer(() => NapkinAudio.playClip(clip, { channel: 'vocal' }), 240 + Math.random() * 180);
      }
    }
  }

  function liftForCrumple() {
    clearPendingTimers();
    if (pointerState) finishPointer(true);
    state.refillProgress = null;
    if (!state.hasDrink) return Promise.resolve(false);
    // If mug is already completely off-napkin (e.g. mid-sip or already waiting), hold it off immediately
    if (state.phase === 'drinking' || state.phase === 'crumple_wait') {
      state.phase = 'crumple_wait';
      renderCupLayer();
      return Promise.resolve(true);
    }
    // Wait for an in-flight lift to finish cleanly
    if (state.phase === 'crumple_lift') {
      return new Promise(resolve => crumpleLiftResolvers.push(() => resolve(true)));
    }
    state.phase = 'crumple_lift';
    state.phaseStart = performance.now();
    state.setdownPlayed = false;
    kickAnim();
    return new Promise(resolve => crumpleLiftResolvers.push(() => resolve(true)));
  }

  function resetSheetForCrumple() {
    state.stains = [];
    hasInteractedWithDrawing = false;
    mugMoveCount = 0;
    hasEurekaOnSheet = false;
    recSinceVocal = 0;
    undoTimes = [];
  }

  function returnAfterCrumple() {
    if (!state.hasDrink || state.phase !== 'crumple_wait') return;
    state.phase = 'crumple_return';
    state.phaseStart = performance.now();
    state.setdownPlayed = false;
    kickAnim();
  }

  function init() {
    preloadCups();
    const grid = document.getElementById('drink-menu-grid');
    if (grid) {
      grid.innerHTML = DRINK_ORDER.map(id => {
        const d = DRINKS[id];
        return `
          <button class="drink-opt" data-drink="${id}" commandfor="drink-menu" command="hide-popover" onclick="NapkinCup.orderDrink('${id}')">
            <img src="./docs/vfx/cups/${id}_100.webp" alt="${d.name}" />
            <span class="do-name">${d.name}</span>
            <span class="do-sub">${d.sub}</span>
          </button>
        `;
      }).join('');
    }
    syncMenuBtn();
    resetIdleTimer();

    // Capture cup pointer interactions across the full stage (including mug parts overhanging napkin edges!)
    const stageEl = document.getElementById('stage');
    if (stageEl) {
      const toNapkin = e => {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };
      stageEl.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const p = toNapkin(e);
        if (typingTarget && isPointInsideTypingTarget(p.x, p.y)) return;
        if (onPointerDown(e, p, stageEl)) {
          if (typingTarget) commitTextBox();
          e.stopPropagation();
        }
      }, true);
      stageEl.addEventListener('pointermove', e => {
        if (onPointerMove(e, toNapkin(e))) e.stopPropagation();
      }, true);
      stageEl.addEventListener('pointerup', e => {
        if (finishPointer(false)) e.stopPropagation();
      }, true);
      stageEl.addEventListener('pointercancel', () => finishPointer(true), true);
      stageEl.addEventListener('lostpointercapture', () => finishPointer(true), false);
      stageEl.addEventListener('pointerleave', () => {
        if (!pointerState && hoveringCup) {
          hoveringCup = false;
          setCupCursor('');
        }
      });
    }
  }

  return {
    init,
    orderDrink,
    markDrawingInteraction,
    hitsCup,
    onPointerDown,
    onPointerMove,
    onPointerUp: () => finishPointer(false),
    onPointerCancel: () => finishPointer(true),
    renderStainsTo,
    renderCupTo,
    renderCupLayer,
    triggerDrink,
    triggerRefill,
    onActivity,
    onUndo,
    hasDrink: () => state.hasDrink,
    liftForCrumple,
    resetSheetForCrumple,
    returnAfterCrumple,
    getState: () => ({
      hasDrink: state.hasDrink,
      isDrinkDone: state.isDrinkDone,
      drinkId: state.drinkId,
      volume: Math.round(state.volume * 100),
      targetVolume: Math.round(state.targetVolume * 100),
      phase: state.phase,
      rotDeg: Math.round(state.rotDeg * 10) / 10,
      cupNX: Math.round(state.cupNX * 1000) / 1000,
      cupNY: Math.round(state.cupNY * 1000) / 1000,
      mugMoveCount,
      hasInteractedWithDrawing,
      stainCount: state.stains.length,
      loadedCups
    })
  };
})();

// ============================================================================
// 6. CRUMPLED NAPKIN BALL & THROW ANIMATION (SYNCED TO ./crumble.mp3)
// ============================================================================
let crumpleRaf = null;
let crumpleSeq = 0;

function drawTexturedTriangle(ctx, img, u0, v0, u1, v1, u2, v2, x0, y0, x1, y1, x2, y2, shade) {
  const denom = (u0 * (v1 - v2) + u1 * (v2 - v0) + u2 * (v0 - v1));
  if (Math.abs(denom) < 1e-3) return;

  // Slightly expand clip triangle by 0.75px from centroid to eliminate hairline seams
  const cx = (x0 + x1 + x2) / 3, cy = (y0 + y1 + y2) / 3;
  const ex = (x, y) => {
    const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) || 1;
    return [x + (dx / l) * 0.75, y + (dy / l) * 0.75];
  };
  const [px0, py0] = ex(x0, y0), [px1, py1] = ex(x1, y1), [px2, py2] = ex(x2, y2);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(px0, py0); ctx.lineTo(px1, py1); ctx.lineTo(px2, py2); ctx.closePath();
  ctx.clip();

  // Solve affine transform mapping (u,v) -> (x,y)
  const a = (x0 * (v1 - v2) + x1 * (v2 - v0) + x2 * (v0 - v1)) / denom;
  const b = (y0 * (v1 - v2) + y1 * (v2 - v0) + y2 * (v0 - v1)) / denom;
  const c = (x0 * (u2 - u1) + x1 * (u0 - u2) + x2 * (u1 - u0)) / denom;
  const d = (y0 * (u2 - u1) + y1 * (u0 - u2) + y2 * (u1 - u0)) / denom;
  const e = (x0 * (u1 * v2 - u2 * v1) + x1 * (u2 * v0 - u0 * v2) + x2 * (u0 * v1 - u1 * v0)) / denom;
  const f = (y0 * (u1 * v2 - u2 * v1) + y1 * (u2 * v0 - u0 * v2) + y2 * (u0 * v1 - u1 * v0)) / denom;

  ctx.transform(a, b, c, d, e, f);
  ctx.drawImage(img, 0, 0);
  ctx.restore();

  // 3D paper crease lighting overlay (warm umber shadows in folds, soft cream highlights on ridges)
  if (Math.abs(shade) > 0.01) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(px0, py0); ctx.lineTo(px1, py1); ctx.lineTo(px2, py2); ctx.closePath();
    ctx.fillStyle = shade > 0
      ? `rgba(255, 249, 238, ${Math.min(0.45, shade * 0.45).toFixed(3)})`
      : `rgba(74, 52, 28, ${Math.min(0.56, -shade * 0.56).toFixed(3)})`;
    ctx.fill();
    ctx.restore();
  }
}

// Smoothstep helper for choreographing crumple phases to ./crumble.mp3 envelope
function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / Math.max(1e-6, edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

async function clearAllWithCrumple() {
  const token = ++crumpleSeq;
  if (typingTarget) commitTextBox();
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  pendingStrokes = [];
  activeRaw = null;
  dragShape = null;
  dragItem = null;
  resizeState = null;
  selectedItem = null;
  hoverItem = null;
  NapkinAudio.stopDraw();

  // 1. If a drink is on the napkin, lift & remove the mug COMPLETELY before crumpling the paper!
  //    Decode ./crumble.mp3 in parallel so there is zero audio stall once the mug clears.
  const preparePromise = NapkinAudio.prepareCrumple();
  const liftedDrink = await NapkinCup.liftForCrumple();
  if (token !== crumpleSeq || liftedDrink === 'cancelled') return;
  if (liftedDrink) {
    // Crisp brief beat once mug clears the napkin so the removal reads unmistakably before paper crunches
    await new Promise(r => setTimeout(r, 45));
    if (token !== crumpleSeq) return;
  }
  await preparePromise;
  if (token !== crumpleSeq) return;

  // 2. Snapshot the cleared-of-mug napkin (with stains & ink) right before crumpling
  const hadContent = items.length > 0;
  render({ skipCup: true });
  const frameRect = document.getElementById('wrap').getBoundingClientRect();
  const snap = document.createElement('canvas');
  snap.width = Math.max(1, Math.round(frameRect.width));
  snap.height = Math.max(1, Math.round(frameRect.height));
  snap.getContext('2d').drawImage(canvas, 0, 0, snap.width, snap.height);

  // 3. Swap to a brand-new blank napkin underneath while the snapshot crumples away
  items = [];
  NapkinCup.resetSheetForCrumple();
  nextNapkin();
  render();

  // 4. Prepare triangulated crumpled paper mesh (10 x 7 grid)
  if (crumpleRaf) { cancelAnimationFrame(crumpleRaf); crumpleRaf = null; }
  const overlay = document.getElementById('crumple-overlay');
  const dpr = window.devicePixelRatio || 1;
  overlay.width = Math.round(window.innerWidth * dpr);
  overlay.height = Math.round(window.innerHeight * dpr);
  overlay.style.display = 'block';
  const octx = overlay.getContext('2d');

  const cols = 10, rows = 7;
  const ballR = Math.min(56, Math.min(frameRect.width, frameRect.height) * 0.135);
  const centerX = frameRect.left + frameRect.width * 0.5;
  const centerY = frameRect.top + frameRect.height * 0.5;

  // Build vertices with organic crumpled-ball target positions & 3D z-depths
  const verts = [];
  for (let j = 0; j <= rows; j++) {
    for (let i = 0; i <= cols; i++) {
      const u = (i / cols) * snap.width;
      const v = (j / rows) * snap.height;
      const sx = frameRect.left + u;
      const sy = frameRect.top + v;
      const ang = Math.atan2(sy - centerY, sx - centerX) + (Math.random() - 0.5) * 0.85;
      const normDist = Math.hypot((i / cols) - 0.5, (j / rows) - 0.5) * 1.414;
      const foldR = ballR * (0.28 + 0.72 * Math.pow(normDist, 0.75) * (0.68 + Math.random() * 0.45));
      const bx = Math.cos(ang) * foldR + (Math.random() - 0.5) * ballR * 0.28;
      const by = Math.sin(ang) * foldR + (Math.random() - 0.5) * ballR * 0.28;
      const bz = (Math.random() - 0.45) * 2.1;
      const creaseDelay = Math.random() * 0.20;
      verts.push({ u, v, sx, sy, bx, by, bz, delay: creaseDelay * (1 - normDist * 0.42), jitterPhase: Math.random() * Math.PI * 2 });
    }
  }

  // Perimeter indices for crisp lifted-sheet drop shadow (makes blank kraft napkin pop!)
  const borderIdx = [];
  for (let i = 0; i <= cols; i++) borderIdx.push(i);
  for (let j = 1; j <= rows; j++) borderIdx.push(j * (cols + 1) + cols);
  for (let i = cols - 1; i >= 0; i--) borderIdx.push(rows * (cols + 1) + i);
  for (let j = rows - 1; j >= 1; j--) borderIdx.push(j * (cols + 1));

  const tris = [];
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const a = j * (cols + 1) + i;
      const b = a + 1;
      const c = a + (cols + 1);
      const d = c + 1;
      if ((i + j) % 2 === 0) { tris.push([a, b, d]); tris.push([a, d, c]); }
      else { tris.push([a, b, c]); tris.push([b, d, c]); }
    }
  }

  // Exact acoustic choreography matched to ./crumble.mp3 (1.000s):
  //   0..445ms: Squeeze 1 (initial sharp fold snap at 80ms peak, rolling folds at 225ms & 305ms)
  // 445..555ms: Brief grip-reset lull (matches quiet valley 450..550ms in crumble.mp3)
  // 555..940ms: Squeeze 2 (tight final crush hitting 725ms & 890ms peaks + throw wind-up)
  // 920..1420ms: Parabolic toss away right as the final 940ms crinkle concludes!
  const TOSS_START = 920;
  const TOTAL_DUR = 1420;

  // Fire ./crumble.mp3 and start clock on the exact same synchronous tick
  NapkinAudio.playCrumple();
  if (hadContent) {
    setTimeout(() => {
      if (token === crumpleSeq) NapkinAudio.playClip('argh_stain', { channel: 'vocal', interrupt: true });
    }, 140);
  }
  const tStart = performance.now();
  let cupReturnFired = false;

  function step(now) {
    const ms = Math.max(0, now - tStart);
    const t = Math.min(1, ms / TOTAL_DUR);

    // Once the tossed paper ball has practically exited the screen, smoothly bring the mug back down
    if (!cupReturnFired && ms >= 1340) {
      cupReturnFired = true;
      if (token === crumpleSeq) NapkinCup.returnAfterCrumple();
    }
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Two-squeeze crumple progress synced directly to ./crumble.mp3 peaks
    let cPhase = 0;
    if (ms < 445) {
      // Fast snap on 80ms crack peak, then rolling gather through 445ms
      const p1 = ms / 445;
      const snap = 1 - Math.pow(1 - p1, 2.35);
      cPhase = 0.72 * snap;
    } else if (ms < 555) {
      // Quiet regrip lull (445..555ms): subtle gentle settle
      cPhase = 0.72 + 0.025 * smoothstep(445, 555, ms);
    } else {
      // Second tight squeeze (555..940ms): finishes tight ball right as audio finishes
      cPhase = 0.745 + 0.255 * smoothstep(555, 935, ms);
    }

    // Secondary tight compaction + subtle twist during Squeeze 2 (555..940ms)
    const squeeze2 = smoothstep(555, 920, ms);
    // Micro-crunch tremor aligned to the 4 strongest acoustic peaks in crumble.mp3 (80, 225, 725, 890ms)
    const pulse = (peakMs, width) => Math.exp(-Math.pow((ms - peakMs) / width, 2));
    const crunchShake =
      pulse(82, 24) * 4.2 +
      pulse(228, 30) * 2.8 +
      pulse(310, 28) * 2.0 +
      pulse(728, 32) * 3.0 +
      pulse(892, 24) * 2.4;

    const tossPhase = Math.max(0, Math.min(1, (ms - TOSS_START) / (TOTAL_DUR - TOSS_START)));

    // Brief downward wind-up dip right at the end of Squeeze 2 before launching
    const windupY = ms > 820 && ms < 990 ? Math.sin(((ms - 820) / 170) * Math.PI) * 12 : 0;
    const tx = tossPhase * (window.innerWidth * 0.60 + 175);
    const ty = -Math.sin(tossPhase * Math.PI * 0.84) * 230 + tossPhase * tossPhase * 95 + windupY;
    const ballCx = centerX + tx;
    const ballCy = centerY + ty;

    // Slight hand twist during second squeeze, then snappy spin during throw
    const spin = squeeze2 * 0.42 + Math.pow(tossPhase, 1.55) * 9.2;
    // Compress ball noticeably tighter during Squeeze 2 (1.14 -> 0.88), then shrink in flight
    const crushScale = 1.14 - 0.26 * squeeze2;
    const flightScale = 1.0 - 0.74 * Math.pow(tossPhase, 1.15);
    const scale = crushScale * flightScale;
    const alpha = tossPhase > 0.78 ? Math.max(0, 1 - (tossPhase - 0.78) / 0.22) : 1;

    const cosS = Math.cos(spin), sinS = Math.sin(spin);

    const cur = verts.map(vt => {
      const lc = Math.max(0, Math.min(1, (cPhase - vt.delay) / Math.max(0.12, 1 - vt.delay)));
      const ease = lc < 0.5 ? 4 * lc * lc * lc : 1 - Math.pow(-2 * lc + 2, 3) / 2;
      const rx = (vt.bx * cosS - vt.by * sinS) * scale;
      const ry = (vt.bx * sinS + vt.by * cosS) * scale;
      const jx = Math.cos(vt.jitterPhase + ms * 0.04) * crunchShake * ease;
      const jy = Math.sin(vt.jitterPhase + ms * 0.04) * crunchShake * ease;
      const x = vt.sx * (1 - ease) + (ballCx + rx) * ease + jx;
      const y = vt.sy * (1 - ease) + (ballCy + ry) * ease + jy;
      return { u: vt.u, v: vt.v, x, y, z: vt.bz * ease * (0.85 + 0.35 * squeeze2) };
    });

    // Lifted paper sheet shadow (visible during initial fold so even a blank napkin clearly detaches!)
    const sheetShadowAlpha = Math.sin(Math.min(1, cPhase) * Math.PI) * 0.20 * (1 - tossPhase);
    if (sheetShadowAlpha > 0.006) {
      octx.save();
      octx.fillStyle = `rgba(48, 34, 16, ${sheetShadowAlpha.toFixed(3)})`;
      octx.beginPath();
      borderIdx.forEach((vi, idx) => {
        const pt = cur[vi];
        if (idx === 0) octx.moveTo(pt.x + 8, pt.y + 12);
        else octx.lineTo(pt.x + 8, pt.y + 12);
      });
      octx.closePath();
      octx.fill();
      octx.restore();
    }

    // Soft cast shadow beneath crumpled ball (separates downward during throw)
    const shadowAlpha = (0.20 * Math.pow(cPhase, 1.35)) * (1 - tossPhase * 0.85);
    if (shadowAlpha > 0.005) {
      octx.save();
      octx.fillStyle = `rgba(50, 36, 18, ${shadowAlpha.toFixed(3)})`;
      octx.beginPath();
      const sRad = ballR * (0.95 + (1 - cPhase) * 1.35) * scale;
      octx.ellipse(ballCx + 10, ballCy + 18 + tossPhase * 90, sRad, sRad * 0.55, 0, 0, Math.PI * 2);
      octx.fill();
      octx.restore();
    }

    // Painter's algorithm: sort triangles back-to-front by average z
    const sorted = tris.map(([i0, i1, i2]) => {
      const p0 = cur[i0], p1 = cur[i1], p2 = cur[i2];
      const avgZ = (p0.z + p1.z + p2.z) / 3;
      const ux = p1.x - p0.x, uy = p1.y - p0.y, uz = (p1.z - p0.z) * 30;
      const vx = p2.x - p0.x, vy = p2.y - p0.y, vz = (p2.z - p0.z) * 30;
      const nx = uy * vz - uz * vy;
      const ny = uz * vx - ux * vz;
      const nz = ux * vy - uy * vx;
      const nl = Math.hypot(nx, ny, nz) || 1;
      const dot = (nx * -0.5 + ny * -0.6 + Math.abs(nz) * 0.62) / nl;
      const shade = (dot - 0.50) * Math.min(1.15, cPhase * 1.55);
      return { p0, p1, p2, avgZ, shade };
    }).sort((a, b) => a.avgZ - b.avgZ);

    octx.save();
    octx.globalAlpha = alpha;
    for (const tr of sorted) {
      drawTexturedTriangle(
        octx, snap,
        tr.p0.u, tr.p0.v, tr.p1.u, tr.p1.v, tr.p2.u, tr.p2.v,
        tr.p0.x, tr.p0.y, tr.p1.x, tr.p1.y, tr.p2.x, tr.p2.y,
        tr.shade
      );
    }
    octx.restore();

    if (t < 1) {
      crumpleRaf = requestAnimationFrame(step);
    } else {
      overlay.style.display = 'none';
      crumpleRaf = null;
      if (!cupReturnFired && token === crumpleSeq) {
        cupReturnFired = true;
        NapkinCup.returnAfterCrumple();
      }
    }
  }

  crumpleRaf = requestAnimationFrame(step);
}

// ============================================================================
// 6. CANVAS ENGINE: SELECT + RESIZE + DELETE + LIVE TYPING + 600ms SKETCH
// ============================================================================
const canvas = document.getElementById('c');
const inlineInput = document.getElementById('inline-text');
let tool = 'sketch';
let items = [];
let activeRaw = null;
let pendingStrokes = [];
let pendingMode = null;
let pendingTimer = null;
let dragShape = null;

// Selection, Drag & Resize state
let selectedItem = null;
let hoverItem = null;
let dragItem = null, dragOff = [0, 0], dragMoved = false;
let resizeState = null; // { item, handle:'nw'|'ne'|'sw'|'se', origBox, origSnap }

let typingTarget = null;
let caretVisible = true;
let caretTimer = null;
let renderQueued = false;

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function flushPendingNow() {
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  if (!pendingStrokes.length) return;
  const batch = pendingStrokes;
  const mode = pendingMode || tool;
  pendingStrokes = [];
  pendingMode = null;
  let created;
  if (mode === 'handwrite') {
    created = buildHandwriteObject(batch);
    items.push(created);
    NapkinCup.onActivity('text');
  } else {
    created = recognizeMultiStroke(batch);
    items.push(created);
    NapkinCup.onActivity(created.kind || 'sketch');
  }
  scheduleRender();
}

function setTool(t) {
  flushPendingNow();
  tool = t;
  hoverItem = null;
  if (t !== 'move') selectedItem = null;
  document.querySelectorAll('button.tool-btn[id^="t-"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('t-' + t);
  if (btn) btn.classList.add('active');
  canvas.style.cursor = t === 'move' ? 'default' : (t === 'text' ? 'text' : 'crosshair');
  scheduleRender();
}

function getResizeHandles(it) {
  const pad = 5;
  return [
    { id: 'nw', x: it.x - pad,        y: it.y - pad,        cursor: 'nwse-resize' },
    { id: 'ne', x: it.x + it.w + pad, y: it.y - pad,        cursor: 'nesw-resize' },
    { id: 'sw', x: it.x - pad,        y: it.y + it.h + pad, cursor: 'nesw-resize' },
    { id: 'se', x: it.x + it.w + pad, y: it.y + it.h + pad, cursor: 'nwse-resize' }
  ];
}

function hitResizeHandle(it, px, py) {
  if (!it) return null;
  for (const h of getResizeHandles(it)) {
    if (Math.abs(px - h.x) <= 7 && Math.abs(py - h.y) <= 7) return h;
  }
  return null;
}

function snapshotItemGeometry(it) {
  return {
    x: it.x, y: it.y, w: it.w, h: it.h,
    x1: it.x1, y1: it.y1, x2: it.x2, y2: it.y2,
    anchorX: it.anchorX, anchorY: it.anchorY,
    strokes: it.strokes.map(s => s.pts.map(p => [p[0], p[1], p[2]])),
    textStrokes: it.textStrokes ? it.textStrokes.map(s => s.pts.map(p => [p[0], p[1], p[2]])) : null,
    rawList: it.rawList ? it.rawList.map(r => r.map(p => ({ x: p.x, y: p.y }))) : null
  };
}

function applyLiveResize(it, snap, newX, newY, newW, newH) {
  const sx = newW / Math.max(1, snap.w);
  const sy = newH / Math.max(1, snap.h);
  const mapX = x => newX + (x - snap.x) * sx;
  const mapY = y => newY + (y - snap.y) * sy;

  it.x = newX; it.y = newY; it.w = newW; it.h = newH;
  it.strokes.forEach((s, si) => {
    const orig = snap.strokes[si];
    for (let i = 0; i < orig.length; i++) {
      s.pts[i][0] = mapX(orig[i][0]);
      s.pts[i][1] = mapY(orig[i][1]);
    }
  });
  if (it.textStrokes && snap.textStrokes) {
    it.textStrokes.forEach((s, si) => {
      const orig = snap.textStrokes[si];
      for (let i = 0; i < orig.length; i++) {
        s.pts[i][0] = mapX(orig[i][0]);
        s.pts[i][1] = mapY(orig[i][1]);
      }
    });
  }
  if (it.rawList && snap.rawList) {
    it.rawList.forEach((r, ri) => {
      const orig = snap.rawList[ri];
      for (let i = 0; i < orig.length; i++) {
        r[i].x = mapX(orig[i].x);
        r[i].y = mapY(orig[i].y);
      }
    });
  }
  if (snap.anchorX !== undefined) {
    it.anchorX = mapX(snap.anchorX);
    it.anchorY = mapY(snap.anchorY);
  }
  if (snap.x1 !== undefined) {
    it.x1 = mapX(snap.x1); it.y1 = mapY(snap.y1);
    it.x2 = mapX(snap.x2); it.y2 = mapY(snap.y2);
  }
}

function finalizeResize(it) {
  if (it.kind === 'shape') {
    // Re-generate crisp OpenSketch designer strokes at new dimensions
    it.strokes = buildShapeStrokes(it.shapeType, it.x, it.y, it.w, it.h, it.color, it.penId || 'ballpoint');
    // Re-layout cached cursive label cleanly inside the resized shape (0ms via wordCache!)
    if (it.label) {
      const maxW = it.shapeType === 'diamond' ? it.w * 0.62 : it.w * 0.84;
      const targetH = Math.min(34, Math.max(16, it.h * 0.48));
      synthesizeCursiveStreaming(it.label, it.x + it.w / 2, it.y + it.h / 2, targetH, maxW, it.color, it, null, it.styleKey || currentStyleKey, 'center');
    }
  } else if (it.kind === 'arrow' && it.x1 !== undefined) {
    const fresh = buildArrowItem(it.x1, it.y1, it.x2, it.y2, it.color, it.penId || 'ballpoint');
    it.strokes = fresh.strokes;
    it.x = fresh.x; it.y = fresh.y; it.w = fresh.w; it.h = fresh.h;
  }
}

// Node-free variable-width filled stroke polygon builder (single atomic fill -> zero joint beads!)
function buildStrokeOutline(pts, baseW, penId = 'ballpoint') {
  if (!pts || pts.length === 0) return null;

  // 1. Deduplicate near-coincident points so tangents stay well-defined
  const clean = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const prev = clean[clean.length - 1];
