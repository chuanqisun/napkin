<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Napkin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="group">
          <div class="brand">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19l7-7 3 3-7 7-3-3z" />
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
              <path d="M2 2l7.586 7.586" />
            </svg>
            Napkin
          </div>
          <div class="divider"></div>

          <button id="t-sketch" class="tool-btn active" data-tool="sketch" title="Sketch &amp; Handwrite (auto-beautifies clean shapes &amp; arrows) [S]">
            <svg viewBox="0 0 24 24">
              <path d="M3 16c2.5-6 5-9 7-4s3 7 5 1 4-7 6-2" />
            </svg>
            <span class="lbl">Sketch</span>
          </button>
          <button id="t-text" class="tool-btn" data-tool="text" title="Single-click anywhere or inside a shape to type live [T]">
            <svg viewBox="0 0 24 24">
              <path d="M5 6V4h14v2" />
              <path d="M12 4v16" />
              <path d="M9 20h6" />
            </svg>
            <span class="lbl">Text</span>
          </button>

          <div class="divider"></div>

          <button id="t-box" class="tool-btn" data-tool="box" title="Drag Box [B]">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5" /></svg>
            <span class="lbl">Box</span>
          </button>
          <button id="t-oval" class="tool-btn" data-tool="oval" title="Drag Oval [O]">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5" /></svg>
            <span class="lbl">Oval</span>
          </button>
          <button id="t-diamond" class="tool-btn" data-tool="diamond" title="Drag Diamond [D]">
            <svg viewBox="0 0 24 24"><polygon points="12 3 21 12 12 21 3 12" /></svg>
            <span class="lbl">Diamond</span>
          </button>
          <button id="t-arrow" class="tool-btn" data-tool="arrow" title="Drag Arrow [A]">
            <svg viewBox="0 0 24 24">
              <path d="M5 19L19 5" />
              <path d="M10 5h9v9" />
            </svg>
            <span class="lbl">Arrow</span>
          </button>

          <div class="divider"></div>

          <button id="t-move" class="tool-btn" data-tool="move" title="Select, Move, Resize &amp; Delete [V]">
            <svg viewBox="0 0 24 24"><path d="M4 4l7.5 16 2.8-6.2L20.5 11 4 4z" /></svg>
            <span class="lbl">Select</span>
          </button>
        </div>

        <div class="group">
          <button id="pen-btn" class="tool-btn" commandfor="pen-menu" command="toggle-popover" title="Choose Pen &amp; Handwriting Style">
            <img id="pen-btn-img" class="pen-mini" src="" alt="Selected pen" />
            <span class="lbl" id="pen-btn-lbl">Ballpoint</span>
          </button>

          <div class="divider"></div>

          <div class="swatches" role="group" aria-label="Ink color">
            <button class="swatch active" data-color="#1b3d8f" style="background: #1b3d8f" title="Ballpoint Blue"></button>
            <button class="swatch" data-color="#1c1e22" style="background: #1c1e22" title="Black Ink"></button>
            <button class="swatch" data-color="#b91c1c" style="background: #b91c1c" title="Red Ink"></button>
          </div>

          <div class="divider"></div>

          <button id="drink-menu-btn" class="tool-btn menu-prominent" commandfor="drink-menu" command="toggle-popover" title="Open Café Menu to order a drink">
            <svg viewBox="0 0 24 24">
              <path d="M17 8h1a4 4 0 0 1 0 8h-1" />
              <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
              <line x1="6" y1="2" x2="6" y2="4" />
              <line x1="10" y1="2" x2="10" y2="4" />
              <line x1="14" y1="2" x2="14" y2="4" />
            </svg>
            <span class="lbl">Menu</span>
            <span class="menu-dot" aria-hidden="true"></span>
          </button>

          <div class="divider"></div>

          <button id="sound-toggle" class="tool-btn" aria-pressed="true" aria-label="Sound On" title="Sound On (click to mute)">
            <svg class="snd-icon-on" viewBox="0 0 24 24">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <svg class="snd-icon-off" viewBox="0 0 24 24">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <line x1="23" y1="9" x2="17" y2="15" />
              <line x1="17" y1="9" x2="23" y2="15" />
            </svg>
          </button>

          <div class="divider"></div>

          <button id="undo-btn" class="tool-btn" title="Undo [Ctrl+Z]">
            <svg viewBox="0 0 24 24">
              <path d="M9 14L4 9l5-5" />
              <path d="M20 20v-7a4 4 0 0 0-4-4H4" />
            </svg>
          </button>
          <button id="clear-btn" class="tool-btn" title="Crumple &amp; Toss Napkin">
            <svg viewBox="0 0 24 24">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
            </svg>
          </button>
          <button id="save-btn" class="tool-btn" commandfor="save-menu" command="toggle-popover" title="Save Napkin (PNG or SVG with Napkin Background)">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <path d="M7 10l5 5 5-5" />
              <path d="M12 15V3" />
            </svg>
            <span class="lbl">Save</span>
          </button>

          <div class="divider"></div>

          <a id="github-link" class="tool-btn" href="https://github.com/chuanqisun/napkin" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository" title="View on GitHub">
            <svg class="icon-fill" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
            </svg>
          </a>
        </div>
      </header>

      <main class="stage" id="stage">
        <div class="napkin-frame" id="wrap">
          <canvas id="c"></canvas>
          <input id="inline-text" type="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Napkin text input" />
          <div id="sel-actions" class="sel-actions" role="toolbar" aria-label="Selected item actions" hidden>
            <button id="sel-edit-btn" type="button" class="sel-act-btn">Edit</button>
            <button id="sel-delete-btn" type="button" class="sel-act-btn sel-act-danger">Delete</button>
          </div>
          <button id="reset-view-btn" type="button" class="reset-view-btn" title="Reset pan &amp; zoom" hidden>100%</button>
        </div>
        <canvas id="cup-layer"></canvas>
      </main>

      <!-- Declarative Popover: Combined Pen & Handwriting Style Menu -->
      <div id="pen-menu" class="napkin-popover" popover aria-label="Pen and Handwriting Style">
        <div class="pop-head">
          <div>
            <div class="pop-title">Pen &amp; Writing Style</div>
            <div class="pop-sub">Applies to future ink &amp; pen sound</div>
          </div>
          <button id="pen-close-btn" class="pop-close" commandfor="pen-menu" command="hide-popover" aria-label="Close pen menu">&times;</button>
        </div>
        <div class="pop-sec-lbl">Pen</div>
        <div class="pen-list" id="pen-list"></div>
        <div class="pop-sec-lbl">Handwriting Style</div>
        <div class="style-grid" id="style-grid"></div>
      </div>

      <!-- Declarative Popover: Café Drink Order Menu -->
      <div id="drink-menu" class="napkin-popover" popover aria-label="Café Drink Menu">
        <div class="pop-head">
          <div>
            <div class="pop-title">Caf&eacute; Menu</div>
            <div class="pop-sub" id="drink-menu-sub">Get caffeinated for better ideas</div>
          </div>
          <button id="drink-close-btn" class="pop-close" commandfor="drink-menu" command="hide-popover" aria-label="Close café menu">&times;</button>
        </div>
        <div class="drink-grid" id="drink-menu-grid"></div>
      </div>

      <!-- Declarative Popover: Save Format Menu -->
      <div id="save-menu" class="napkin-popover save-menu" popover role="menu" aria-label="Save Napkin">
        <button id="export-png-btn" role="menuitem" commandfor="save-menu" command="hide-popover">
          <span class="sm-title">Save PNG Image</span>
          <span class="sm-sub">2&times; HiDPI &middot; full napkin texture &amp; ink</span>
        </button>
        <button id="export-svg-btn" role="menuitem" commandfor="save-menu" command="hide-popover">
          <span class="sm-title">Save SVG Vector</span>
          <span class="sm-sub">Editable vector ink + napkin background</span>
        </button>
      </div>
    </div>
    <canvas id="crumple-overlay"></canvas>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
