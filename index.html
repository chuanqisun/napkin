    if (Math.hypot(pts[i][0] - prev[0], pts[i][1] - prev[1]) >= 0.35) {
      clean.push(pts[i]);
    }
  }
  const n = clean.length;

  const radiusFor = (p, ang) => {
    if (penId === 'pencil') return Math.max(0.45, baseW * (0.76 + 0.56 * p) * 0.5);
    if (penId === 'marker') return Math.max(1.30, baseW * (1.85 + 0.62 * p) * 0.5);
    if (penId === 'fountain') {
      const nib = 0.42 + 0.96 * Math.abs(Math.sin(ang - 0.72));
      return Math.max(0.28, baseW * (0.30 + 1.32 * p) * nib * 0.5);
    }
    if (penId === 'mech') return Math.max(0.28, baseW * (0.50 + 0.24 * p) * 0.5);
    return Math.max(0.32, baseW * (0.38 + 0.92 * p) * 0.5);
  };

  // Single-dot stroke (e.g., short 'i' dot)
  if (n < 2) {
    const r0 = radiusFor(clean[0][2] ?? 0.8, 0);
    return { dot: true, x: clean[0][0], y: clean[0][1], r: r0 };
  }

  // 2. Unit segment tangents & smoothed per-vertex half-widths
  const segT = [];
  for (let i = 0; i < n - 1; i++) {
    const dx = clean[i + 1][0] - clean[i][0];
    const dy = clean[i + 1][1] - clean[i][1];
    const d = Math.hypot(dx, dy) || 1;
    segT.push([dx / d, dy / d]);
  }

  const rawR = new Array(n);
  for (let i = 0; i < n; i++) {
    const t = i === 0 ? segT[0] : (i === n - 1 ? segT[n - 2] : [segT[i - 1][0] + segT[i][0], segT[i - 1][1] + segT[i][1]]);
    const ang = Math.atan2(t[1], t[0]);
    rawR[i] = radiusFor(clean[i][2] ?? 0.75, ang);
  }
  const rad = new Array(n);
  rad[0] = rawR[0]; rad[n - 1] = rawR[n - 1];
  for (let i = 1; i < n - 1; i++) rad[i] = rawR[i - 1] * 0.22 + rawR[i] * 0.56 + rawR[i + 1] * 0.22;

  // 3. Build left & right contour chains with smooth round bevels on sharp corners
  const left = [], right = [];
  const pushArc = (arr, cx, cy, r, aStart, aEnd, steps) => {
    let dA = aEnd - aStart;
    while (dA > Math.PI) dA -= Math.PI * 2;
    while (dA < -Math.PI) dA += Math.PI * 2;
    for (let s = 0; s <= steps; s++) {
      const a = aStart + dA * (s / steps);
      arr.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  };

  // Start point
  {
    const [tx, ty] = segT[0];
    const nx = -ty, ny = tx, r = rad[0];
    left.push([clean[0][0] + nx * r, clean[0][1] + ny * r]);
    right.push([clean[0][0] - nx * r, clean[0][1] - ny * r]);
  }

  // Interior points
  for (let i = 1; i < n - 1; i++) {
    const [tx0, ty0] = segT[i - 1], [tx1, ty1] = segT[i];
    const nx0 = -ty0, ny0 = tx0;
    const nx1 = -ty1, ny1 = tx1;
    const x = clean[i][0], y = clean[i][1], r = rad[i];
    const dot = tx0 * tx1 + ty0 * ty1;

    if (dot > 0.55) {
      let mx = nx0 + nx1, my = ny0 + ny1;
      const ml = Math.hypot(mx, my) || 1;
      mx /= ml; my /= ml;
      const miter = Math.min(1.22, 1 / Math.max(0.6, mx * nx0 + my * ny0));
      left.push([x + mx * r * miter, y + my * r * miter]);
      right.push([x - mx * r * miter, y - my * r * miter]);
    } else {
      // Sharp corner (e.g., Z zig-zag or box corner): round outer edge smoothly so zero spike/node forms!
      const cross = tx0 * ty1 - ty0 * tx1;
      if (cross >= 0) {
        // Turning right (in screen Y-down coords): left side is outer!
        pushArc(left, x, y, r, Math.atan2(ny0, nx0), Math.atan2(ny1, nx1), 4);
        right.push([x - nx0 * r, y - ny0 * r]);
        right.push([x - nx1 * r, y - ny1 * r]);
      } else {
        // Turning left: right side is outer!
        left.push([x + nx0 * r, y + ny0 * r]);
        left.push([x + nx1 * r, y + ny1 * r]);
        pushArc(right, x, y, r, Math.atan2(-ny0, -nx0), Math.atan2(-ny1, -nx1), 4);
      }
    }
  }

  // End point
  {
    const [tx, ty] = segT[n - 2];
    const nx = -ty, ny = tx, r = rad[n - 1];
    left.push([clean[n - 1][0] + nx * r, clean[n - 1][1] + ny * r]);
    right.push([clean[n - 1][0] - nx * r, clean[n - 1][1] - ny * r]);
  }

  // 4. Assemble one closed polygon: left chain -> rounded end cap -> reversed right chain -> rounded start cap
  const poly = [];
  for (const pt of left) poly.push(pt);

  // Rounded end cap from left[end] around tip to right[end]
  const [etx, ety] = segT[n - 2];
  const endAng = Math.atan2(ety, etx);
  const er = rad[n - 1];
  for (let s = 1; s < 5; s++) {
    const a = (endAng + Math.PI * 0.5) - (Math.PI * s) / 5;
    poly.push([clean[n - 1][0] + Math.cos(a) * er, clean[n - 1][1] + Math.sin(a) * er]);
  }

  for (let i = right.length - 1; i >= 0; i--) poly.push(right[i]);

  // Rounded start cap from right[0] around tail to left[0]
  const [stx, sty] = segT[0];
  const startAng = Math.atan2(sty, stx);
  const sr = rad[0];
  for (let s = 1; s < 5; s++) {
    const a = (startAng - Math.PI * 0.5) - (Math.PI * s) / 5;
    poly.push([clean[0][0] + Math.cos(a) * sr, clean[0][1] + Math.sin(a) * sr]);
  }

  return { dot: false, poly };
}

function tracePoly(ctx, poly, ox = 0, oy = 0) {
  if (!poly || poly.length < 3) return;
  ctx.beginPath();
  ctx.moveTo(poly[0][0] + ox, poly[0][1] + oy);
  for (let i = 1; i < poly.length; i++) {
    ctx.lineTo(poly[i][0] + ox, poly[i][1] + oy);
  }
  ctx.closePath();
}

function strokeAlphaForPen(penId, alphaScale) {
  if (penId === 'pencil')   return Math.min(0.68, 0.52 * alphaScale);
  if (penId === 'marker')   return Math.min(0.66, 0.58 * alphaScale);
  if (penId === 'fountain') return Math.min(0.96, 0.91 * alphaScale);
  if (penId === 'mech')     return Math.min(0.86, 0.80 * alphaScale);
  return Math.min(0.95, 0.88 * alphaScale);
}

// Node-free single-fill ink renderer (ballpoint, pencil, marker, fountain, 0.5mm mech)
function drawPStroke(ctx, pts, baseW, color, alphaScale, penId = 'ballpoint') {
  if (!pts || pts.length < 1) return;
  const outline = buildStrokeOutline(pts, baseW, penId);
  if (!outline) return;

  const al = strokeAlphaForPen(penId, alphaScale);
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = color;

  if (outline.dot) {
    ctx.globalAlpha = al;
    ctx.beginPath();
    ctx.arc(outline.x, outline.y, outline.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  // ONE atomic fill call per stroke -> zero overlapping round-cap joint dots!
  ctx.globalAlpha = al;
  tracePoly(ctx, outline.poly, 0, 0);
  ctx.fill('nonzero');

  // Subtle single-fill dry graphite paper-tooth offset pass for 2B pencil (also node-free!)
  if (penId === 'pencil') {
    ctx.globalAlpha = al * 0.28;
    tracePoly(ctx, outline.poly, 0.72, 0.52);
    ctx.fill('nonzero');
  }

  ctx.restore();
}

function drawRawPreview(ctx, rawPts, color) {
  if (!rawPts || rawPts.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.strokeStyle = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = currentPenId === 'marker' ? 4.4 : (currentPenId === 'mech' ? 1.15 : (currentPenId === 'pencil' ? 2.1 : 1.9));
  ctx.globalAlpha = currentPenId === 'pencil' ? 0.42 : (currentPenId === 'marker' ? 0.48 : 0.62);
  ctx.beginPath(); ctx.moveTo(rawPts[0].x, rawPts[0].y);
  for (let i = 1; i < rawPts.length; i++) ctx.lineTo(rawPts[i].x, rawPts[i].y);
  ctx.stroke();
  ctx.restore();
}

function render(opts = {}) {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(r.width * dpr), ch = Math.round(r.height * dpr);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawNapkinBackground(ctx, r.width, r.height);
  NapkinCup.renderStainsTo(ctx);

  for (const it of items) {
    for (const s of it.strokes) drawPStroke(ctx, s.pts, s.baseW, s.color, s.alpha, s.penId || it.penId || 'ballpoint');
    if (it.textStrokes) for (const s of it.textStrokes) drawPStroke(ctx, s.pts, s.baseW, s.color, s.alpha, s.penId || it.penId || 'ballpoint');
  }

  // Direct napkin-only text editing UI (no secondary input box!)
  if (typingTarget) {
    const val = inlineInput.value || '';
    const len = val.length;
    const selStart = Math.min(len, inlineInput.selectionStart ?? len);
    const selEnd = Math.min(len, inlineInput.selectionEnd ?? len);
    const trailingSpaces = (val.match(/\s+$/) || [''])[0].length;

    let minX = typingTarget.x, maxX = typingTarget.x;
    let cx = typingTarget.x, cy = typingTarget.y, chH = 26, col = currentColor;

    if (typingTarget.shapeRef) {
      const sh = typingTarget.shapeRef;
      col = sh.color;
      cy = sh.y + sh.h / 2;
      chH = Math.min(26, Math.max(16, sh.h * 0.48));

      // Subtle paper-native focus highlight around the active shape
      ctx.save();
      ctx.strokeStyle = 'rgba(35, 32, 28, 0.30)';
      ctx.lineWidth = 1.1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(sh.x - 4, sh.y - 4, sh.w + 8, sh.h + 8);
      ctx.restore();

      if (sh.textStrokes && sh.textStrokes.length) {
        minX = 1e9; maxX = -1e9;
        for (const s of sh.textStrokes) {
          for (const pt of s.pts) {
            if (pt[0] < minX) minX = pt[0];
            if (pt[0] > maxX) maxX = pt[0];
          }
        }
        const effMaxX = maxX + trailingSpaces * 10;
        if (selEnd >= len) cx = effMaxX + 5;
        else cx = minX + (effMaxX - minX) * (selEnd / Math.max(1, len));
      } else {
        minX = sh.x + sh.w / 2;
        maxX = minX + trailingSpaces * 10;
        cx = maxX;
        if (len === 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(110, 100, 87, 0.42)';
          ctx.font = 'italic 12px Georgia, "Times New Roman", serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('Type label...', sh.x + sh.w / 2, cy);
          ctx.restore();
        }
      }
    } else if (typingTarget.textItem) {
      const ti = typingTarget.textItem;
      col = ti.color;
      cy = ti.anchorY;
      chH = 28;
      minX = ti.anchorX;
      const hasInk = ti.strokes && ti.strokes.length > 0;
      const effMaxX = hasInk ? (ti.x + ti.w + trailingSpaces * 12) : (ti.anchorX + trailingSpaces * 12);
      maxX = effMaxX;
      if (selEnd >= len) cx = hasInk ? (effMaxX + 5) : effMaxX;
      else cx = minX + (effMaxX - minX) * (selEnd / Math.max(1, len));

      // Subtle napkin baseline guide directly beneath the text area
      const lineEnd = Math.max(ti.anchorX + 116, effMaxX + 18);
      ctx.save();
      ctx.strokeStyle = 'rgba(92, 74, 52, 0.28)';
      ctx.lineWidth = 1.1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(ti.anchorX - 3, cy + chH * 0.56);
      ctx.lineTo(lineEnd, cy + chH * 0.56);
      ctx.stroke();
      ctx.restore();

      if (len === 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(110, 100, 87, 0.44)';
        ctx.font = 'italic 14px Georgia, "Times New Roman", serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText('Type on napkin...', ti.anchorX + 7, cy);
        ctx.restore();
      }
    }

    // Translucent highlight when user selects text (Ctrl+A / Shift+Arrows)
    if (selStart !== selEnd && len > 0 && maxX > minX) {
      const sx0 = minX + (maxX - minX) * (selStart / len);
      const sx1 = minX + (maxX - minX) * (selEnd / len);
      ctx.save();
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.14;
      ctx.fillRect(sx0 - 2, cy - chH * 0.55, Math.max(6, sx1 - sx0 + 4), chH * 1.1);
      ctx.restore();
    }

    // Keep hidden IME focus proxy anchored right at the caret
    inlineInput.style.left = Math.max(4, Math.min(r.width - 8, cx)) + 'px';
    inlineInput.style.top = Math.max(4, Math.min(r.height - 30, cy - chH * 0.5)) + 'px';

    // Blinking ink caret directly on napkin
    if (caretVisible) {
      ctx.save();
      ctx.strokeStyle = col; ctx.globalAlpha = 0.78; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy - chH * 0.5); ctx.lineTo(cx, cy + chH * 0.5); ctx.stroke();
      ctx.restore();
    }
  }

  // Selection box + 4 corner resize handles (in Select/Move mode)
  if (tool === 'move' && hoverItem && hoverItem !== selectedItem && !dragItem && !resizeState) {
    ctx.save();
    ctx.strokeStyle = 'rgba(35, 32, 28, 0.25)'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.strokeRect(hoverItem.x - 5, hoverItem.y - 5, hoverItem.w + 10, hoverItem.h + 10);
    ctx.restore();
  }
  if (selectedItem && items.includes(selectedItem)) {
    ctx.save();
    ctx.strokeStyle = 'rgba(35, 32, 28, 0.58)'; ctx.lineWidth = 1.1; ctx.setLineDash([4, 3]);
    ctx.strokeRect(selectedItem.x - 5, selectedItem.y - 5, selectedItem.w + 10, selectedItem.h + 10);
    ctx.setLineDash([]);
    for (const h of getResizeHandles(selectedItem)) {
      ctx.fillStyle = '#f8f3ea';
      ctx.strokeStyle = '#23201c';
      ctx.lineWidth = 1.4;
      ctx.fillRect(h.x - 3.5, h.y - 3.5, 7, 7);
      ctx.strokeRect(h.x - 3.5, h.y - 3.5, 7, 7);
    }
    ctx.restore();
  }

  for (const ps of pendingStrokes) drawRawPreview(ctx, ps, currentColor);
  if (activeRaw) drawRawPreview(ctx, activeRaw, currentColor);

  if (dragShape && dragShape.cur) {
    const x1 = dragShape.x, y1 = dragShape.y, x2 = dragShape.cur.x, y2 = dragShape.cur.y;
    const dist = Math.hypot(x2 - x1, y2 - y1);
    if (dist >= 4) {
      const key = `${Math.round(x2 * 2)},${Math.round(y2 * 2)}`;
      if (dragShape.cacheKey !== key || !dragShape.previewStrokes) {
        dragShape.cacheKey = key;
        if (dragShape.tool === 'arrow') {
          dragShape.previewStrokes = buildArrowItem(x1, y1, x2, y2, dragShape.color, dragShape.penId, dragShape.seed).strokes;
        } else {
          const x = Math.min(x1, x2), y = Math.min(y1, y2);
          const w = Math.max(4, Math.abs(x2 - x1)), h = Math.max(4, Math.abs(y2 - y1));
          dragShape.previewStrokes = buildShapeStrokes(dragShape.tool, x, y, w, h, dragShape.color, dragShape.penId, dragShape.seed);
        }
      }
      for (const s of dragShape.previewStrokes) {
        drawPStroke(ctx, s.pts, s.baseW, s.color, s.alpha, s.penId);
      }
    }
  }

  if (!opts.skipCup) {
    NapkinCup.renderCupLayer();
  }
}

function stopCaretBlink() {
  if (caretTimer) { clearInterval(caretTimer); caretTimer = null; }
}

function openTextBox(x, y, shapeRef = null, existingTextItem = null) {
  flushPendingNow();
  stopCaretBlink();
  selectedItem = null;
  let textItem = existingTextItem;
  let wasNew = false;
  let snapshot = null;

  if (shapeRef) {
    snapshot = {
      text: shapeRef.label || '',
      strokes: shapeRef.textStrokes ? shapeRef.textStrokes.slice() : [],
      cache: shapeRef.wordCache ? shapeRef.wordCache.slice() : [],
      cacheStyle: shapeRef.wordCacheStyle
    };
  } else if (existingTextItem) {
    snapshot = {
      text: existingTextItem.text || '',
      strokes: existingTextItem.strokes ? existingTextItem.strokes.slice() : [],
      cache: existingTextItem.wordCache ? existingTextItem.wordCache.slice() : [],
      cacheStyle: existingTextItem.wordCacheStyle
    };
  } else {
    wasNew = true;
    textItem = {
      kind: 'text', text: '', styleKey: currentStyleKey, penId: currentPenId,
      anchorX: x, anchorY: y,
      x, y: y - 16, w: 20, h: 32,
      color: currentColor, strokes: [], wordCache: [], wordCacheStyle: currentStyleKey
    };
    items.push(textItem);
  }

  typingTarget = { x, y, shapeRef, textItem, wasNew, snapshot, openedAt: performance.now(), lastLen: 0 };

  // Keep #inline-text invisible at the napkin caret (only as a keyboard/IME focus proxy)
  const r = canvas.getBoundingClientRect();
  const anchorX = shapeRef ? (shapeRef.x + shapeRef.w / 2) : textItem.anchorX;
  const anchorY = shapeRef ? (shapeRef.y + shapeRef.h / 2) : textItem.anchorY;
  inlineInput.style.left = Math.max(4, Math.min(r.width - 8, anchorX)) + 'px';
  inlineInput.style.top = Math.max(4, Math.min(r.height - 30, anchorY - 14)) + 'px';
  inlineInput.style.display = 'block';
  inlineInput.value = shapeRef ? (shapeRef.label || '') : (textItem.text || '');
  typingTarget.lastLen = inlineInput.value.length;
  inlineInput.focus({ preventScroll: true });
  requestAnimationFrame(() => {
    if (!typingTarget) return;
    inlineInput.focus({ preventScroll: true });
    inlineInput.setSelectionRange(inlineInput.value.length, inlineInput.value.length);
  });

  caretVisible = true;
  caretTimer = setInterval(() => { caretVisible = !caretVisible; scheduleRender(); }, 530);
  scheduleRender();
}

function onLiveTextInput() {
  if (!typingTarget) return;
  caretVisible = true;
  const val = inlineInput.value;
  if (val.length > typingTarget.lastLen && val.trim().length > 0) {
    NapkinAudio.triggerTypingPulse();
  }
  typingTarget.lastLen = val.length;
  if (typingTarget.shapeRef) {
    const it = typingTarget.shapeRef;
    it.label = val;
    it.styleKey = currentStyleKey;
    const maxW = it.shapeType === 'diamond' ? it.w * 0.62 : it.w * 0.84;
    const targetH = Math.min(30, Math.max(18, it.h * 0.48));
    synthesizeCursiveStreaming(val, it.x + it.w / 2, it.y + it.h / 2, targetH, maxW, it.color, it, null, currentStyleKey, 'center');
  } else if (typingTarget.textItem) {
    const ti = typingTarget.textItem;
    ti.text = val;
    ti.styleKey = currentStyleKey;
    synthesizeCursiveStreaming(val, ti.anchorX, ti.anchorY, 32, 640, ti.color, null, ti, currentStyleKey, 'left');
  }
  scheduleRender();
}

function commitTextBox() {
  if (!typingTarget) return;
  const tgt = typingTarget;
  typingTarget = null;
  stopCaretBlink();
  const val = inlineInput.value.trim();
  inlineInput.blur();
  inlineInput.style.display = 'none';

  if (!val) {
    if (tgt.shapeRef) { tgt.shapeRef.label = ''; tgt.shapeRef.textStrokes = []; tgt.shapeRef.wordCache = []; }
    else if (tgt.textItem) { const idx = items.indexOf(tgt.textItem); if (idx !== -1) items.splice(idx, 1); }
  } else if (tgt.shapeRef) { tgt.shapeRef.label = val; NapkinCup.onActivity('text'); }
  else if (tgt.textItem) { tgt.textItem.text = val; NapkinCup.onActivity('text'); }
  scheduleRender();
}

function cancelTextBox() {
  if (!typingTarget) return;
  const tgt = typingTarget;
  typingTarget = null;
  stopCaretBlink();
  inlineInput.blur();
  inlineInput.style.display = 'none';

  if (tgt.wasNew && tgt.textItem) {
    tgt.textItem.latestReqId = ++reqCounter;
    const idx = items.indexOf(tgt.textItem);
    if (idx !== -1) items.splice(idx, 1);
  } else if (tgt.snapshot) {
    const owner = tgt.shapeRef || tgt.textItem;
    owner.latestReqId = ++reqCounter;
    if (tgt.shapeRef) { tgt.shapeRef.label = tgt.snapshot.text; tgt.shapeRef.textStrokes = tgt.snapshot.strokes; }
    else if (tgt.textItem) { tgt.textItem.text = tgt.snapshot.text; tgt.textItem.strokes = tgt.snapshot.strokes; }
    owner.wordCache = tgt.snapshot.cache;
    owner.wordCacheStyle = tgt.snapshot.cacheStyle;
  }
  scheduleRender();
}

function isPointInsideTypingTarget(x, y) {
  if (!typingTarget) return false;
  if (typingTarget.shapeRef) {
    const sh = typingTarget.shapeRef;
    return x >= sh.x - 6 && x <= sh.x + sh.w + 6 && y >= sh.y - 6 && y <= sh.y + sh.h + 6;
  }
  if (typingTarget.textItem) {
    const ti = typingTarget.textItem;
    const w = Math.max(120, ti.w + 24);
    return x >= ti.anchorX - 8 && x <= ti.anchorX + w && y >= ti.anchorY - 22 && y <= ti.anchorY + 22;
  }
  return false;
}

inlineInput.addEventListener('input', onLiveTextInput);
inlineInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); commitTextBox(); return; }
  if (e.key === 'Escape') { e.preventDefault(); cancelTextBox(); return; }
  caretVisible = true;
  scheduleRender();
});
inlineInput.addEventListener('keyup', () => { if (typingTarget) { caretVisible = true; scheduleRender(); } });
inlineInput.addEventListener('select', () => { if (typingTarget) scheduleRender(); });
inlineInput.addEventListener('blur', () => {
  if (typingTarget && (performance.now() - typingTarget.openedAt) < 160) {
    inlineInput.focus({ preventScroll: true });
    return;
  }
  commitTextBox();
});

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function hitItem(x, y) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (x >= it.x - 8 && x <= it.x + it.w + 8 && y >= it.y - 8 && y <= it.y + it.h + 8) return it;
  }
  return null;
}

canvas.addEventListener('pointerdown', e => {
  const p = getPos(e);

  if (typingTarget) {
    // Clicking inside the active napkin text area keeps typing focus there
    if (isPointInsideTypingTarget(p.x, p.y)) {
      e.preventDefault();
      inlineInput.focus({ preventScroll: true });
      caretVisible = true;
      scheduleRender();
      return;
    }
    commitTextBox();
    // In Text tool, clicking another spot seamlessly starts typing there
    if (tool !== 'text') return;
  }

  if (tool === 'text') {
    e.preventDefault();
    const hit = hitItem(p.x, p.y);
    if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
    else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
    else openTextBox(p.x, p.y, null, null);
    return;
  }

  canvas.setPointerCapture(e.pointerId);

  if (tool === 'move') {
    // 1. Check resize handles on currently selected item FIRST!
    if (selectedItem) {
      const h = hitResizeHandle(selectedItem, p.x, p.y);
      if (h) {
        resizeState = { item: selectedItem, handle: h.id, snap: snapshotItemGeometry(selectedItem) };
        canvas.style.cursor = h.cursor;
        scheduleRender();
        return;
      }
    }
    // 2. Hit-test objects to select / drag
    const hit = hitItem(p.x, p.y);
    selectedItem = hit;
    if (hit) {
      dragItem = hit;
      dragOff = [p.x, p.y];
      dragMoved = false;
      canvas.style.cursor = 'grabbing';
    }
    scheduleRender();
    return;
  }

  if (tool === 'box' || tool === 'oval' || tool === 'diamond' || tool === 'arrow') {
    flushPendingNow();
    dragShape = {
      tool,
      x: p.x, y: p.y, cur: p,
      color: currentColor,
      penId: currentPenId,
      seed: (Math.floor(Math.random() * 0xffffffff) ^ (Date.now() & 0xffffffff)) >>> 0,
      cacheKey: '',
      previewStrokes: null
    };
    NapkinAudio.startDraw(p.x, p.y);
    scheduleRender();
    return;
  }

  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  pendingMode = tool;
  activeRaw = [p];
  NapkinAudio.startDraw(p.x, p.y);
  scheduleRender();
});

canvas.addEventListener('pointermove', e => {
  const p = getPos(e);

  if (resizeState) {
    const { item, handle, snap } = resizeState;
    const minW = 28, minH = 22;
    let x = snap.x, y = snap.y, w = snap.w, h = snap.h;
    const right = snap.x + snap.w, bottom = snap.y + snap.h;
    if (handle.includes('e')) w = Math.max(minW, p.x - snap.x);
    if (handle.includes('s')) h = Math.max(minH, p.y - snap.y);
    if (handle.includes('w')) { x = Math.min(right - minW, p.x); w = right - x; }
    if (handle.includes('n')) { y = Math.min(bottom - minH, p.y); h = bottom - y; }
    applyLiveResize(item, snap, x, y, w, h);
    scheduleRender();
    return;
  }

  if (dragItem) {
    const dx = p.x - dragOff[0], dy = p.y - dragOff[1];
    if (Math.hypot(dx, dy) > 1.5) dragMoved = true;
    dragOff = [p.x, p.y];
    dragItem.x += dx; dragItem.y += dy;
    if (dragItem.anchorX !== undefined) { dragItem.anchorX += dx; dragItem.anchorY += dy; }
    if (dragItem.x1 !== undefined) { dragItem.x1 += dx; dragItem.y1 += dy; dragItem.x2 += dx; dragItem.y2 += dy; }
    const shift = s => { for (const pt of s.pts) { pt[0] += dx; pt[1] += dy; } };
    dragItem.strokes.forEach(shift);
    if (dragItem.textStrokes) dragItem.textStrokes.forEach(shift);
    if (dragItem.rawList) for (const r of dragItem.rawList) for (const pt of r) { pt.x += dx; pt.y += dy; }
    scheduleRender();
    return;
  }

  if (tool === 'move') {
    const rh = hitResizeHandle(selectedItem, p.x, p.y);
    if (rh) { canvas.style.cursor = rh.cursor; return; }
    const h = hitItem(p.x, p.y);
    canvas.style.cursor = h ? 'grab' : 'default';
    if (h !== hoverItem) { hoverItem = h; scheduleRender(); }
    return;
  }

  if (dragShape) {
    dragShape.cur = p;
    NapkinAudio.updateDraw(p.x, p.y);
    scheduleRender();
    return;
  }
  if (activeRaw) {
    activeRaw.push(p);
    NapkinAudio.updateDraw(p.x, p.y);
    scheduleRender();
  }
});

canvas.addEventListener('pointerup', e => {
  const p = getPos(e);
  NapkinAudio.stopDraw();

  if (resizeState) {
    const it = resizeState.item;
    resizeState = null;
    finalizeResize(it);
    canvas.style.cursor = 'default';
    scheduleRender();
    return;
  }

  if (dragItem) {
    dragItem = null;
    canvas.style.cursor = 'grab';
    scheduleRender();
    return;
  }

  if (dragShape && dragShape.cur) {
    const ds = dragShape;
    const x1 = ds.x, y1 = ds.y, x2 = ds.cur.x, y2 = ds.cur.y;
    dragShape = null;
    const dist = Math.hypot(x2 - x1, y2 - y1);
    if (dist < 5) {
      const hit = hitItem(p.x, p.y);
      if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
      else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
      else openTextBox(p.x, p.y, null, null);
    } else if (ds.tool === 'arrow' && dist > 16) {
      items.push(buildArrowItem(x1, y1, x2, y2, ds.color, ds.penId, ds.seed));
      NapkinCup.onActivity('arrow');
    } else if (Math.abs(x2 - x1) > 18 && Math.abs(y2 - y1) > 14) {
      items.push(buildShapeItem(ds.tool, Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1), '', ds.color, ds.penId, ds.seed));
      NapkinCup.onActivity('shape');
    }
    scheduleRender();
    return;
  }

  if (activeRaw) {
    const pts = activeRaw;
    activeRaw = null;
    let arc = 0;
    for (let i = 1; i < pts.length; i++) arc += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);

    if (pendingMode === 'sketch' && !pendingStrokes.length && arc < 5) {
      pendingMode = null;
      const hit = hitItem(p.x, p.y);
      if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
      else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
      else openTextBox(p.x, p.y, null, null);
      scheduleRender();
      return;
    }

    if (pts.length >= 2 || pendingMode === 'handwrite') {
      pendingStrokes.push(pts.length >= 2 ? pts : [pts[0], { x: pts[0].x + 0.8, y: pts[0].y + 0.8 }]);
      pendingTimer = setTimeout(flushPendingNow, DEFAULTS.debounceMs);
    }
    scheduleRender();
  }
});

canvas.addEventListener('pointercancel', () => { NapkinAudio.stopDraw(); activeRaw = null; dragShape = null; });
canvas.addEventListener('lostpointercapture', () => { NapkinAudio.stopDraw(); });

// Double-click in Select mode edits a shape's label or text object
canvas.addEventListener('dblclick', e => {
  if (tool !== 'move') return;
  const p = getPos(e), hit = hitItem(p.x, p.y);
  if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
  else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
});

// Keyboard shortcuts: Backspace/Delete deletes selected item; tool hotkeys; Ctrl/Cmd+Z undo
window.addEventListener('keydown', e => {
  if (typingTarget) return;
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if ((e.key === 'Backspace' || e.key === 'Delete') && selectedItem) {
    e.preventDefault();
    const idx = items.indexOf(selectedItem);
    if (idx !== -1) items.splice(idx, 1);
    selectedItem = null;
    hoverItem = null;
    scheduleRender();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  const k = e.key.toLowerCase();
  if (k === 's') setTool('sketch');
  else if (k === 'h') setTool('handwrite');
  else if (k === 't') setTool('text');
  else if (k === 'b') setTool('box');
  else if (k === 'o') setTool('oval');
  else if (k === 'd') setTool('diamond');
  else if (k === 'a') setTool('arrow');
  else if (k === 'v' || k === 'm') setTool('move');
});

function undo() {
  if (pendingStrokes.length) {
    pendingStrokes.pop();
    if (!pendingStrokes.length && pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  } else {
    const removed = items.pop();
    if (removed === selectedItem) selectedItem = null;
  }
  NapkinCup.onUndo();
  scheduleRender();
}

function toggleSaveMenu(e, forceState) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('save-menu');
  const btn = document.getElementById('save-btn');
  if (!menu) return;
  const open = typeof forceState === 'boolean' ? forceState : !menu.classList.contains('open');
  menu.classList.toggle('open', open);
  if (btn) btn.classList.toggle('active', open);
}

window.addEventListener('pointerdown', e => {
  const menu = document.getElementById('save-menu');
  if (menu && menu.classList.contains('open') && !e.target.closest('.save-wrap')) {
    toggleSaveMenu(null, false);
  }
});

function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (url.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function getCleanExportBg(w, h, scale = 2) {
  if (!napkinSpec) nextNapkin();
  const bg = buildNapkinSheetCanvas(napkinSpec, w, h, scale);
  const bctx = bg.getContext('2d');
  bctx.setTransform(scale, 0, 0, scale, 0, 0);
  NapkinCup.renderStainsTo(bctx, performance.now() + 5000);
  return bg;
}

function exportPNG() {
  toggleSaveMenu(null, false);
  if (typingTarget) commitTextBox();
  flushPendingNow();
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  const scale = 2;

  // Render clean 2x HiDPI composite (textured napkin background + ink strokes, no UI carets/handles)
  const out = document.createElement('canvas');
  out.width = w * scale;
  out.height = h * scale;
  const octx = out.getContext('2d');
  const bg = getCleanExportBg(w, h, scale);
  octx.drawImage(bg, 0, 0);

  octx.setTransform(scale, 0, 0, scale, 0, 0);
  for (const it of items) {
    for (const s of it.strokes) drawPStroke(octx, s.pts, s.baseW, s.color, s.alpha, s.penId || it.penId || 'ballpoint');
    if (it.textStrokes) for (const s of it.textStrokes) drawPStroke(octx, s.pts, s.baseW, s.color, s.alpha, s.penId || it.penId || 'ballpoint');
  }

  if (out.toBlob) {
    out.toBlob(blob => {
      if (blob) triggerDownload(URL.createObjectURL(blob), 'napkin-sketch.png');
    }, 'image/png');
  } else {
    triggerDownload(out.toDataURL('image/png'), 'napkin-sketch.png');
  }
}

function exportSVG() {
  toggleSaveMenu(null, false);
  if (typingTarget) commitTextBox();
  flushPendingNow();
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  const bgHex = napkinSpec ? napkinSpec.baseHex : '#e7dbc6';

  // Embed full textured napkin sheet (embossing, fibers, creases, border, vignette) inside the SVG!
  const bgCanvas = getCleanExportBg(w, h, 2);
  const bgDataUrl = bgCanvas.toDataURL('image/jpeg', 0.93);

  const inkLines = [];
  const emit = (s, fallbackPen) => {
    const pid = s.penId || fallbackPen || 'ballpoint';
    const outline = buildStrokeOutline(s.pts, s.baseW, pid);
    if (!outline) return;
    const op = strokeAlphaForPen(pid, s.alpha).toFixed(2);
    if (outline.dot) {
      inkLines.push(`<circle cx="${outline.x.toFixed(1)}" cy="${outline.y.toFixed(1)}" r="${outline.r.toFixed(2)}" fill="${s.color}" fill-opacity="${op}"/>`);
    } else {
      const d = 'M' + outline.poly.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('L') + 'Z';
      inkLines.push(`<path d="${d}" fill="${s.color}" fill-opacity="${op}" fill-rule="nonzero"/>`);
    }
  };
  for (const it of items) { it.strokes.forEach(s => emit(s, it.penId)); if (it.textStrokes) it.textStrokes.forEach(s => emit(s, it.penId)); }

  const svg = [
    `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`,
    `<rect width="${w}" height="${h}" fill="${bgHex}"/>`,
    `<image width="${w}" height="${h}" xlink:href="${bgDataUrl}" preserveAspectRatio="none"/>`,
    `<g style="mix-blend-mode:multiply">${inkLines.join('')}</g>`,
    `</svg>`
  ].join('');

  triggerDownload(URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' })), 'napkin-sketch.svg');
}

function pickStarterDiagram() {
  let lastIdx = -1;
  try {
    const raw = sessionStorage.getItem('napkin_starter_idx');
    if (raw !== null) lastIdx = parseInt(raw, 10);
  } catch (_) {}
  let idx = Math.floor(Math.random() * STARTER_DIAGRAMS.length);
  if (STARTER_DIAGRAMS.length > 1 && idx === lastIdx) {
    idx = (idx + 1 + Math.floor(Math.random() * (STARTER_DIAGRAMS.length - 1))) % STARTER_DIAGRAMS.length;
  }
  try { sessionStorage.setItem('napkin_starter_idx', String(idx)); } catch (_) {}
  return STARTER_DIAGRAMS[idx];
}

async function loadStarterScene(forcedIdx = null) {
  const r = canvas.getBoundingClientRect();
  const diagram = (forcedIdx != null && STARTER_DIAGRAMS[forcedIdx])
    ? STARTER_DIAGRAMS[forcedIdx]
    : pickStarterDiagram();

  // Center comfortably (slightly left of the top-right mug zone)
  const ox = Math.max(36, Math.min(r.width - diagram.w - 36, (r.width - diagram.w) * 0.44));
  const oy = Math.max(32, Math.min(r.height - diagram.h - 32, (r.height - diagram.h) * 0.46));

  items = [];
  const synthJobs = [];
  const api = {
    shape(type, x, y, w, h, label, color = '#1d3557') {
      const sh = buildShapeItem(type, x, y, w, h, label, color, currentPenId);
      items.push(sh);
      if (label) {
        const th = type === 'diamond' ? 25 : 27;
        const maxW = type === 'diamond' ? w * 0.62 : w * 0.84;
        synthJobs.push(() => synthesizeCursiveStreaming(label, sh.x + sh.w / 2, sh.y + sh.h / 2, th, maxW, sh.color, sh, null));
      }
      return sh;
    },
    arrow(x1, y1, x2, y2, color = '#1d3557') {
      const ar = buildArrowItem(x1, y1, x2, y2, color, currentPenId);
      items.push(ar);
      return ar;
    },
    note(cx, cy, text, targetH = 23, maxW = 200, color = '#1d3557') {
      const ti = {
        kind: 'text', text, styleKey: currentStyleKey, penId: currentPenId,
        anchorX: cx, anchorY: cy,
        x: cx - maxW * 0.4, y: cy - targetH * 0.6, w: maxW * 0.8, h: targetH * 1.2,
        color, strokes: [], wordCache: [], wordCacheStyle: currentStyleKey
      };
      items.push(ti);
      synthJobs.push(() => synthesizeCursiveStreaming(text, cx, cy, targetH, maxW, color, null, ti, currentStyleKey, 'center'));
      return ti;
    }
  };

  diagram.build(ox, oy, api);
  scheduleRender();
  await Promise.all(synthJobs.map(fn => fn()));
  return diagram.name;
}
