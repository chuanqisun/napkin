const DEFAULT_DRAW_PRESET = {
  id: 'ballpoint',
  bodyFMin: 720, bodyFMax: 2150, bodyQ: 1.35, bodyGain: 0.24,
  grainFMin: 1550, grainFMax: 3900, grainQ: 2.2, grainGain: 0.44, rateMin: 0.55, rateMax: 1.95,
  tipType: 'bandpass', tipFMin: 3100, tipFMax: 6500, tipQ: 2.7, tipGain: 0.22,
  tapFreq: 1450, tapDur: 0.014, tapGain: 0.16, curveBoost: 0.38, velScale: 1.0
};

const NapkinAudio = (() => {
  const DRAW_VOL = 0.75;
  const SPEED_SENS = 0.75;
  const CRUMPLE_VOL = 0.85;
  let muted = false;

  let actx = null;
  let masterGain = null;
  let compressor = null;
  let buffers = null;
  let voice = null;

  // ./crumble.mp3 preloading + decoded Web Audio buffer + HTMLAudio fallback
  let crumbleRawBytes = null;
  let crumbleFetchPromise = null;
  let crumbleBuffer = null;
  let crumbleDecodePromise = null;
  let activeCrumpleSource = null;
  let fallbackCrumpleEl = null;

  // Live drawing velocity tracking
  let isDrawing = false;
  let lastX = 0, lastY = 0, lastT = 0, lastAng = null;
  let smoothedSpeed = 0;
  let smoothedCurve = 0;
  let decayRaf = null;

  // Typing cadence tracking
  let lastTypeTime = 0;
  let typingPulseTimer = null;

  function preloadCrumple() {
    if (crumbleFetchPromise) return crumbleFetchPromise;
    try {
      fallbackCrumpleEl = new Audio('./crumble.mp3');
      fallbackCrumpleEl.preload = 'auto';
    } catch (_) {}
    crumbleFetchPromise = fetch('./crumble.mp3')
      .then(res => res.ok ? res.arrayBuffer() : null)
      .then(buf => {
        crumbleRawBytes = buf;
        if (actx && buf && !crumbleBuffer) decodeCrumple();
        return buf;
      })
      .catch(() => null);
    return crumbleFetchPromise;
  }

  function decodeCrumple() {
    if (crumbleBuffer) return Promise.resolve(crumbleBuffer);
    if (crumbleDecodePromise) return crumbleDecodePromise;
    if (!actx || !crumbleRawBytes) return Promise.resolve(null);
    crumbleDecodePromise = actx.decodeAudioData(crumbleRawBytes.slice(0))
      .then(decoded => { crumbleBuffer = decoded; return decoded; })
      .catch(() => { crumbleDecodePromise = null; return null; });
    return crumbleDecodePromise;
  }

  function buildTextureBuffers(ctx) {
    const sr = ctx.sampleRate;
    const len = Math.floor(sr * 3.0);

    // 1. Pink (1/f) paper-body noise (Voss-McCartney 7-stage)
    const pink = ctx.createBuffer(1, len, sr);
    const pd = pink.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      pd[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }

    // 2. Fibrous embossed napkin grain buffer
    const grain = ctx.createBuffer(1, len, sr);
    const gd = grain.getChannelData(0);
    let env = 0.5, imp = 0;
    for (let i = 0; i < len; i++) {
      const emboss = 0.65 + 0.35 * Math.sin(i * 0.0038 + Math.sin(i * 0.00043) * 2.5);
      env += (Math.random() - 0.5) * 0.03;
      env = Math.max(0.25, Math.min(1.0, env));
      if (Math.random() < 0.018) imp += (Math.random() * 2 - 1) * 1.35;
      imp *= 0.84;
      const micro = (Math.random() * 2 - 1) * 0.35;
      gd[i] = Math.max(-1, Math.min(1, (imp + micro) * env * emboss));
    }

    // 3. Fine crisp tip-scratch noise
    const crisp = ctx.createBuffer(1, len, sr);
    const cd = crisp.getChannelData(0);
    let prev = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      const hp = (w - prev) * 0.52;
      prev = w;
      const sparkle = Math.random() < 0.006 ? (Math.random() * 2 - 1) * 0.9 : 0;
      cd[i] = Math.max(-1, Math.min(1, hp + sparkle));
    }

    const fadeN = Math.floor(sr * 0.01);
    for (const arr of [pd, gd, cd]) {
      for (let i = 0; i < fadeN; i++) {
        const k = i / fadeN;
        arr[len - fadeN + i] = arr[len - fadeN + i] * (1 - k) + arr[i] * k;
      }
    }
    return { pink, grain, crisp };
  }

  function ensureContext() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      compressor = actx.createDynamicsCompressor();
      compressor.threshold.value = -10;
      compressor.knee.value = 18;
      compressor.ratio.value = 4;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.12;

      masterGain = actx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(compressor);
      compressor.connect(actx.destination);

      buffers = buildTextureBuffers(actx);
      if (crumbleRawBytes && !crumbleBuffer) decodeCrumple();
    }
    if (actx.state === 'suspended') {
      actx.resume().catch(() => {});
    }
    return actx;
  }

  function ensureVoice() {
    const ctx = ensureContext();
    if (!ctx || !buffers) return null;
    if (voice) return voice;

    const p = DEFAULT_DRAW_PRESET;
    const outGain = ctx.createGain();
    outGain.gain.value = 0;
    outGain.connect(masterGain);

    const makeLoop = (buf) => {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      src.start(0, Math.random() * 2.5);
      return src;
    };

    const bodySrc = makeLoop(buffers.pink);
    const bodyFlt = ctx.createBiquadFilter();
    bodyFlt.type = 'bandpass'; bodyFlt.Q.value = p.bodyQ;
    const bodyGain = ctx.createGain();
    bodyGain.gain.value = p.bodyGain;
    bodySrc.connect(bodyFlt); bodyFlt.connect(bodyGain); bodyGain.connect(outGain);

    const grainSrc = makeLoop(buffers.grain);
    const grainFlt = ctx.createBiquadFilter();
    grainFlt.type = 'bandpass'; grainFlt.Q.value = p.grainQ;
    const grainGain = ctx.createGain();
    grainGain.gain.value = p.grainGain;
    grainSrc.connect(grainFlt); grainFlt.connect(grainGain); grainGain.connect(outGain);

    const tipSrc = makeLoop(buffers.crisp);
    const tipFlt = ctx.createBiquadFilter();
    tipFlt.type = p.tipType; tipFlt.Q.value = p.tipQ;
    const tipGain = ctx.createGain();
    tipGain.gain.value = p.tipGain;
    tipSrc.connect(tipFlt); tipFlt.connect(tipGain); tipGain.connect(outGain);

    voice = { outGain, bodySrc, bodyFlt, bodyGain, grainSrc, grainFlt, grainGain, tipSrc, tipFlt, tipGain };
    return voice;
  }

  function playPenTap(strength = 1.0) {
    if (muted) return;
    const ctx = ensureContext();
    if (!ctx || !buffers) return;
    const p = DEFAULT_DRAW_PRESET;
    const now = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = buffers.crisp;
    const flt = ctx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = p.tapFreq * (0.9 + Math.random() * 0.2);
    flt.Q.value = 2.4;
    const g = ctx.createGain();
    const peak = p.tapGain * DRAW_VOL * strength * 0.65;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(peak, now + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, now + p.tapDur);
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start(now, Math.random() * 2.0, p.tapDur + 0.01);
  }

  function applySpeedToVoice(speedPxPerSec, curveAccent = 0) {
    if (muted) {
      if (voice && actx) voice.outGain.gain.setTargetAtTime(0, actx.currentTime, 0.02);
      return;
    }
    const v = ensureVoice();
    if (!v || !actx) return;
    const p = DEFAULT_DRAW_PRESET;
    const now = actx.currentTime;

    if (speedPxPerSec < 10) {
      v.outGain.gain.setTargetAtTime(0, now, 0.026);
      return;
    }

    const rawU = Math.max(0, Math.min(1, (speedPxPerSec - 10) / 1300));
    const pitchU = Math.pow(rawU, 0.72) * (0.28 + 0.72 * SPEED_SENS);
    const gainU = Math.pow(rawU, 0.45 + 0.48 * SPEED_SENS);
    const logLerp = (a, b, t) => a * Math.pow(b / a, Math.max(0, Math.min(1.15, t)));

    v.bodyFlt.frequency.setTargetAtTime(logLerp(p.bodyFMin, p.bodyFMax, pitchU), now, 0.018);
    v.grainFlt.frequency.setTargetAtTime(logLerp(p.grainFMin, p.grainFMax, pitchU), now, 0.016);
    v.tipFlt.frequency.setTargetAtTime(logLerp(p.tipFMin, p.tipFMax, pitchU), now, 0.016);

    const gRate = p.rateMin + (p.rateMax - p.rateMin) * Math.pow(rawU, 0.78);
    v.grainSrc.playbackRate.setTargetAtTime(Math.max(0.25, Math.min(3.2, gRate)), now, 0.02);
    v.tipSrc.playbackRate.setTargetAtTime(0.75 + rawU * 0.85, now, 0.025);

    v.grainGain.gain.setTargetAtTime(p.grainGain * (1 + curveAccent * p.curveBoost), now, 0.015);

    const targetGain = (0.07 + 0.68 * gainU) * DRAW_VOL * p.velScale;
    v.outGain.gain.setTargetAtTime(Math.min(1.15, targetGain), now, 0.014);
  }

  function tickDecay() {
    if (!isDrawing) { decayRaf = null; return; }
    const idleMs = performance.now() - lastT;
    if (idleMs > 28 && smoothedSpeed > 0) {
      smoothedSpeed *= Math.pow(0.74, Math.min(8, idleMs / 16));
      smoothedCurve *= 0.7;
      if (smoothedSpeed < 8) smoothedSpeed = 0;
      applySpeedToVoice(smoothedSpeed, smoothedCurve);
    }
    decayRaf = requestAnimationFrame(tickDecay);
  }

  function startDraw(x, y) {
    ensureContext();
    isDrawing = true;
    lastX = x; lastY = y; lastT = performance.now(); lastAng = null;
    smoothedSpeed = 0; smoothedCurve = 0;
    playPenTap(1.0);
    if (!decayRaf) decayRaf = requestAnimationFrame(tickDecay);
  }

  function updateDraw(x, y) {
    if (!isDrawing) return;
    const now = performance.now();
    const dt = Math.max(4, now - lastT);
    const dx = x - lastX, dy = y - lastY;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.45) return;

    const instSpeed = Math.min(2600, (dist / dt) * 1000);
    const ang = Math.atan2(dy, dx);
    let curve = 0;
    if (lastAng !== null && dist > 1.5) {
      const dAng = Math.abs(Math.atan2(Math.sin(ang - lastAng), Math.cos(ang - lastAng)));
      curve = Math.min(1, dAng * 1.25);
    }
    const alpha = instSpeed > smoothedSpeed ? 0.46 : 0.28;
    smoothedSpeed = smoothedSpeed * (1 - alpha) + instSpeed * alpha;
    smoothedCurve = smoothedCurve * 0.65 + curve * 0.35;

    lastX = x; lastY = y; lastT = now; lastAng = ang;
    applySpeedToVoice(smoothedSpeed, smoothedCurve);
  }

  function stopDraw() {
    if (!isDrawing) return;
    isDrawing = false;
    smoothedSpeed = 0;
    smoothedCurve = 0;
    if (decayRaf) { cancelAnimationFrame(decayRaf); decayRaf = null; }
    applySpeedToVoice(0, 0);
  }

  function triggerTypingPulse() {
    if (muted || isDrawing) return;
    const now = performance.now();
    const dt = Math.max(45, Math.min(600, now - lastTypeTime));
    lastTypeTime = now;
    const speed = Math.max(240, Math.min(960, 145000 / dt));
    const durMs = Math.max(58, Math.min(115, dt * 0.45));
    ensureVoice();
    playPenTap(0.55);
    applySpeedToVoice(speed, 0.35);
    if (typingPulseTimer) clearTimeout(typingPulseTimer);
    typingPulseTimer = setTimeout(() => {
      typingPulseTimer = null;
      if (!isDrawing) applySpeedToVoice(0, 0);
    }, durMs);
  }

  async function prepareCrumple() {
    if (muted) return;
    ensureContext();
    if (!crumbleRawBytes) await preloadCrumple();
    if (actx && crumbleRawBytes && !crumbleBuffer) await decodeCrumple();
    if (actx && actx.state === 'suspended') {
      try { await actx.resume(); } catch (_) {}
    }
  }

  function stopCrumple() {
    if (activeCrumpleSource) {
      try { activeCrumpleSource.stop(); } catch (_) {}
      activeCrumpleSource = null;
    }
    if (fallbackCrumpleEl) {
      try { fallbackCrumpleEl.pause(); fallbackCrumpleEl.currentTime = 0; } catch (_) {}
    }
  }

  function playCrumple() {
    stopCrumple();
    if (muted) return;
    const ctx = ensureContext();
    if (ctx && crumbleBuffer) {
      const src = ctx.createBufferSource();
      src.buffer = crumbleBuffer;
      const g = ctx.createGain();
      g.gain.value = CRUMPLE_VOL * 3.4;
      src.connect(g);
      g.connect(masterGain);
      src.onended = () => { if (activeCrumpleSource === src) activeCrumpleSource = null; };
      activeCrumpleSource = src;
      src.start(ctx.currentTime);
      return;
    }
    if (fallbackCrumpleEl) {
      fallbackCrumpleEl.currentTime = 0;
      fallbackCrumpleEl.volume = CRUMPLE_VOL;
      fallbackCrumpleEl.play().catch(() => {});
    }
  }

  function syncUI() {
    const tog = document.getElementById('sound-toggle');
    if (!tog) return;
    tog.classList.toggle('muted', muted);
    tog.setAttribute('aria-pressed', muted ? 'false' : 'true');
    tog.title = muted ? 'Sound Off (click to unmute)' : 'Sound On (click to mute)';
    const lbl = tog.querySelector('.lbl');
    if (lbl) lbl.textContent = muted ? 'Sound Off' : 'Sound On';
  }

  function toggleMute() {
    muted = !muted;
    if (masterGain && actx) {
      masterGain.gain.setTargetAtTime(muted ? 0 : 1, actx.currentTime, 0.015);
    }
    if (muted) stopCrumple();
    syncUI();
  }

  function initUI() {
    const unlockOnce = () => {
      ensureContext();
      if (crumbleRawBytes && !crumbleBuffer) decodeCrumple();
    };
    window.addEventListener('pointerdown', unlockOnce, { once: true, passive: true });
    window.addEventListener('keydown', unlockOnce, { once: true, passive: true });

    preloadCrumple();
    syncUI();
  }

  return {
    initUI,
    startDraw,
    updateDraw,
    stopDraw,
    triggerTypingPulse,
    prepareCrumple,
    playCrumple,
    stopCrumple,
    toggleMute,
    getState: () => ({ muted, presetId: DEFAULT_DRAW_PRESET.id, hasCrumpleBuffer: !!crumbleBuffer })
  };
})();

// ============================================================================
// 6. CRUMPLED NAPKIN BALL & THROW ANIMATION (SYNCED TO ./crumble.mp3)
// ============================================================================
let crumpleRaf = null;
let crumpleSeq = 0;

function drawTexturedTriangle(ctx, img, u0, v0, u1, v1, u2, v2, x0, y0, x1, y1, x2, y2, shade) {
  const denom = (u0 * (v1 - v2) + u1 * (v2 - v0) + u2 * (v0 - v1));
  if (Math.abs(denom) < 1e-3) return;

  // Slightly expand clip triangle by 0.75px from centroid to eliminate hairline seams
  const cx = (x0 + x1 + x2) / 3, cy = (y0 + y1 + y2) / 3;
  const ex = (x, y) => {
    const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) || 1;
    return [x + (dx / l) * 0.75, y + (dy / l) * 0.75];
  };
  const [px0, py0] = ex(x0, y0), [px1, py1] = ex(x1, y1), [px2, py2] = ex(x2, y2);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(px0, py0); ctx.lineTo(px1, py1); ctx.lineTo(px2, py2); ctx.closePath();
  ctx.clip();

  // Solve affine transform mapping (u,v) -> (x,y)
  const a = (x0 * (v1 - v2) + x1 * (v2 - v0) + x2 * (v0 - v1)) / denom;
  const b = (y0 * (v1 - v2) + y1 * (v2 - v0) + y2 * (v0 - v1)) / denom;
  const c = (x0 * (u2 - u1) + x1 * (u0 - u2) + x2 * (u1 - u0)) / denom;
  const d = (y0 * (u2 - u1) + y1 * (u0 - u2) + y2 * (u1 - u0)) / denom;
  const e = (x0 * (u1 * v2 - u2 * v1) + x1 * (u2 * v0 - u0 * v2) + x2 * (u0 * v1 - u1 * v0)) / denom;
  const f = (y0 * (u1 * v2 - u2 * v1) + y1 * (u2 * v0 - u0 * v2) + y2 * (u0 * v1 - u1 * v0)) / denom;

  ctx.transform(a, b, c, d, e, f);
  ctx.drawImage(img, 0, 0);
  ctx.restore();

  // 3D paper crease lighting overlay (warm umber shadows in folds, soft cream highlights on ridges)
  if (Math.abs(shade) > 0.01) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(px0, py0); ctx.lineTo(px1, py1); ctx.lineTo(px2, py2); ctx.closePath();
    ctx.fillStyle = shade > 0
      ? `rgba(255, 249, 238, ${Math.min(0.45, shade * 0.45).toFixed(3)})`
      : `rgba(74, 52, 28, ${Math.min(0.56, -shade * 0.56).toFixed(3)})`;
    ctx.fill();
    ctx.restore();
  }
}

// Smoothstep helper for choreographing crumple phases to ./crumble.mp3 envelope
function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / Math.max(1e-6, edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

async function clearAllWithCrumple() {
  const token = ++crumpleSeq;
  if (typingTarget) commitTextBox();
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  pendingStrokes = [];
  activeRaw = null;
  dragShape = null;
  dragItem = null;
  resizeState = null;
  selectedItem = null;
  hoverItem = null;
  NapkinAudio.stopDraw();

  // 1. Snapshot the current napkin (with OR without content!) before clearing
  render();
  const frameRect = document.getElementById('wrap').getBoundingClientRect();
  const snap = document.createElement('canvas');
  snap.width = Math.max(1, Math.round(frameRect.width));
  snap.height = Math.max(1, Math.round(frameRect.height));
  snap.getContext('2d').drawImage(canvas, 0, 0, snap.width, snap.height);

  // 2. Clear the live napkin & generate a brand-new unique napkin sheet underneath!
  items = [];
  nextNapkin();
  scheduleRender();

  // 3. Ensure ./crumble.mp3 AudioBuffer is decoded & ready for exact 0ms sync
  await NapkinAudio.prepareCrumple();
  if (token !== crumpleSeq) return;

  // 4. Prepare triangulated crumpled paper mesh (10 x 7 grid)
  if (crumpleRaf) { cancelAnimationFrame(crumpleRaf); crumpleRaf = null; }
  const overlay = document.getElementById('crumple-overlay');
  const dpr = window.devicePixelRatio || 1;
  overlay.width = Math.round(window.innerWidth * dpr);
  overlay.height = Math.round(window.innerHeight * dpr);
  overlay.style.display = 'block';
  const octx = overlay.getContext('2d');

  const cols = 10, rows = 7;
  const ballR = Math.min(56, Math.min(frameRect.width, frameRect.height) * 0.135);
  const centerX = frameRect.left + frameRect.width * 0.5;
  const centerY = frameRect.top + frameRect.height * 0.5;

  // Build vertices with organic crumpled-ball target positions & 3D z-depths
  const verts = [];
  for (let j = 0; j <= rows; j++) {
    for (let i = 0; i <= cols; i++) {
      const u = (i / cols) * snap.width;
      const v = (j / rows) * snap.height;
      const sx = frameRect.left + u;
      const sy = frameRect.top + v;
      const ang = Math.atan2(sy - centerY, sx - centerX) + (Math.random() - 0.5) * 0.85;
      const normDist = Math.hypot((i / cols) - 0.5, (j / rows) - 0.5) * 1.414;
      const foldR = ballR * (0.28 + 0.72 * Math.pow(normDist, 0.75) * (0.68 + Math.random() * 0.45));
      const bx = Math.cos(ang) * foldR + (Math.random() - 0.5) * ballR * 0.28;
      const by = Math.sin(ang) * foldR + (Math.random() - 0.5) * ballR * 0.28;
      const bz = (Math.random() - 0.45) * 2.1;
      const creaseDelay = Math.random() * 0.20;
      verts.push({ u, v, sx, sy, bx, by, bz, delay: creaseDelay * (1 - normDist * 0.42), jitterPhase: Math.random() * Math.PI * 2 });
    }
  }

  // Perimeter indices for crisp lifted-sheet drop shadow (makes blank kraft napkin pop!)
  const borderIdx = [];
  for (let i = 0; i <= cols; i++) borderIdx.push(i);
  for (let j = 1; j <= rows; j++) borderIdx.push(j * (cols + 1) + cols);
  for (let i = cols - 1; i >= 0; i--) borderIdx.push(rows * (cols + 1) + i);
  for (let j = rows - 1; j >= 1; j--) borderIdx.push(j * (cols + 1));

  const tris = [];
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const a = j * (cols + 1) + i;
      const b = a + 1;
      const c = a + (cols + 1);
      const d = c + 1;
      if ((i + j) % 2 === 0) { tris.push([a, b, d]); tris.push([a, d, c]); }
      else { tris.push([a, b, c]); tris.push([b, d, c]); }
    }
  }

  // Exact acoustic choreography matched to ./crumble.mp3 (1.000s):
  //   0..445ms: Squeeze 1 (initial sharp fold snap at 80ms peak, rolling folds at 225ms & 305ms)
  // 445..555ms: Brief grip-reset lull (matches quiet valley 450..550ms in crumble.mp3)
  // 555..940ms: Squeeze 2 (tight final crush hitting 725ms & 890ms peaks + throw wind-up)
  // 920..1420ms: Parabolic toss away right as the final 940ms crinkle concludes!
  const TOSS_START = 920;
  const TOTAL_DUR = 1420;

  // Fire ./crumble.mp3 and start clock on the exact same synchronous tick
  NapkinAudio.playCrumple();
  const tStart = performance.now();

  function step(now) {
    const ms = Math.max(0, now - tStart);
    const t = Math.min(1, ms / TOTAL_DUR);
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    // Two-squeeze crumple progress synced directly to ./crumble.mp3 peaks
    let cPhase = 0;
    if (ms < 445) {
      // Fast snap on 80ms crack peak, then rolling gather through 445ms
      const p1 = ms / 445;
      const snap = 1 - Math.pow(1 - p1, 2.35);
      cPhase = 0.72 * snap;
    } else if (ms < 555) {
      // Quiet regrip lull (445..555ms): subtle gentle settle
      cPhase = 0.72 + 0.025 * smoothstep(445, 555, ms);
    } else {
      // Second tight squeeze (555..940ms): finishes tight ball right as audio finishes
      cPhase = 0.745 + 0.255 * smoothstep(555, 935, ms);
    }

    // Secondary tight compaction + subtle twist during Squeeze 2 (555..940ms)
    const squeeze2 = smoothstep(555, 920, ms);
    // Micro-crunch tremor aligned to the 4 strongest acoustic peaks in crumble.mp3 (80, 225, 725, 890ms)
    const pulse = (peakMs, width) => Math.exp(-Math.pow((ms - peakMs) / width, 2));
    const crunchShake =
      pulse(82, 24) * 4.2 +
      pulse(228, 30) * 2.8 +
      pulse(310, 28) * 2.0 +
      pulse(728, 32) * 3.0 +
      pulse(892, 24) * 2.4;

    const tossPhase = Math.max(0, Math.min(1, (ms - TOSS_START) / (TOTAL_DUR - TOSS_START)));

    // Brief downward wind-up dip right at the end of Squeeze 2 before launching
    const windupY = ms > 820 && ms < 990 ? Math.sin(((ms - 820) / 170) * Math.PI) * 12 : 0;
    const tx = tossPhase * (window.innerWidth * 0.60 + 175);
    const ty = -Math.sin(tossPhase * Math.PI * 0.84) * 230 + tossPhase * tossPhase * 95 + windupY;
    const ballCx = centerX + tx;
    const ballCy = centerY + ty;

    // Slight hand twist during second squeeze, then snappy spin during throw
    const spin = squeeze2 * 0.42 + Math.pow(tossPhase, 1.55) * 9.2;
    // Compress ball noticeably tighter during Squeeze 2 (1.14 -> 0.88), then shrink in flight
    const crushScale = 1.14 - 0.26 * squeeze2;
    const flightScale = 1.0 - 0.74 * Math.pow(tossPhase, 1.15);
    const scale = crushScale * flightScale;
    const alpha = tossPhase > 0.78 ? Math.max(0, 1 - (tossPhase - 0.78) / 0.22) : 1;

    const cosS = Math.cos(spin), sinS = Math.sin(spin);

    const cur = verts.map(vt => {
      const lc = Math.max(0, Math.min(1, (cPhase - vt.delay) / Math.max(0.12, 1 - vt.delay)));
      const ease = lc < 0.5 ? 4 * lc * lc * lc : 1 - Math.pow(-2 * lc + 2, 3) / 2;
      const rx = (vt.bx * cosS - vt.by * sinS) * scale;
      const ry = (vt.bx * sinS + vt.by * cosS) * scale;
      const jx = Math.cos(vt.jitterPhase + ms * 0.04) * crunchShake * ease;
      const jy = Math.sin(vt.jitterPhase + ms * 0.04) * crunchShake * ease;
      const x = vt.sx * (1 - ease) + (ballCx + rx) * ease + jx;
      const y = vt.sy * (1 - ease) + (ballCy + ry) * ease + jy;
      return { u: vt.u, v: vt.v, x, y, z: vt.bz * ease * (0.85 + 0.35 * squeeze2) };
    });

    // Lifted paper sheet shadow (visible during initial fold so even a blank napkin clearly detaches!)
    const sheetShadowAlpha = Math.sin(Math.min(1, cPhase) * Math.PI) * 0.20 * (1 - tossPhase);
    if (sheetShadowAlpha > 0.006) {
      octx.save();
      octx.fillStyle = `rgba(48, 34, 16, ${sheetShadowAlpha.toFixed(3)})`;
      octx.beginPath();
      borderIdx.forEach((vi, idx) => {
        const pt = cur[vi];
        if (idx === 0) octx.moveTo(pt.x + 8, pt.y + 12);
        else octx.lineTo(pt.x + 8, pt.y + 12);
      });
      octx.closePath();
      octx.fill();
      octx.restore();
    }

    // Soft cast shadow beneath crumpled ball (separates downward during throw)
    const shadowAlpha = (0.20 * Math.pow(cPhase, 1.35)) * (1 - tossPhase * 0.85);
    if (shadowAlpha > 0.005) {
      octx.save();
      octx.fillStyle = `rgba(50, 36, 18, ${shadowAlpha.toFixed(3)})`;
      octx.beginPath();
      const sRad = ballR * (0.95 + (1 - cPhase) * 1.35) * scale;
      octx.ellipse(ballCx + 10, ballCy + 18 + tossPhase * 90, sRad, sRad * 0.55, 0, 0, Math.PI * 2);
      octx.fill();
      octx.restore();
    }

    // Painter's algorithm: sort triangles back-to-front by average z
    const sorted = tris.map(([i0, i1, i2]) => {
      const p0 = cur[i0], p1 = cur[i1], p2 = cur[i2];
      const avgZ = (p0.z + p1.z + p2.z) / 3;
      const ux = p1.x - p0.x, uy = p1.y - p0.y, uz = (p1.z - p0.z) * 30;
      const vx = p2.x - p0.x, vy = p2.y - p0.y, vz = (p2.z - p0.z) * 30;
      const nx = uy * vz - uz * vy;
      const ny = uz * vx - ux * vz;
      const nz = ux * vy - uy * vx;
      const nl = Math.hypot(nx, ny, nz) || 1;
      const dot = (nx * -0.5 + ny * -0.6 + Math.abs(nz) * 0.62) / nl;
      const shade = (dot - 0.50) * Math.min(1.15, cPhase * 1.55);
      return { p0, p1, p2, avgZ, shade };
    }).sort((a, b) => a.avgZ - b.avgZ);

    octx.save();
    octx.globalAlpha = alpha;
    for (const tr of sorted) {
      drawTexturedTriangle(
        octx, snap,
        tr.p0.u, tr.p0.v, tr.p1.u, tr.p1.v, tr.p2.u, tr.p2.v,
        tr.p0.x, tr.p0.y, tr.p1.x, tr.p1.y, tr.p2.x, tr.p2.y,
        tr.shade
      );
    }
    octx.restore();

    if (t < 1) {
      crumpleRaf = requestAnimationFrame(step);
    } else {
      overlay.style.display = 'none';
      crumpleRaf = null;
    }
  }

  crumpleRaf = requestAnimationFrame(step);
}

// ============================================================================
// 6. CANVAS ENGINE: SELECT + RESIZE + DELETE + LIVE TYPING + 600ms SKETCH
// ============================================================================
const canvas = document.getElementById('c');
const inlineInput = document.getElementById('inline-text');
let tool = 'sketch';
let items = [];
let activeRaw = null;
let pendingStrokes = [];
let pendingMode = null;
let pendingTimer = null;
let dragShape = null;

// Selection, Drag & Resize state
let selectedItem = null;
let hoverItem = null;
let dragItem = null, dragOff = [0, 0], dragMoved = false;
let resizeState = null; // { item, handle:'nw'|'ne'|'sw'|'se', origBox, origSnap }

let typingTarget = null;
let caretVisible = true;
let caretTimer = null;
let renderQueued = false;

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function flushPendingNow() {
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  if (!pendingStrokes.length) return;
  const batch = pendingStrokes;
  const mode = pendingMode || tool;
  pendingStrokes = [];
  pendingMode = null;
  if (mode === 'handwrite') items.push(buildHandwriteObject(batch));
  else items.push(recognizeMultiStroke(batch));
  scheduleRender();
}

function setTool(t) {
  flushPendingNow();
  tool = t;
  hoverItem = null;
  if (t !== 'move') selectedItem = null;
  document.querySelectorAll('button.tool-btn[id^="t-"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('t-' + t);
  if (btn) btn.classList.add('active');
  canvas.style.cursor = t === 'move' ? 'default' : (t === 'text' ? 'text' : 'crosshair');
  scheduleRender();
}

function getResizeHandles(it) {
  const pad = 5;
  return [
    { id: 'nw', x: it.x - pad,        y: it.y - pad,        cursor: 'nwse-resize' },
    { id: 'ne', x: it.x + it.w + pad, y: it.y - pad,        cursor: 'nesw-resize' },
    { id: 'sw', x: it.x - pad,        y: it.y + it.h + pad, cursor: 'nesw-resize' },
    { id: 'se', x: it.x + it.w + pad, y: it.y + it.h + pad, cursor: 'nwse-resize' }
  ];
}

function hitResizeHandle(it, px, py) {
  if (!it) return null;
  for (const h of getResizeHandles(it)) {
    if (Math.abs(px - h.x) <= 7 && Math.abs(py - h.y) <= 7) return h;
  }
  return null;
}

function snapshotItemGeometry(it) {
  return {
    x: it.x, y: it.y, w: it.w, h: it.h,
    x1: it.x1, y1: it.y1, x2: it.x2, y2: it.y2,
    anchorX: it.anchorX, anchorY: it.anchorY,
    strokes: it.strokes.map(s => s.pts.map(p => [p[0], p[1], p[2]])),
    textStrokes: it.textStrokes ? it.textStrokes.map(s => s.pts.map(p => [p[0], p[1], p[2]])) : null,
    rawList: it.rawList ? it.rawList.map(r => r.map(p => ({ x: p.x, y: p.y }))) : null
  };
}

function applyLiveResize(it, snap, newX, newY, newW, newH) {
  const sx = newW / Math.max(1, snap.w);
  const sy = newH / Math.max(1, snap.h);
  const mapX = x => newX + (x - snap.x) * sx;
  const mapY = y => newY + (y - snap.y) * sy;

  it.x = newX; it.y = newY; it.w = newW; it.h = newH;
  it.strokes.forEach((s, si) => {
    const orig = snap.strokes[si];
    for (let i = 0; i < orig.length; i++) {
      s.pts[i][0] = mapX(orig[i][0]);
      s.pts[i][1] = mapY(orig[i][1]);
    }
  });
  if (it.textStrokes && snap.textStrokes) {
    it.textStrokes.forEach((s, si) => {
      const orig = snap.textStrokes[si];
      for (let i = 0; i < orig.length; i++) {
        s.pts[i][0] = mapX(orig[i][0]);
        s.pts[i][1] = mapY(orig[i][1]);
      }
    });
  }
  if (it.rawList && snap.rawList) {
    it.rawList.forEach((r, ri) => {
      const orig = snap.rawList[ri];
      for (let i = 0; i < orig.length; i++) {
        r[i].x = mapX(orig[i].x);
        r[i].y = mapY(orig[i].y);
      }
    });
  }
  if (snap.anchorX !== undefined) {
    it.anchorX = mapX(snap.anchorX);
    it.anchorY = mapY(snap.anchorY);
  }
  if (snap.x1 !== undefined) {
    it.x1 = mapX(snap.x1); it.y1 = mapY(snap.y1);
    it.x2 = mapX(snap.x2); it.y2 = mapY(snap.y2);
  }
}

function finalizeResize(it) {
  if (it.kind === 'shape') {
    // Re-generate crisp OpenSketch designer strokes at new dimensions
    it.strokes = buildShapeStrokes(it.shapeType, it.x, it.y, it.w, it.h, it.color);
    // Re-layout cached cursive label cleanly inside the resized shape (0ms via wordCache!)
    if (it.label) {
      const maxW = it.shapeType === 'diamond' ? it.w * 0.62 : it.w * 0.84;
      const targetH = Math.min(34, Math.max(16, it.h * 0.48));
      synthesizeCursiveStreaming(it.label, it.x + it.w / 2, it.y + it.h / 2, targetH, maxW, it.color, it, null, it.styleKey || currentStyleKey, 'center');
    }
  } else if (it.kind === 'arrow' && it.x1 !== undefined) {
    const fresh = buildArrowItem(it.x1, it.y1, it.x2, it.y2, it.color);
    it.strokes = fresh.strokes;
    it.x = fresh.x; it.y = fresh.y; it.w = fresh.w; it.h = fresh.h;
  }
}

function drawPStroke(ctx, pts, baseW, color, alphaScale) {
  if (!pts || pts.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0, p0] = pts[i - 1], [x1, y1, p1] = pts[i];
    const p = (p0 + p1) * 0.5;
    ctx.lineWidth = Math.max(0.5, baseW * (0.28 + 1.12 * p));
    ctx.globalAlpha = Math.min(0.96, (0.46 + 0.52 * p) * alphaScale);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();
}

function drawRawPreview(ctx, rawPts, color) {
  if (!rawPts || rawPts.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.strokeStyle = color; ctx.lineWidth = 1.9; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 0.62;
  ctx.beginPath(); ctx.moveTo(rawPts[0].x, rawPts[0].y);
  for (let i = 1; i < rawPts.length; i++) ctx.lineTo(rawPts[i].x, rawPts[i].y);
  ctx.stroke();
  ctx.restore();
}

function render() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(r.width * dpr), ch = Math.round(r.height * dpr);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawNapkinBackground(ctx, r.width, r.height);

  for (const it of items) {
    for (const s of it.strokes) drawPStroke(ctx, s.pts, s.baseW, s.color, s.alpha);
    if (it.textStrokes) for (const s of it.textStrokes) drawPStroke(ctx, s.pts, s.baseW, s.color, s.alpha);
  }

  // Direct napkin-only text editing UI (no secondary input box!)
  if (typingTarget) {
    const val = inlineInput.value || '';
    const len = val.length;
    const selStart = Math.min(len, inlineInput.selectionStart ?? len);
    const selEnd = Math.min(len, inlineInput.selectionEnd ?? len);
    const trailingSpaces = (val.match(/\s+$/) || [''])[0].length;

    let minX = typingTarget.x, maxX = typingTarget.x;
    let cx = typingTarget.x, cy = typingTarget.y, chH = 26, col = currentColor;

    if (typingTarget.shapeRef) {
      const sh = typingTarget.shapeRef;
      col = sh.color;
      cy = sh.y + sh.h / 2;
      chH = Math.min(26, Math.max(16, sh.h * 0.48));

      // Subtle paper-native focus highlight around the active shape
      ctx.save();
      ctx.strokeStyle = 'rgba(35, 32, 28, 0.30)';
      ctx.lineWidth = 1.1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(sh.x - 4, sh.y - 4, sh.w + 8, sh.h + 8);
      ctx.restore();

      if (sh.textStrokes && sh.textStrokes.length) {
        minX = 1e9; maxX = -1e9;
        for (const s of sh.textStrokes) {
          for (const pt of s.pts) {
            if (pt[0] < minX) minX = pt[0];
            if (pt[0] > maxX) maxX = pt[0];
          }
        }
        const effMaxX = maxX + trailingSpaces * 10;
        if (selEnd >= len) cx = effMaxX + 5;
        else cx = minX + (effMaxX - minX) * (selEnd / Math.max(1, len));
      } else {
        minX = sh.x + sh.w / 2;
        maxX = minX + trailingSpaces * 10;
        cx = maxX;
        if (len === 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(110, 100, 87, 0.42)';
          ctx.font = 'italic 12px Georgia, "Times New Roman", serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('Type label...', sh.x + sh.w / 2, cy);
          ctx.restore();
        }
      }
    } else if (typingTarget.textItem) {
      const ti = typingTarget.textItem;
      col = ti.color;
      cy = ti.anchorY;
      chH = 28;
      minX = ti.anchorX;
      const hasInk = ti.strokes && ti.strokes.length > 0;
      const effMaxX = hasInk ? (ti.x + ti.w + trailingSpaces * 12) : (ti.anchorX + trailingSpaces * 12);
      maxX = effMaxX;
      if (selEnd >= len) cx = hasInk ? (effMaxX + 5) : effMaxX;
      else cx = minX + (effMaxX - minX) * (selEnd / Math.max(1, len));

      // Subtle napkin baseline guide directly beneath the text area
      const lineEnd = Math.max(ti.anchorX + 116, effMaxX + 18);
      ctx.save();
      ctx.strokeStyle = 'rgba(92, 74, 52, 0.28)';
      ctx.lineWidth = 1.1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(ti.anchorX - 3, cy + chH * 0.56);
      ctx.lineTo(lineEnd, cy + chH * 0.56);
      ctx.stroke();
      ctx.restore();

      if (len === 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(110, 100, 87, 0.44)';
        ctx.font = 'italic 14px Georgia, "Times New Roman", serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText('Type on napkin...', ti.anchorX + 7, cy);
        ctx.restore();
      }
    }

    // Translucent highlight when user selects text (Ctrl+A / Shift+Arrows)
    if (selStart !== selEnd && len > 0 && maxX > minX) {
      const sx0 = minX + (maxX - minX) * (selStart / len);
      const sx1 = minX + (maxX - minX) * (selEnd / len);
      ctx.save();
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.14;
      ctx.fillRect(sx0 - 2, cy - chH * 0.55, Math.max(6, sx1 - sx0 + 4), chH * 1.1);
      ctx.restore();
    }

    // Keep hidden IME focus proxy anchored right at the caret
    inlineInput.style.left = Math.max(4, Math.min(r.width - 8, cx)) + 'px';
    inlineInput.style.top = Math.max(4, Math.min(r.height - 30, cy - chH * 0.5)) + 'px';

    // Blinking ink caret directly on napkin
    if (caretVisible) {
      ctx.save();
      ctx.strokeStyle = col; ctx.globalAlpha = 0.78; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy - chH * 0.5); ctx.lineTo(cx, cy + chH * 0.5); ctx.stroke();
      ctx.restore();
    }
  }

  // Selection box + 4 corner resize handles (in Select/Move mode)
  if (tool === 'move' && hoverItem && hoverItem !== selectedItem && !dragItem && !resizeState) {
    ctx.save();
    ctx.strokeStyle = 'rgba(35, 32, 28, 0.25)'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.strokeRect(hoverItem.x - 5, hoverItem.y - 5, hoverItem.w + 10, hoverItem.h + 10);
    ctx.restore();
  }
  if (selectedItem && items.includes(selectedItem)) {
    ctx.save();
    ctx.strokeStyle = 'rgba(35, 32, 28, 0.58)'; ctx.lineWidth = 1.1; ctx.setLineDash([4, 3]);
    ctx.strokeRect(selectedItem.x - 5, selectedItem.y - 5, selectedItem.w + 10, selectedItem.h + 10);
    ctx.setLineDash([]);
    for (const h of getResizeHandles(selectedItem)) {
      ctx.fillStyle = '#f8f3ea';
      ctx.strokeStyle = '#23201c';
      ctx.lineWidth = 1.4;
      ctx.fillRect(h.x - 3.5, h.y - 3.5, 7, 7);
      ctx.strokeRect(h.x - 3.5, h.y - 3.5, 7, 7);
    }
    ctx.restore();
  }

  for (const ps of pendingStrokes) drawRawPreview(ctx, ps, currentColor);
  if (activeRaw) drawRawPreview(ctx, activeRaw, currentColor);

  if (dragShape && dragShape.cur) {
    const x1 = dragShape.x, y1 = dragShape.y, x2 = dragShape.cur.x, y2 = dragShape.cur.y;
    const x = Math.min(x1, x2), y = Math.min(y1, y2), w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    ctx.save();
    ctx.strokeStyle = currentColor; ctx.globalAlpha = 0.55; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.4;
    if (tool === 'arrow') { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
    else if (tool === 'oval') { ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.stroke(); }
    else if (tool === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w, y + h / 2);
      ctx.lineTo(x + w / 2, y + h); ctx.lineTo(x, y + h / 2); ctx.closePath(); ctx.stroke();
    } else ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }
}

function stopCaretBlink() {
  if (caretTimer) { clearInterval(caretTimer); caretTimer = null; }
}

function openTextBox(x, y, shapeRef = null, existingTextItem = null) {
  flushPendingNow();
  stopCaretBlink();
  selectedItem = null;
  let textItem = existingTextItem;
  let wasNew = false;
  let snapshot = null;

  if (shapeRef) {
    snapshot = {
      text: shapeRef.label || '',
      strokes: shapeRef.textStrokes ? shapeRef.textStrokes.slice() : [],
      cache: shapeRef.wordCache ? shapeRef.wordCache.slice() : [],
      cacheStyle: shapeRef.wordCacheStyle
    };
  } else if (existingTextItem) {
    snapshot = {
      text: existingTextItem.text || '',
      strokes: existingTextItem.strokes ? existingTextItem.strokes.slice() : [],
      cache: existingTextItem.wordCache ? existingTextItem.wordCache.slice() : [],
      cacheStyle: existingTextItem.wordCacheStyle
    };
  } else {
    wasNew = true;
    textItem = {
      kind: 'text', text: '', styleKey: currentStyleKey,
      anchorX: x, anchorY: y,
      x, y: y - 16, w: 20, h: 32,
      color: currentColor, strokes: [], wordCache: [], wordCacheStyle: currentStyleKey
    };
    items.push(textItem);
  }

  typingTarget = { x, y, shapeRef, textItem, wasNew, snapshot, openedAt: performance.now(), lastLen: 0 };

  // Keep #inline-text invisible at the napkin caret (only as a keyboard/IME focus proxy)
  const r = canvas.getBoundingClientRect();
  const anchorX = shapeRef ? (shapeRef.x + shapeRef.w / 2) : textItem.anchorX;
  const anchorY = shapeRef ? (shapeRef.y + shapeRef.h / 2) : textItem.anchorY;
  inlineInput.style.left = Math.max(4, Math.min(r.width - 8, anchorX)) + 'px';
  inlineInput.style.top = Math.max(4, Math.min(r.height - 30, anchorY - 14)) + 'px';
  inlineInput.style.display = 'block';
  inlineInput.value = shapeRef ? (shapeRef.label || '') : (textItem.text || '');
  typingTarget.lastLen = inlineInput.value.length;
  inlineInput.focus({ preventScroll: true });
  requestAnimationFrame(() => {
    if (!typingTarget) return;
    inlineInput.focus({ preventScroll: true });
    inlineInput.setSelectionRange(inlineInput.value.length, inlineInput.value.length);
  });

  caretVisible = true;
  caretTimer = setInterval(() => { caretVisible = !caretVisible; scheduleRender(); }, 530);
  scheduleRender();
}

function onLiveTextInput() {
  if (!typingTarget) return;
  caretVisible = true;
  const val = inlineInput.value;
  if (val.length > typingTarget.lastLen && val.trim().length > 0) {
    NapkinAudio.triggerTypingPulse();
  }
  typingTarget.lastLen = val.length;
  if (typingTarget.shapeRef) {
    const it = typingTarget.shapeRef;
    it.label = val;
    it.styleKey = currentStyleKey;
    const maxW = it.shapeType === 'diamond' ? it.w * 0.62 : it.w * 0.84;
    const targetH = Math.min(30, Math.max(18, it.h * 0.48));
    synthesizeCursiveStreaming(val, it.x + it.w / 2, it.y + it.h / 2, targetH, maxW, it.color, it, null, currentStyleKey, 'center');
  } else if (typingTarget.textItem) {
    const ti = typingTarget.textItem;
    ti.text = val;
    ti.styleKey = currentStyleKey;
    synthesizeCursiveStreaming(val, ti.anchorX, ti.anchorY, 32, 640, ti.color, null, ti, currentStyleKey, 'left');
  }
  scheduleRender();
}

function commitTextBox() {
  if (!typingTarget) return;
  const tgt = typingTarget;
  typingTarget = null;
  stopCaretBlink();
  const val = inlineInput.value.trim();
  inlineInput.blur();
  inlineInput.style.display = 'none';

  if (!val) {
    if (tgt.shapeRef) { tgt.shapeRef.label = ''; tgt.shapeRef.textStrokes = []; tgt.shapeRef.wordCache = []; }
    else if (tgt.textItem) { const idx = items.indexOf(tgt.textItem); if (idx !== -1) items.splice(idx, 1); }
  } else if (tgt.shapeRef) tgt.shapeRef.label = val;
  else if (tgt.textItem) tgt.textItem.text = val;
  scheduleRender();
}

function cancelTextBox() {
  if (!typingTarget) return;
  const tgt = typingTarget;
  typingTarget = null;
  stopCaretBlink();
  inlineInput.blur();
  inlineInput.style.display = 'none';

  if (tgt.wasNew && tgt.textItem) {
    tgt.textItem.latestReqId = ++reqCounter;
    const idx = items.indexOf(tgt.textItem);
    if (idx !== -1) items.splice(idx, 1);
  } else if (tgt.snapshot) {
    const owner = tgt.shapeRef || tgt.textItem;
    owner.latestReqId = ++reqCounter;
    if (tgt.shapeRef) { tgt.shapeRef.label = tgt.snapshot.text; tgt.shapeRef.textStrokes = tgt.snapshot.strokes; }
    else if (tgt.textItem) { tgt.textItem.text = tgt.snapshot.text; tgt.textItem.strokes = tgt.snapshot.strokes; }
    owner.wordCache = tgt.snapshot.cache;
    owner.wordCacheStyle = tgt.snapshot.cacheStyle;
  }
  scheduleRender();
}

function isPointInsideTypingTarget(x, y) {
  if (!typingTarget) return false;
  if (typingTarget.shapeRef) {
    const sh = typingTarget.shapeRef;
    return x >= sh.x - 6 && x <= sh.x + sh.w + 6 && y >= sh.y - 6 && y <= sh.y + sh.h + 6;
  }
  if (typingTarget.textItem) {
    const ti = typingTarget.textItem;
    const w = Math.max(120, ti.w + 24);
    return x >= ti.anchorX - 8 && x <= ti.anchorX + w && y >= ti.anchorY - 22 && y <= ti.anchorY + 22;
  }
  return false;
}

inlineInput.addEventListener('input', onLiveTextInput);
inlineInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); commitTextBox(); return; }
  if (e.key === 'Escape') { e.preventDefault(); cancelTextBox(); return; }
  caretVisible = true;
  scheduleRender();
});
inlineInput.addEventListener('keyup', () => { if (typingTarget) { caretVisible = true; scheduleRender(); } });
inlineInput.addEventListener('select', () => { if (typingTarget) scheduleRender(); });
inlineInput.addEventListener('blur', () => {
  if (typingTarget && (performance.now() - typingTarget.openedAt) < 160) {
    inlineInput.focus({ preventScroll: true });
    return;
  }
  commitTextBox();
});

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function hitItem(x, y) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (x >= it.x - 8 && x <= it.x + it.w + 8 && y >= it.y - 8 && y <= it.y + it.h + 8) return it;
  }
  return null;
}

canvas.addEventListener('pointerdown', e => {
  const p = getPos(e);

  if (typingTarget) {
    // Clicking inside the active napkin text area keeps typing focus there
    if (isPointInsideTypingTarget(p.x, p.y)) {
      e.preventDefault();
      inlineInput.focus({ preventScroll: true });
      caretVisible = true;
      scheduleRender();
      return;
    }
    commitTextBox();
    // In Text tool, clicking another spot seamlessly starts typing there
    if (tool !== 'text') return;
  }

  if (tool === 'text') {
    e.preventDefault();
    const hit = hitItem(p.x, p.y);
    if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
    else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
    else openTextBox(p.x, p.y, null, null);
    return;
  }

  canvas.setPointerCapture(e.pointerId);

  if (tool === 'move') {
    // 1. Check resize handles on currently selected item FIRST!
    if (selectedItem) {
      const h = hitResizeHandle(selectedItem, p.x, p.y);
      if (h) {
        resizeState = { item: selectedItem, handle: h.id, snap: snapshotItemGeometry(selectedItem) };
        canvas.style.cursor = h.cursor;
        scheduleRender();
        return;
      }
    }
    // 2. Hit-test objects to select / drag
    const hit = hitItem(p.x, p.y);
    selectedItem = hit;
    if (hit) {
      dragItem = hit;
      dragOff = [p.x, p.y];
      dragMoved = false;
      canvas.style.cursor = 'grabbing';
    }
    scheduleRender();
    return;
  }

  if (tool === 'box' || tool === 'oval' || tool === 'diamond' || tool === 'arrow') {
    flushPendingNow();
    dragShape = { x: p.x, y: p.y, cur: p };
    NapkinAudio.startDraw(p.x, p.y);
    scheduleRender();
    return;
  }

  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  pendingMode = tool;
  activeRaw = [p];
  NapkinAudio.startDraw(p.x, p.y);
  scheduleRender();
});

canvas.addEventListener('pointermove', e => {
  const p = getPos(e);

  if (resizeState) {
    const { item, handle, snap } = resizeState;
    const minW = 28, minH = 22;
    let x = snap.x, y = snap.y, w = snap.w, h = snap.h;
    const right = snap.x + snap.w, bottom = snap.y + snap.h;
    if (handle.includes('e')) w = Math.max(minW, p.x - snap.x);
    if (handle.includes('s')) h = Math.max(minH, p.y - snap.y);
    if (handle.includes('w')) { x = Math.min(right - minW, p.x); w = right - x; }
    if (handle.includes('n')) { y = Math.min(bottom - minH, p.y); h = bottom - y; }
    applyLiveResize(item, snap, x, y, w, h);
    scheduleRender();
    return;
  }

  if (dragItem) {
    const dx = p.x - dragOff[0], dy = p.y - dragOff[1];
    if (Math.hypot(dx, dy) > 1.5) dragMoved = true;
    dragOff = [p.x, p.y];
    dragItem.x += dx; dragItem.y += dy;
    if (dragItem.anchorX !== undefined) { dragItem.anchorX += dx; dragItem.anchorY += dy; }
    if (dragItem.x1 !== undefined) { dragItem.x1 += dx; dragItem.y1 += dy; dragItem.x2 += dx; dragItem.y2 += dy; }
    const shift = s => { for (const pt of s.pts) { pt[0] += dx; pt[1] += dy; } };
    dragItem.strokes.forEach(shift);
    if (dragItem.textStrokes) dragItem.textStrokes.forEach(shift);
    if (dragItem.rawList) for (const r of dragItem.rawList) for (const pt of r) { pt.x += dx; pt.y += dy; }
    scheduleRender();
    return;
  }

  if (tool === 'move') {
    const rh = hitResizeHandle(selectedItem, p.x, p.y);
    if (rh) { canvas.style.cursor = rh.cursor; return; }
    const h = hitItem(p.x, p.y);
    canvas.style.cursor = h ? 'grab' : 'default';
    if (h !== hoverItem) { hoverItem = h; scheduleRender(); }
    return;
  }

  if (dragShape) {
    dragShape.cur = p;
    NapkinAudio.updateDraw(p.x, p.y);
    scheduleRender();
    return;
  }
  if (activeRaw) {
    activeRaw.push(p);
    NapkinAudio.updateDraw(p.x, p.y);
    scheduleRender();
  }
});

canvas.addEventListener('pointerup', e => {
  const p = getPos(e);
  NapkinAudio.stopDraw();

  if (resizeState) {
    const it = resizeState.item;
    resizeState = null;
    finalizeResize(it);
    canvas.style.cursor = 'default';
    scheduleRender();
    return;
  }

  if (dragItem) {
    dragItem = null;
    canvas.style.cursor = 'grab';
    scheduleRender();
    return;
  }

  if (dragShape && dragShape.cur) {
    const x1 = dragShape.x, y1 = dragShape.y, x2 = dragShape.cur.x, y2 = dragShape.cur.y;
    dragShape = null;
    const dist = Math.hypot(x2 - x1, y2 - y1);
    if (dist < 5) {
      const hit = hitItem(p.x, p.y);
      if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
      else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
      else openTextBox(p.x, p.y, null, null);
    } else if (tool === 'arrow' && dist > 16) {
      items.push(buildArrowItem(x1, y1, x2, y2));
    } else if (Math.abs(x2 - x1) > 18 && Math.abs(y2 - y1) > 14) {
      items.push(buildShapeItem(tool, Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)));
    }
    scheduleRender();
    return;
  }

  if (activeRaw) {
    const pts = activeRaw;
    activeRaw = null;
    let arc = 0;
    for (let i = 1; i < pts.length; i++) arc += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);

    if (pendingMode === 'sketch' && !pendingStrokes.length && arc < 5) {
      pendingMode = null;
      const hit = hitItem(p.x, p.y);
      if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
      else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
      else openTextBox(p.x, p.y, null, null);
      scheduleRender();
      return;
    }

    if (pts.length >= 2 || pendingMode === 'handwrite') {
      pendingStrokes.push(pts.length >= 2 ? pts : [pts[0], { x: pts[0].x + 0.8, y: pts[0].y + 0.8 }]);
      pendingTimer = setTimeout(flushPendingNow, DEFAULTS.debounceMs);
    }
    scheduleRender();
  }
});

canvas.addEventListener('pointercancel', () => { NapkinAudio.stopDraw(); activeRaw = null; dragShape = null; });
canvas.addEventListener('lostpointercapture', () => { NapkinAudio.stopDraw(); });

// Double-click in Select mode edits a shape's label or text object
canvas.addEventListener('dblclick', e => {
  if (tool !== 'move') return;
  const p = getPos(e), hit = hitItem(p.x, p.y);
  if (hit && hit.kind === 'shape') openTextBox(hit.x + hit.w / 2, hit.y + hit.h / 2, hit, null);
  else if (hit && hit.kind === 'text') openTextBox(hit.anchorX ?? hit.x, hit.anchorY ?? (hit.y + hit.h / 2), null, hit);
});

// Keyboard shortcuts: Backspace/Delete deletes selected item; tool hotkeys; Ctrl/Cmd+Z undo
window.addEventListener('keydown', e => {
  if (typingTarget) return;
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if ((e.key === 'Backspace' || e.key === 'Delete') && selectedItem) {
    e.preventDefault();
    const idx = items.indexOf(selectedItem);
    if (idx !== -1) items.splice(idx, 1);
    selectedItem = null;
    hoverItem = null;
    scheduleRender();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  const k = e.key.toLowerCase();
  if (k === 's') setTool('sketch');
  else if (k === 'h') setTool('handwrite');
  else if (k === 't') setTool('text');
  else if (k === 'b') setTool('box');
  else if (k === 'o') setTool('oval');
  else if (k === 'd') setTool('diamond');
  else if (k === 'a') setTool('arrow');
  else if (k === 'v' || k === 'm') setTool('move');
});

function undo() {
  if (pendingStrokes.length) {
    pendingStrokes.pop();
    if (!pendingStrokes.length && pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  } else {
    const removed = items.pop();
    if (removed === selectedItem) selectedItem = null;
  }
  scheduleRender();
}

function toggleSaveMenu(e, forceState) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('save-menu');
  const btn = document.getElementById('save-btn');
  if (!menu) return;
  const open = typeof forceState === 'boolean' ? forceState : !menu.classList.contains('open');
  menu.classList.toggle('open', open);
  if (btn) btn.classList.toggle('active', open);
}

window.addEventListener('pointerdown', e => {
  const menu = document.getElementById('save-menu');
  if (menu && menu.classList.contains('open') && !e.target.closest('.save-wrap')) {
    toggleSaveMenu(null, false);
  }
});

function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (url.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function getCleanExportBg(w, h, scale = 2) {
  if (!napkinSpec) nextNapkin();
  return buildNapkinSheetCanvas(napkinSpec, w, h, scale);
}

function exportPNG() {
  toggleSaveMenu(null, false);
  if (typingTarget) commitTextBox();
  flushPendingNow();
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  const scale = 2;

  // Render clean 2x HiDPI composite (textured napkin background + ink strokes, no UI carets/handles)
  const out = document.createElement('canvas');
  out.width = w * scale;
  out.height = h * scale;
  const octx = out.getContext('2d');
  const bg = getCleanExportBg(w, h, scale);
  octx.drawImage(bg, 0, 0);

  octx.setTransform(scale, 0, 0, scale, 0, 0);
  for (const it of items) {
    for (const s of it.strokes) drawPStroke(octx, s.pts, s.baseW, s.color, s.alpha);
    if (it.textStrokes) for (const s of it.textStrokes) drawPStroke(octx, s.pts, s.baseW, s.color, s.alpha);
  }

  if (out.toBlob) {
    out.toBlob(blob => {
      if (blob) triggerDownload(URL.createObjectURL(blob), 'napkin-sketch.png');
    }, 'image/png');
  } else {
    triggerDownload(out.toDataURL('image/png'), 'napkin-sketch.png');
  }
}

function exportSVG() {
  toggleSaveMenu(null, false);
  if (typingTarget) commitTextBox();
  flushPendingNow();
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  const bgHex = napkinSpec ? napkinSpec.baseHex : '#e7dbc6';

  // Embed full textured napkin sheet (embossing, fibers, creases, border, vignette) inside the SVG!
  const bgCanvas = getCleanExportBg(w, h, 2);
  const bgDataUrl = bgCanvas.toDataURL('image/jpeg', 0.93);

  const inkLines = [];
  const emit = s => {
    for (let i = 1; i < s.pts.length; i++) {
      const [x0, y0, p0] = s.pts[i - 1], [x1, y1, p1] = s.pts[i];
      const p = (p0 + p1) * 0.5;
      inkLines.push(`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${s.color}" stroke-width="${(s.baseW * (0.28 + 1.12 * p)).toFixed(2)}" stroke-opacity="${((0.46 + 0.52 * p) * s.alpha).toFixed(2)}" stroke-linecap="round"/>`);
    }
  };
  for (const it of items) { it.strokes.forEach(emit); if (it.textStrokes) it.textStrokes.forEach(emit); }

  const svg = [
    `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`,
    `<rect width="${w}" height="${h}" fill="${bgHex}"/>`,
    `<image width="${w}" height="${h}" xlink:href="${bgDataUrl}" preserveAspectRatio="none"/>`,
    `<g style="mix-blend-mode:multiply">${inkLines.join('')}</g>`,
    `</svg>`
  ].join('');

  triggerDownload(URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' })), 'napkin-sketch.svg');
}

async function loadStarterScene() {
  const r = canvas.getBoundingClientRect();
  const ox = Math.max(40, (r.width - 560) * 0.5);
  const oy = Math.max(36, (r.height - 290) * 0.45);
  const s1 = buildShapeItem('oval', ox + 20, oy, 185, 62, 'Raw Idea');
  const a1 = buildArrowItem(ox + 112, oy + 66, ox + 112, oy + 116);
  const s2 = buildShapeItem('box', ox, oy + 122, 228, 66, 'Sketch on Napkin');
  const a2 = buildArrowItem(ox + 234, oy + 155, ox + 324, oy + 155);
  const s3 = buildShapeItem('diamond', ox + 332, oy + 112, 178, 86, 'Clear?');
  items = [s1, a1, s2, a2, s3];
  scheduleRender();
  await Promise.all([
    synthesizeCursiveStreaming(s1.label, s1.x + s1.w / 2, s1.y + s1.h / 2, 28, s1.w * 0.82, s1.color, s1, null),
    synthesizeCursiveStreaming(s2.label, s2.x + s2.w / 2, s2.y + s2.h / 2, 28, s2.w * 0.84, s2.color, s2, null),
    synthesizeCursiveStreaming(s3.label, s3.x + s3.w / 2, s3.y + s3.h / 2, 26, s3.w * 0.62, s3.color, s3, null)
  ]);
}

window.addEventListener('resize', () => {
  scheduleRender();
});

// Frame-1 instant kraft napkin render + default SFX init + background cached model loading
NapkinAudio.initUI();
scheduleRender();
cachedFetchJSON('../exports/opensketch_residual_vae.json').then(j => {
  VAE = j;
  loadStarterScene();
});
initWasmPool();
</script>
